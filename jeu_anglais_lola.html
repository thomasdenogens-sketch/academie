<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>English Kids CE1 - Lola</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); 
            color: #2c3e50; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.2); 
            max-width: 650px; width: 100%; text-align: center; position: relative; 
        }
        
        h1 { color: #e91e63; font-weight: 900; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-weight: bold; margin-bottom: 20px; font-size: 1.1rem; }
        
        .xp { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Menu des thèmes */
        #menu-themes { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn-theme {
            background: #f8f9fa; border: 3px solid #fecfef; padding: 15px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; color: #e91e63; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .btn-theme:hover { transform: translateY(-3px); border-color: #ff9a9e; box-shadow: 0 5px 15px rgba(255, 154, 158, 0.3); }
        .theme-icon { font-size: 2rem; }

        /* Zone de jeu */
        #zone-jeu { display: none; }
        
        .header-jeu { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;}
        .theme-actuel { font-size: 1.2rem; font-weight: 800; color: #9b59b6; }
        
        #mot-anglais-container { 
            background: #f8f9fa; padding: 25px; border-radius: 20px; 
            border: 3px dashed #e91e63; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        #mot-anglais { font-size: 2.5rem; font-weight: 900; color: #34495e; }
        
        .btn-audio { 
            background: #3498db; color: white; border: none; width: 50px; height: 50px; 
            border-radius: 50%; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 0 #2980b9; transition: 0.1s;
        }
        .btn-audio:active { transform: translateY(4px); box-shadow: none; }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .btn-opt { 
            background: #ffffff; border: 3px solid #cbd5e1; padding: 15px; border-radius: 15px; 
            font-size: 1.2rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s; 
        }
        .btn-opt:hover { border-color: #3498db; background: #f1f8ff; }
        .btn-opt.correct { background: #2ecc71; color: white; border-color: #27ae60; }
        .btn-opt.erreur { background: #e74c3c; color: white; border-color: #c0392b; }

        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-nav:hover { background: #7f8c8d; }
        
        #feedback { font-size: 1.4rem; font-weight: 900; height: 35px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="app">
        <div class="xp" id="hud-xp">XP: ... ⭐</div>
        
        <!-- MENU DES THÈMES -->
        <div id="zone-menu">
            <h1>Hello Lola ! 🇬🇧</h1>
            <p class="subtitle">Programme CE1 : Choisis ton entraînement</p>
            
            <div id="menu-themes">
                <button class="btn-theme" onclick="lancerTheme('famille')">
                    <span class="theme-icon">👨‍👩‍👧‍👦</span><span>La Famille</span>
                </button>
                <button class="btn-theme" onclick="lancerTheme('corps')">
                    <span class="theme-icon">👂</span><span>Le Corps</span>
                </button>
                <button class="btn-theme" onclick="lancerTheme('nombres')">
                    <span class="theme-icon">🔢</span><span>Les Nombres (1-20)</span>
                </button>
                <button class="btn-theme" onclick="lancerTheme('phrases')">
                    <span class="theme-icon">💬</span><span>Petites Phrases</span>
                </button>
            </div>
            <br>
            <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ZONE DE JEU -->
        <div id="zone-jeu">
            <div class="header-jeu">
                <span class="theme-actuel" id="titre-theme">Thème</span>
                <span style="color:#7f8c8d; font-weight:bold;">Série en cours</span>
            </div>

            <div id="mot-anglais-container">
                <div id="mot-anglais">...</div>
                <button class="btn-audio" onclick="ecouterMot()" title="Écouter la prononciation">🔊</button>
            </div>
            
            <div class="options" id="zone-options"></div>
            <div id="feedback"></div>

            <button class="btn-nav" onclick="retourMenu()">⬅️ Changer de thème</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/lola/anglaisLola.json`;
        
        let xpGlobale = 0;
        let themeActuel = null;
        let questionActuelle = null;
        let optionsMelangees = [];
        let bloque = false;

        // Base de données vocabulaire CE1
        const vocabulaire = {
            famille: [
                { en: "Mother", fr: "Mère" }, { en: "Father", fr: "Père" }, 
                { en: "Brother", fr: "Frère" }, { en: "Sister", fr: "Sœur" },
                { en: "Grandfather", fr: "Grand-père" }, { en: "Grandmother", fr: "Grand-mère" },
                { en: "Baby", fr: "Bébé" }, { en: "Family", fr: "Famille" }
            ],
            corps: [
                { en: "Head", fr: "Tête" }, { en: "Shoulders", fr: "Épaules" },
                { en: "Knees", fr: "Genoux" }, { en: "Toes", fr: "Orteils" },
                { en: "Eyes", fr: "Yeux" }, { en: "Ears", fr: "Oreilles" },
                { en: "Mouth", fr: "Bouche" }, { en: "Nose", fr: "Nez" }
            ],
            nombres: [
                { en: "Eleven", fr: "11" }, { en: "Twelve", fr: "12" },
                { en: "Thirteen", fr: "13" }, { en: "Fourteen", fr: "14" },
                { en: "Fifteen", fr: "15" }, { en: "Sixteen", fr: "16" },
                { en: "Twenty", fr: "20" }, { en: "Ten", fr: "10" }
            ],
            phrases: [
                { en: "Hello!", fr: "Bonjour !" }, { en: "Goodbye!", fr: "Au revoir !" },
                { en: "How are you?", fr: "Comment ça va ?" }, { en: "I am fine.", fr: "Je vais bien." },
                { en: "What is your name?", fr: "Comment t'appelles-tu ?" }, { en: "My name is Lola.", fr: "Je m'appelle Lola." },
                { en: "Thank you", fr: "Merci" }, { en: "Please", fr: "S'il te plaît" }
            ]
        };

        const titresThemes = {
            famille: "👨‍👩‍👧‍👦 La Famille", corps: "👂 Le Corps Humain", 
            nombres: "🔢 Les Nombres", phrases: "💬 Petites Phrases"
        };

        // --- GESTION DU CLOUD ---
        async function chargerXP() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) {
                    xpGlobale = parseInt(data.xp) || 0;
                }
                document.getElementById('hud-xp').textContent = `XP: ${xpGlobale} ⭐`;
            } catch(e) { console.error("Erreur Firebase:", e); }
        }

        async function ajouterXP(p) {
            xpGlobale += p;
            document.getElementById('hud-xp').textContent = `XP: ${xpGlobale} ⭐`;
            try {
                await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: xpGlobale }) });
            } catch(e) {}
        }

        // --- MOTEUR DE JEU ---
        function lancerTheme(theme) {
            themeActuel = theme;
            document.getElementById('zone-menu').style.display = 'none';
            document.getElementById('zone-jeu').style.display = 'block';
            document.getElementById('titre-theme').textContent = titresThemes[theme];
            NouvelleQuestion();
        }

        function retourMenu() {
            document.getElementById('zone-jeu').style.display = 'none';
            document.getElementById('zone-menu').style.display = 'block';
            themeActuel = null;
        }

        function NouvelleQuestion() {
            bloque = false;
            document.getElementById('feedback').textContent = "";
            const listeMots = vocabulaire[themeActuel];
            
            // Tirer un mot au hasard
            questionActuelle = listeMots[Math.floor(Math.random() * listeMots.length)];
            document.getElementById('mot-anglais').textContent = questionActuelle.en;
            
            // Prononcer automatiquement le mot (optionnel, on peut le laisser manuel au clic)
            // ecouterMot(); 

            // Créer les mauvaises réponses
            let mauvaisesReponses = [];
            while(mauvaisesReponses.length < 3) {
                let fauxMot = listeMots[Math.floor(Math.random() * listeMots.length)].fr;
                if(fauxMot !== questionActuelle.fr && !mauvaisesReponses.includes(fauxMot)) {
                    mauvaisesReponses.push(fauxMot);
                }
            }

            // Mélanger la bonne réponse avec les mauvaises
            optionsMelangees = [questionActuelle.fr, ...mauvaisesReponses];
            optionsMelangees.sort(() => Math.random() - 0.5);

            // Afficher les boutons
            const zone = document.getElementById('zone-options');
            zone.innerHTML = "";

            optionsMelangees.forEach((opt) => {
                let b = document.createElement('button');
                b.className = "btn-opt";
                b.textContent = opt;
                b.onclick = () => verifierReponse(b, opt === questionActuelle.fr);
                zone.appendChild(b);
            });
        }

        function verifierReponse(bouton, estCorrect) {
            if(bloque) return;
            bloque = true; // Empêche de cliquer plusieurs fois

            const fb = document.getElementById('feedback');
            
            if (estCorrect) {
                bouton.classList.add('correct');
                fb.textContent = "🌟 YES! Good job Lola !";
                fb.style.color = "#2ecc71";
                ajouterXP(5);
                setTimeout(NouvelleQuestion, 1500);
            } else {
                bouton.classList.add('erreur');
                
                // Montrer la bonne réponse en vert
                document.querySelectorAll('.btn-opt').forEach(b => {
                    if(b.textContent === questionActuelle.fr) b.classList.add('correct');
                });

                fb.textContent = "❌ Oh no... Regarde la correction !";
                fb.style.color = "#e74c3c";
                setTimeout(NouvelleQuestion, 2500);
            }
        }

        // --- SYNTHÈSE VOCALE ---
        function ecouterMot() {
            if (!questionActuelle) return;
            
            // On utilise l'API native du navigateur pour prononcer le texte
            const utterance = new SpeechSynthesisUtterance(questionActuelle.en);
            utterance.lang = 'en-GB'; // Accent britannique (ou 'en-US' pour américain)
            utterance.rate = 0.85; // Légèrement ralenti pour que ce soit clair
            window.speechSynthesis.speak(utterance);
        }

        chargerXP();
    </script>
</body>
</html>
