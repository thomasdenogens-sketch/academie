<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Code & Logique CM2 - L'Académie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); 
            color: #333; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-width: 800px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #2980b9; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* La grille du labyrinthe s'adapte dynamiquement */
        #grille-labyrinthe {
            display: grid; gap: 2px; background: #bdc3c7; padding: 5px; border-radius: 10px;
            margin: 0 auto 20px auto; width: fit-content; border: 4px solid #34495e;
            transition: all 0.3s;
        }
        .cellule {
            width: 45px; height: 45px; background: #ecf0f1; border-radius: 5px;
            display: flex; justify-content: center; align-items: center; font-size: 1.5rem;
            transition: background 0.2s;
        }
        .mur { background: #34495e; }
        .robot { background: #f1c40f; box-shadow: inset 0 0 10px rgba(230, 126, 34, 0.5); }
        .sortie { background: #2ecc71; box-shadow: inset 0 0 10px rgba(39, 174, 96, 0.5); }
        .erreur { background: #e74c3c !important; }

        #sequence-container {
            background: #f8f9fa; min-height: 70px; padding: 10px; border-radius: 10px;
            border: 2px dashed #95a5a6; margin-bottom: 20px;
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; align-items: center;
        }
        .cmd-bulle {
            background: #3498db; color: white; width: 40px; height: 40px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 4px 0 #2980b9; transition: 0.1s;
        }
        .cmd-bulle:active { transform: translateY(4px); box-shadow: none; }
        .cmd-bulle.active { background: #e67e22; box-shadow: 0 4px 0 #d35400; transform: scale(1.1); }

        #clavier-commandes { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn-cmd {
            background: #ecf0f1; border: 3px solid #bdc3c7; padding: 15px 20px; border-radius: 12px;
            font-size: 1.5rem; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 #bdc3c7;
        }
        .btn-cmd:active { transform: translateY(4px); box-shadow: none; }
        .btn-cmd:hover { background: #e2e8f0; }

        .btn { font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: bold; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; color: white; margin: 5px; transition: transform 0.1s; display: inline-block;}
        .btn:active { transform: scale(0.95); }
        .btn-primaire { background: #27ae60; box-shadow: 0 4px #219a52; }
        .btn-secondaire { background: #95a5a6; box-shadow: 0 4px #7f8c8d; color:#2c3e50;}
        .btn-danger { background: #e74c3c; box-shadow: 0 4px #c0392b; }

        #feedback { font-size: 1.4rem; font-weight: 900; height: 35px; margin: 15px 0; }
        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp-jeu">...</span> ⭐</div>

        <!-- ECRAN D'ACCUEIL -->
        <div id="ecran-accueil" class="ecran actif">
            <h1>Code & Logique 🤖</h1>
            <p class="sous-titre">Génération de Labyrinthes Infinis</p>
            
            <p style="font-size: 1.1rem; color: #2c3e50; font-weight: bold; margin-bottom: 25px;">
                L'ordinateur va générer un nouveau défi à chaque fois. Programme le chemin parfait pour guider le robot 🤖 vers la sortie 🏁 !
            </p>

            <button class="btn btn-primaire" style="font-size: 1.3rem; padding: 15px 40px;" onclick="lancerJeuInfi()">Générer un niveau</button>
            <br>
            <button class="btn btn-secondaire" style="margin-top: 20px;" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 10px;">
                <h2 style="color: #2980b9; margin: 0;" id="titre-niveau">Niveau 1</h2>
                <button class="btn btn-secondaire" style="padding: 5px 10px; font-size:0.9rem;" onclick="genererNiveauAleatoire()">↻ Nouveau Labyrinthe</button>
            </div>
            
            <div id="grille-labyrinthe"></div>

            <div style="text-align: left; font-weight: bold; color: #7f8c8d; margin-bottom: 5px;">Ton Algorithme :</div>
            <div id="sequence-container"></div>

            <div id="clavier-commandes">
                <button class="btn-cmd" onclick="ajouterCommande('Haut')">⬆️</button>
                <button class="btn-cmd" onclick="ajouterCommande('Gauche')">⬅️</button>
                <button class="btn-cmd" onclick="ajouterCommande('Bas')">⬇️</button>
                <button class="btn-cmd" onclick="ajouterCommande('Droite')">➡️</button>
            </div>

            <div id="feedback"></div>

            <div>
                <button class="btn btn-danger" onclick="effacerSequence()">🔄 Effacer le code</button>
                <button class="btn btn-primaire" id="btn-executer" onclick="executerSequence()">▶️ Exécuter</button>
            </div>
            
            <button class="btn btn-secondaire" style="margin-top:20px;" onclick="retourAccueil()">Terminer la session</button>
        </div>

    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/codeSaveV1.json`;

        let profil = { xp: 0 };
        
        let compteurNiveau = 1;
        let grilleOriginale = [];
        let grilleDynamique = []; 
        let posRobot = { x: 0, y: 0 };
        let sequenceCommandes = [];
        let estEnExecution = false;

        // --- GESTION DU CLOUD ---
        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            document.getElementById('ui-xp-jeu').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne;
            document.getElementById('ui-xp-jeu').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        // --- NAVIGATION ---
        function changerEcran(id) { 
            document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); 
            document.getElementById(id).classList.add('actif'); 
        }
        function retourAccueil() { changerEcran('ecran-accueil'); }

        // --- GÉNÉRATION PROCÉDURALE (L'Algorithme central) ---
        function lancerJeuInfi() {
            compteurNiveau = 1;
            changerEcran('ecran-jeu');
            genererNiveauAleatoire();
        }

        function genererNiveauAleatoire() {
            document.getElementById('titre-niveau').textContent = `Labyrinthe N°${compteurNiveau}`;
            document.getElementById('feedback').textContent = "";
            
            // 1. Définir une taille aléatoire (entre 5x5 et 8x8)
            let taille = Math.floor(Math.random() * 4) + 5;
            
            // 2. Créer une grille remplie de murs (1 = mur, 0 = vide)
            let grille = Array(taille).fill(0).map(() => Array(taille).fill(1));
            
            let x = 0, y = 0;
            grille[y][x] = 2; // Position de départ du Robot

            // 3. Génération du chemin parfait garanti (vers la droite ou le bas)
            while(x < taille - 1 || y < taille - 1) {
                if (x === taille - 1) { y++; } // Au bord droit, on descend
                else if (y === taille - 1) { x++; } // Au bord bas, on va à droite
                else {
                    // Choix aléatoire : descendre ou aller à droite
                    if (Math.random() > 0.5) x++;
                    else y++;
                }
                grille[y][x] = 0; // On creuse le chemin
            }
            grille[taille - 1][taille - 1] = 3; // La Sortie

            // 4. Ajout de "Bruit" : on casse des murs aléatoires pour créer de fausses pistes
            let nombreTrous = taille * 2;
            for(let i = 0; i < nombreTrous; i++) {
                let rx = Math.floor(Math.random() * taille);
                let ry = Math.floor(Math.random() * taille);
                if (grille[ry][rx] === 1) grille[ry][rx] = 0;
            }

            // Sauvegarde de l'état initial pour pouvoir réinitialiser
            grilleOriginale = JSON.parse(JSON.stringify(grille));
            effacerSequence();
        }

        // --- GESTION DE L'INTERFACE ET DE LA GRILLE ---
        function reinitialiserGrille() {
            grilleDynamique = JSON.parse(JSON.stringify(grilleOriginale));
            estEnExecution = false;
            document.getElementById('btn-executer').disabled = false;
            trouverRobot();
            dessinerGrilleHTML();
        }

        function trouverRobot() {
            for (let y = 0; y < grilleDynamique.length; y++) {
                for (let x = 0; x < grilleDynamique[y].length; x++) {
                    if (grilleDynamique[y][x] === 2) {
                        posRobot = { x: x, y: y };
                        return;
                    }
                }
            }
        }

        function dessinerGrilleHTML() {
            const container = document.getElementById('grille-labyrinthe');
            container.innerHTML = '';
            
            let nbLignes = grilleDynamique.length;
            let nbColonnes = grilleDynamique[0].length;
            
            container.style.gridTemplateColumns = `repeat(${nbColonnes}, 45px)`;
            container.style.gridTemplateRows = `repeat(${nbLignes}, 45px)`;

            for (let y = 0; y < nbLignes; y++) {
                for (let x = 0; x < nbColonnes; x++) {
                    let div = document.createElement('div');
                    div.className = 'cellule';
                    div.id = `cell_${x}_${y}`;
                    
                    if (grilleDynamique[y][x] === 1) div.classList.add('mur');
                    else if (grilleDynamique[y][x] === 2) { div.classList.add('robot'); div.textContent = "🤖"; }
                    else if (grilleDynamique[y][x] === 3) { div.classList.add('sortie'); div.textContent = "🏁"; }
                    
                    container.appendChild(div);
                }
            }
        }

        // --- GESTION DES COMMANDES ---
        function ajouterCommande(direction) {
            if (estEnExecution) return;
            let symbole = direction === 'Haut' ? '⬆️' : direction === 'Bas' ? '⬇️' : direction === 'Gauche' ? '⬅️' : '➡️';
            sequenceCommandes.push(direction);
            
            let div = document.createElement('div');
            div.className = 'cmd-bulle';
            div.textContent = symbole;
            
            // Permet de supprimer une instruction en cliquant dessus
            div.onclick = function() {
                if(estEnExecution) return;
                let index = Array.from(this.parentNode.children).indexOf(this);
                sequenceCommandes.splice(index, 1);
                this.remove();
            };
            
            document.getElementById('sequence-container').appendChild(div);
        }

        function effacerSequence() {
            if (estEnExecution) return;
            sequenceCommandes = [];
            document.getElementById('sequence-container').innerHTML = '';
            reinitialiserGrille();
            document.getElementById('feedback').textContent = "";
        }

        // --- EXÉCUTION DE L'ALGORITHME (Le Moteur) ---
        function executerSequence() {
            if (sequenceCommandes.length === 0 || estEnExecution) return;
            estEnExecution = true;
            document.getElementById('btn-executer').disabled = true;
            document.getElementById('feedback').textContent = "Exécution du code...";
            document.getElementById('feedback').style.color = "#2980b9";
            
            reinitialiserGrille(); 
            lireInstruction(0);
        }

        function lireInstruction(index) {
            const domCommandes = document.getElementById('sequence-container').children;
            
            // Retirer la surbrillance de l'instruction précédente
            if (index > 0 && domCommandes[index-1]) domCommandes[index-1].classList.remove('active');
            
            if (index >= sequenceCommandes.length) {
                verifierVictoire();
                return;
            }

            // Mettre en surbrillance l'instruction en cours
            if (domCommandes[index]) domCommandes[index].classList.add('active');

            let cmd = sequenceCommandes[index];
            let newX = posRobot.x;
            let newY = posRobot.y;

            if (cmd === 'Haut') newY--;
            if (cmd === 'Bas') newY++;
            if (cmd === 'Gauche') newX--;
            if (cmd === 'Droite') newX++;

            // Détection de collision (Mur ou Hors limite)
            let collision = false;
            if (newY < 0 || newY >= grilleDynamique.length || newX < 0 || newX >= grilleDynamique[0].length) {
                collision = true; 
            } else if (grilleDynamique[newY][newX] === 1) {
                collision = true; 
            }

            if (collision) {
                document.getElementById(`cell_${posRobot.x}_${posRobot.y}`).classList.add('erreur');
                document.getElementById('feedback').textContent = "Erreur : Collision (Bug détecté) 🔴";
                document.getElementById('feedback').style.color = "#c0392b";
                estEnExecution = false;
                document.getElementById('btn-executer').disabled = false;
                return;
            }

            let valeurCible = grilleDynamique[newY][newX];
            grilleDynamique[posRobot.y][posRobot.x] = 0; 
            
            if(valeurCible === 3) grilleDynamique[newY][newX] = 4; // Succès
            else grilleDynamique[newY][newX] = 2; // Avance normale
            
            posRobot = { x: newX, y: newY };
            dessinerGrilleHTML();

            // Délai pour l'animation (600ms)
            setTimeout(() => { lireInstruction(index + 1); }, 600);
        }

        function verifierVictoire() {
            estEnExecution = false;
            document.getElementById('btn-executer').disabled = false;

            if (grilleDynamique[posRobot.y][posRobot.x] === 4) {
                document.getElementById('feedback').textContent = "Programme validé ! Code Parfait ✨";
                document.getElementById('feedback').style.color = "#27ae60";
                
                // L'XP gagné dépend de la taille de la grille (plus c'est grand, plus ça rapporte)
                let gainXP = grilleDynamique.length * 10;
                sauverProfilCloud(gainXP);

                compteurNiveau++;
                // Génère le labyrinthe suivant après 2 secondes
                setTimeout(() => { genererNiveauAleatoire(); }, 2000);
            } else {
                document.getElementById('feedback').textContent = "Séquence incomplète ! 🔴";
                document.getElementById('feedback').style.color = "#e67e22";
            }
        }

        chargerProfilCloud();
    </script>
</body>
</html>
