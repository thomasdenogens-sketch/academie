<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Conjugaison CM2 - L'Académie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #8e44ad 0%, #3498db 100%); 
            color: #333; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-width: 800px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #8e44ad; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        .hud { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; background: #f8f9fa; padding: 10px 20px; border-radius: 12px; border: 2px solid #ecf0f1; }
        
        /* NOUVEAU DESIGN : Le texte à trou */
        #zone-phrase {
            background: #f1f8ff; padding: 30px; border-radius: 15px; border: 2px dashed #3498db;
            font-size: 1.6rem; font-weight: 700; color: #2c3e50; line-height: 2;
            margin-bottom: 25px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px;
        }

        #input-verbe {
            font-family: 'Nunito', sans-serif; font-size: 1.6rem; font-weight: 900; color: #2980b9;
            border: 3px solid #bdc3c7; border-radius: 10px; padding: 5px 15px; width: 200px; text-align: center; outline: none;
            transition: 0.2s;
        }
        #input-verbe:focus { border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.3); }

        .indication-temps { background: #e74c3c; color: white; padding: 5px 15px; border-radius: 20px; font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: inline-block;}

        .btn { font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: bold; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; color: white; margin: 5px; transition: transform 0.1s;}
        .btn:active { transform: scale(0.95); }
        .btn-primaire { background: #27ae60; box-shadow: 0 4px #219a52; }
        .btn-secondaire { background: #95a5a6; box-shadow: 0 4px #7f8c8d; }

        #feedback { font-size: 1.4rem; font-weight: 900; height: 35px; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp">...</span> ⭐</div>

        <h1>Conjugaison ✍️</h1>
        <p class="sous-titre">Complète les phrases avec le verbe conjugué !</p>
        
        <div class="hud">
            <span style="color:#2980b9;">Question <span id="ui-progression">1/10</span></span>
            <span style="color:#e74c3c;">Vies : <span id="ui-vies">❤️❤️❤️</span></span>
        </div>

        <!-- Indication du temps demandé -->
        <div class="indication-temps" id="ui-temps">Présent</div>
        <div style="font-weight: bold; color: #7f8c8d; margin-bottom: 10px;">Verbe : <span id="ui-infinitif" style="color: #8e44ad; font-size: 1.2rem;">manger</span></div>

        <!-- La nouvelle phrase à trous -->
        <div id="zone-phrase">
            <span id="texte-avant">Demain, je</span>
            <input type="text" id="input-verbe" autocomplete="off" placeholder="...">
            <span id="texte-apres">une pomme.</span>
        </div>

        <div id="feedback"></div>

        <button class="btn btn-primaire" id="btn-valider" onclick="verifierReponse()">Valider</button>
        <button class="btn btn-secondaire" onclick="window.location.href='index.html'">🏠 Retour</button>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/conjHero9.json`;

        let profil = { xp: 0 };
        let indexQuestion = 0;
        let vies = 3;
        const totalQuestions = 10;
        let isProcessing = false;
        let questionEnCours = null;

        // Base de données structurée
        const bddConjugaison = [
            { avant: "Demain, nous", infinitif: "manger", temps: "Futur Simple", rep: "mangerons", apres: "au restaurant." },
            { avant: "En ce moment, il", infinitif: "finir", temps: "Présent", rep: "finit", apres: "ses devoirs." },
            { avant: "Hier, elles", infinitif: "aller", temps: "Passé Composé", rep: "sont allées", apres: "au cinéma." },
            { avant: "Autrefois, vous", infinitif: "jouer", temps: "Imparfait", rep: "jouiez", apres: "dans ce parc." },
            { avant: "Si je pouvais, je", infinitif: "prendre", temps: "Conditionnel Présent", rep: "prendrais", apres: "des vacances." },
            { avant: "Le mois prochain, tu", infinitif: "faire", temps: "Futur Simple", rep: "feras", apres: "une présentation." },
            { avant: "Actuellement, je", infinitif: "être", temps: "Présent", rep: "suis", apres: "très concentré." },
            { avant: "Ce matin, nous", infinitif: "avoir", temps: "Passé Composé", rep: "avons eu", apres: "très froid." }
        ];

        let questionsMelangees = [];

        async function chargerProfilCloud() {
            try { let res = await fetch(DB_URL); let data = await res.json(); if (data && data.xp) profil.xp = parseInt(data.xp) || 0; } catch(e) {}
            document.getElementById('ui-xp').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne; document.getElementById('ui-xp').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function initJeu() {
            // On mélange la base de données pour avoir des phrases aléatoires
            questionsMelangees = [...bddConjugaison].sort(() => Math.random() - 0.5);
            indexQuestion = 0;
            vies = 3;
            poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) {
                alert("Plus de vies ! Révise tes terminaisons et réessaie.");
                return window.location.href='index.html';
            }
            if (indexQuestion >= totalQuestions || indexQuestion >= questionsMelangees.length) {
                alert(`Série parfaite ! +20 XP Bonus 🎉`);
                sauverProfilCloud(20);
                return window.location.href='index.html';
            }

            isProcessing = false;
            questionEnCours = questionsMelangees[indexQuestion];
            indexQuestion++;

            document.getElementById('ui-progression').textContent = `${indexQuestion}/${Math.min(totalQuestions, questionsMelangees.length)}`;
            document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
            
            document.getElementById('ui-temps').textContent = questionEnCours.temps;
            document.getElementById('ui-infinitif').textContent = questionEnCours.infinitif;
            
            document.getElementById('texte-avant').textContent = questionEnCours.avant;
            document.getElementById('texte-apres').textContent = questionEnCours.apres;
            
            let input = document.getElementById('input-verbe');
            input.value = "";
            input.focus();
            
            document.getElementById('feedback').textContent = "";
            document.getElementById('input-verbe').style.borderColor = "#bdc3c7";
            document.getElementById('input-verbe').style.color = "#2980b9";
        }

        function verifierReponse() {
            if (isProcessing) return;
            let saisie = document.getElementById('input-verbe').value.trim().toLowerCase();
            if (saisie === "") return;
            
            isProcessing = true;
            const fb = document.getElementById('feedback');
            const input = document.getElementById('input-verbe');

            if (saisie === questionEnCours.rep) {
                fb.textContent = "C'est exact ! ✨"; fb.style.color = "#27ae60";
                input.style.borderColor = "#27ae60"; input.style.color = "#27ae60";
                sauverProfilCloud(5);
                setTimeout(poserQuestion, 1200);
            } else {
                vies--;
                document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
                fb.textContent = `Aïe ! La bonne réponse était : "${questionEnCours.rep}"`; fb.style.color = "#e74c3c";
                input.style.borderColor = "#e74c3c"; input.style.color = "#e74c3c";
                setTimeout(poserQuestion, 3000);
            }
        }

        // Permet de valider avec la touche "Entrée" du clavier
        document.getElementById('input-verbe').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifierReponse();
        });

        document.addEventListener("DOMContentLoaded", () => {
            chargerProfilCloud();
            initJeu();
        });
    </script>
</body>
</html>
