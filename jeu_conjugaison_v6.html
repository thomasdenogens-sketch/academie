<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Conjugaison CM2 - L'Académie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #8e44ad 0%, #3498db 100%); 
            color: #333; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-width: 800px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #8e44ad; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        .hud { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; background: #f8f9fa; padding: 10px 20px; border-radius: 12px; border: 2px solid #ecf0f1; }
        
        #zone-phrase {
            background: #f1f8ff; padding: 30px; border-radius: 15px; border: 2px dashed #3498db;
            font-size: 1.6rem; font-weight: 700; color: #2c3e50; line-height: 2;
            margin-bottom: 25px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px;
        }

        /* Mode Saisie Classique */
        #input-verbe {
            font-family: 'Nunito', sans-serif; font-size: 1.6rem; font-weight: 900; color: #2980b9;
            border: 3px solid #bdc3c7; border-radius: 10px; padding: 5px 15px; width: 200px; text-align: center; outline: none;
            transition: 0.2s;
        }
        #input-verbe:focus { border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.3); }

        /* Mode Drag & Drop (Nouveauté CM2) */
        .slot-container { display: flex; gap: 10px; align-items: center; }
        .slot { 
            width: 140px; height: 50px; background: white; border: 3px dashed #bdc3c7; border-radius: 10px; 
            display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        .slot.survol { background: #eafaf1; border-color: #2ecc71; transform: scale(1.05); }
        
        #banque-mots { 
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px;
            background: #f8f9fa; padding: 15px; border-radius: 15px; border: 2px solid #ecf0f1; min-height: 80px;
        }
        
        .mot-drag { 
            background: #f39c12; color: white; padding: 8px 20px; border-radius: 8px; 
            font-size: 1.3rem; font-weight: 900; cursor: grab; box-shadow: 0 4px 0 #d35400; transition: transform 0.1s;
        }
        .mot-drag:active { cursor: grabbing; transform: translateY(4px); box-shadow: none; }

        .indication-temps { background: #e74c3c; color: white; padding: 5px 15px; border-radius: 20px; font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: inline-block;}

        .btn { font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: bold; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; color: white; margin: 5px; transition: transform 0.1s;}
        .btn:active { transform: scale(0.95); }
        .btn-primaire { background: #27ae60; box-shadow: 0 4px #219a52; }
        .btn-secondaire { background: #95a5a6; box-shadow: 0 4px #7f8c8d; }

        #feedback { font-size: 1.4rem; font-weight: 900; height: 35px; margin: 15px 0; }
        
        .correct-ui { border-color: #27ae60 !important; color: #27ae60 !important; background: #eafaf1 !important; }
        .erreur-ui { border-color: #e74c3c !important; color: #e74c3c !important; background: #fadbd8 !important; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp">...</span> ⭐</div>

        <h1>Conjugaison CM2 ✍️</h1>
        <p class="sous-titre">Maîtrise les temps simples et les temps composés !</p>
        
        <div class="hud">
            <span style="color:#2980b9;">Question <span id="ui-progression">1/10</span></span>
            <span style="color:#e74c3c;">Vies : <span id="ui-vies">❤️❤️❤️</span></span>
        </div>

        <div class="indication-temps" id="ui-temps">Présent</div>
        <div style="font-weight: bold; color: #7f8c8d; margin-bottom: 10px;">Verbe : <span id="ui-infinitif" style="color: #8e44ad; font-size: 1.2rem;">manger</span></div>

        <div id="zone-phrase">
            <span id="texte-avant">Demain, je</span>
            
            <!-- CONTENEUR DYNAMIQUE : Sera basculé via Javascript -->
            <div id="conteneur-interaction"></div>
            
            <span id="texte-apres">une pomme.</span>
        </div>

        <!-- LA BANQUE DE MOTS (Visible uniquement en mode Drag & Drop) -->
        <div id="banque-mots" style="display: none;" ondrop="drop(event)" ondragover="dragOver(event)"></div>

        <div id="feedback"></div>

        <button class="btn btn-primaire" id="btn-valider" onclick="verifierReponse()">Valider</button>
        <button class="btn btn-secondaire" onclick="window.location.href='index.html'">🏠 Retour</button>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/conjHero9.json`;

        let profil = { xp: 0 };
        let indexQuestion = 0;
        let vies = 3;
        const totalQuestions = 10;
        let isProcessing = false;
        let questionEnCours = null;

        // ==========================================
        // BASE DE DONNÉES ENRICHIE (CM2)
        // ==========================================
        const bddConjugaison = [
            // Temps Simples (Saisie au clavier)
            { type: "saisie", avant: "Soudain, la foudre", infinitif: "frapper", temps: "Passé Simple", rep: "frappa", apres: "l'arbre." },
            { type: "saisie", avant: "L'année prochaine, nous", infinitif: "aller", temps: "Futur Simple", rep: "irons", apres: "au collège." },
            { type: "saisie", avant: "Si j'avais de l'argent, j'", infinitif: "acheter", temps: "Conditionnel Présent", rep: "achèterais", apres: "un vélo." },
            { type: "saisie", avant: "(Finir)", infinitif: "finir", temps: "Impératif Présent (2e pers. singulier)", rep: "Finis", apres: "tes devoirs immédiatement !" },
            { type: "saisie", avant: "Hier soir, je", infinitif: "lire", temps: "Imparfait", rep: "lisais", apres: "quand tu es rentré." },

            // Temps Composés (Drag & Drop Auxiliaire + Participe Passé)
            { 
                type: "dragdrop", 
                avant: "Quand la pluie a commencé, ils", 
                infinitif: "partir", 
                temps: "Plus-que-parfait", 
                rep: ["étaient", "partis"], 
                mots: ["avaient", "étaient", "parti", "partis", "partie"],
                apres: "depuis une heure." 
            },
            { 
                type: "dragdrop", 
                avant: "Avant le spectacle, nous", 
                infinitif: "répéter", 
                temps: "Plus-que-parfait", 
                rep: ["avions", "répété"], 
                mots: ["avions", "étions", "répété", "répétés", "répétée"],
                apres: "notre texte plusieurs fois." 
            },
            { 
                type: "dragdrop", 
                avant: "Lola", 
                infinitif: "prendre", 
                temps: "Passé Composé", 
                rep: ["a", "pris"], 
                mots: ["a", "est", "pris", "prise", "prit"],
                apres: "son cartable en vitesse." 
            },
            { 
                type: "dragdrop", 
                avant: "Dès qu'elles", 
                infinitif: "finir", 
                temps: "Futur Antérieur", 
                rep: ["auront", "fini"], 
                mots: ["auront", "seront", "fini", "finis", "finie"],
                apres: ", elles pourront jouer." 
            }
        ];

        let questionsMelangees = [];

        async function chargerProfilCloud() {
            try { let res = await fetch(DB_URL); let data = await res.json(); if (data && data.xp) profil.xp = parseInt(data.xp) || 0; } catch(e) {}
            document.getElementById('ui-xp').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne; document.getElementById('ui-xp').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function initJeu() {
            questionsMelangees = [...bddConjugaison].sort(() => Math.random() - 0.5);
            indexQuestion = 0; vies = 3; poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) {
                alert("Plus de vies ! Révise tes terminaisons et réessaie."); return window.location.href='index.html';
            }
            if (indexQuestion >= totalQuestions || indexQuestion >= questionsMelangees.length) {
                alert(`Série parfaite ! +20 XP Bonus 🎉`); sauverProfilCloud(20); return window.location.href='index.html';
            }

            isProcessing = false;
            questionEnCours = questionsMelangees[indexQuestion];
            indexQuestion++;

            document.getElementById('ui-progression').textContent = `${indexQuestion}/${Math.min(totalQuestions, questionsMelangees.length)}`;
            document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
            
            document.getElementById('ui-temps').textContent = questionEnCours.temps;
            document.getElementById('ui-infinitif').textContent = questionEnCours.infinitif;
            document.getElementById('texte-avant').textContent = questionEnCours.avant;
            document.getElementById('texte-apres').textContent = questionEnCours.apres;
            
            document.getElementById('feedback').textContent = "";
            genererInterfaceInteraction();
        }

        // ==========================================
        // LE MOTEUR DE ROUTAGE D'INTERFACE
        // ==========================================
        function genererInterfaceInteraction() {
            const conteneur = document.getElementById('conteneur-interaction');
            const banqueMots = document.getElementById('banque-mots');
            conteneur.innerHTML = "";
            banqueMots.innerHTML = "";

            if (questionEnCours.type === "saisie") {
                // Mode Classique
                banqueMots.style.display = "none";
                conteneur.innerHTML = `<input type="text" id="input-verbe" autocomplete="off" placeholder="...">`;
                
                let input = document.getElementById('input-verbe');
                input.focus();
                input.addEventListener('keypress', function (e) { if (e.key === 'Enter') verifierReponse(); });
            } 
            else if (questionEnCours.type === "dragdrop") {
                // Mode Temps Composés (CM2)
                banqueMots.style.display = "flex";
                
                // Création des 2 cases de dépôt (Auxiliaire + Participe)
                conteneur.innerHTML = `
                    <div class="slot-container">
                        <div class="slot" id="slot-0" ondrop="drop(event)" ondragover="dragOver(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
                        <div class="slot" id="slot-1" ondrop="drop(event)" ondragover="dragOver(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
                    </div>
                `;

                // Création des mots déplaçables
                let motsMelanges = [...questionEnCours.mots].sort(() => Math.random() - 0.5);
                motsMelanges.forEach((mot, index) => {
                    let divMot = document.createElement('div');
                    divMot.className = "mot-drag";
                    divMot.textContent = mot;
                    divMot.id = `mot-${index}`;
                    divMot.draggable = true;
                    divMot.ondragstart = dragStart;
                    banqueMots.appendChild(divMot);
                });
            }
        }

        // ==========================================
        // L'API DRAG & DROP HTML5
        // ==========================================
        function dragStart(e) { e.dataTransfer.setData('text/plain', e.target.id); }
        function dragOver(e) { e.preventDefault(); }
        function dragEnter(e) { if (e.target.classList.contains('slot')) e.target.classList.add('survol'); }
        function dragLeave(e) { if (e.target.classList.contains('slot')) e.target.classList.remove('survol'); }

        function drop(e) {
            e.preventDefault();
            e.target.classList.remove('survol');
            
            const idMot = e.dataTransfer.getData('text/plain');
            const elementMot = document.getElementById(idMot);

            // Si on lâche dans un emplacement (slot) vide
            if (e.target.classList.contains('slot') && e.target.children.length === 0) {
                e.target.appendChild(elementMot);
            } 
            // Si on veut remettre le mot dans la banque
            else if (e.target.id === 'banque-mots' || e.target.classList.contains('mot-drag')) {
                document.getElementById('banque-mots').appendChild(elementMot);
            }
        }

        // ==========================================
        // LE MOTEUR DE VALIDATION MIXTE
        // ==========================================
        function verifierReponse() {
            if (isProcessing) return;
            isProcessing = true;
            const fb = document.getElementById('feedback');
            let estCorrect = false;

            // VÉRIFICATION MODE SAISIE
            if (questionEnCours.type === "saisie") {
                const input = document.getElementById('input-verbe');
                let saisie = input.value.trim().toLowerCase();
                
                if (saisie === "") { isProcessing = false; return; }
                
                if (saisie === questionEnCours.rep.toLowerCase()) {
                    estCorrect = true;
                    input.classList.add('correct-ui');
                } else {
                    input.classList.add('erreur-ui');
                    fb.innerHTML = `Aïe ! La bonne réponse était : <strong>${questionEnCours.rep}</strong>`;
                }
            } 
            // VÉRIFICATION MODE DRAG & DROP
            else if (questionEnCours.type === "dragdrop") {
                const slot0 = document.getElementById('slot-0');
                const slot1 = document.getElementById('slot-1');
                
                if (slot0.children.length === 0 || slot1.children.length === 0) {
                    fb.textContent = "Place les deux mots avant de valider !";
                    fb.style.color = "#e67e22";
                    isProcessing = false; return;
                }

                let reponse0 = slot0.children[0].textContent.toLowerCase();
                let reponse1 = slot1.children[0].textContent.toLowerCase();

                if (reponse0 === questionEnCours.rep[0].toLowerCase() && reponse1 === questionEnCours.rep[1].toLowerCase()) {
                    estCorrect = true;
                    slot0.classList.add('correct-ui'); slot1.classList.add('correct-ui');
                } else {
                    slot0.classList.add('erreur-ui'); slot1.classList.add('erreur-ui');
                    fb.innerHTML = `Attention ! C'était : <strong>${questionEnCours.rep.join(' ')}</strong>`;
                }
            }

            // GESTION DU RÉSULTAT
            if (estCorrect) {
                fb.textContent = "C'est exact ! ✨"; fb.style.color = "#27ae60";
                sauverProfilCloud(5);
                setTimeout(poserQuestion, 1500);
            } else {
                vies--;
                document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
                fb.style.color = "#e74c3c";
                setTimeout(poserQuestion, 3500);
            }
        }

        document.addEventListener("DOMContentLoaded", () => { chargerProfilCloud(); initJeu(); });
    </script>
</body>
</html>
