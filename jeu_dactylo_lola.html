<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dactylo Junior - L'Académie de Lola</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%); 
            color: #4a148c; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.2); max-width: 800px; width: 100%; text-align: center; position: relative;
            border: 4px solid #f06292;
        }
        
        h1 { color: #e91e63; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #880e4f; margin-bottom: 25px; font-weight: 700; font-size: 1.2rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* HUD (Affichage tête haute) */
        .hud { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.3rem; margin-bottom: 20px; background: #fce4ec; padding: 15px 25px; border-radius: 15px; border: 2px solid #f48fb1; color: #c2185b;}
        
        .badge-niveau { background: #e91e63; color: white; padding: 5px 15px; border-radius: 15px; box-shadow: 0 4px 0 #c2185b; }

        /* La zone de frappe */
        #zone-jeu {
            font-family: 'Fira Code', monospace; font-size: 4rem; letter-spacing: 5px; margin: 30px 0;
            background: #fff; padding: 40px; border-radius: 20px; border: 4px dashed #f06292;
            min-height: 150px; display: flex; justify-content: center; align-items: center;
        }
        
        .lettre { 
            color: #b0bec5; transition: 0.1s; border-bottom: 6px solid transparent; 
            display: inline-block; min-width: 2.5rem; text-align: center; margin: 0 5px;
        }
        .lettre.active { border-bottom-color: #e91e63; color: #4a148c; transform: scale(1.2); }
        .lettre.correct { color: #2ecc71; border-bottom-color: #2ecc71;}
        .lettre.erreur { color: #e74c3c; background: #ffcdd2; border-radius: 10px;}

        /* Barre de progression du niveau */
        .progression-container { width: 100%; background: #f8bbd0; height: 20px; border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 2px solid #f06292;}
        #barre-progression { background: #2ecc71; height: 100%; width: 0%; transition: 0.4s; }

        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.2rem; transition: 0.2s;}
        .btn-nav:hover { background: #7f8c8d; }
        
        #feedback { font-size: 1.5rem; font-weight: 900; height: 40px; margin: 15px 0; color: #e91e63;}
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp">...</span> ⭐</div>

        <h1>Dactylo Junior 🦄</h1>
        <p class="sous-titre">Deviens une championne du clavier !</p>

        <div class="hud">
            <span class="badge-niveau" id="ui-niveau">Niveau 1</span>
            <span style="color:#e74c3c;">Vies : <span id="ui-vies">❤️❤️❤️</span></span>
        </div>

        <div class="progression-container">
            <div id="barre-progression"></div>
        </div>

        <div id="zone-jeu"></div>
        <div id="feedback">Appuie sur les touches du clavier !</div>

        <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/lola/dactyloLola.json`;

        let profil = { xp: 0 };
        let niveauActuel = 0; // Correspond à l'index du tableau (0 = Niveau 1)
        let indexLettreActuelle = 0;
        let motEnCours = "";
        let motsReussisNiveau = 0;
        let vies = 3;
        let estBloque = false;

        // --- LA BASE DE DONNÉES DES NIVEAUX (Algorithme de progression) ---
        // Le code piochera au hasard dans le sous-tableau correspondant au niveau de Lola.
        const banqueMots = [
            ["a", "e", "i", "o", "u", "y", "m", "p", "t", "l"], // Niveau 1 : Lettres seules
            ["ma", "pa", "ta", "la", "me", "te", "le", "sa", "ra"], // Niveau 2 : Syllabes simples
            ["chat", "lola", "papa", "velo", "lune", "rose", "fille"], // Niveau 3 : Mots très courts
            ["lapin", "chien", "arbre", "livre", "stylo", "pomme"], // Niveau 4 : Mots moyens
            ["maison", "oiseau", "ecole", "soleil", "etoile", "fleur"]  // Niveau 5 : Mots longs
        ];

        const MOTS_POUR_MONTER_NIVEAU = 5;

        async function chargerProfilCloud() {
            try { let res = await fetch(DB_URL); let data = await res.json(); if (data && data.xp) profil.xp = parseInt(data.xp) || 0; } catch(e) {}
            document.getElementById('ui-xp').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne; document.getElementById('ui-xp').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function demarrerNouveauMot() {
            if (vies <= 0) {
                document.removeEventListener('keydown', gestionFrappe);
                document.getElementById('feedback').textContent = "Partie terminée ! Reviens vite jouer ! 🔄";
                return;
            }

            estBloque = false;
            indexLettreActuelle = 0;
            
            // On s'assure de ne pas dépasser le nombre de niveaux maximum
            let niveauSafe = Math.min(niveauActuel, banqueMots.length - 1);
            let listeNiveau = banqueMots[niveauSafe];
            
            // On pioche un mot au hasard dans le niveau actuel
            motEnCours = listeNiveau[Math.floor(Math.random() * listeNiveau.length)];

            // Génération de l'affichage HTML
            const conteneurTexte = document.getElementById('zone-jeu');
            conteneurTexte.innerHTML = "";
            
            for (let i = 0; i < motEnCours.length; i++) {
                let span = document.createElement('span');
                span.className = 'lettre';
                span.textContent = motEnCours[i];
                span.id = "lettre-" + i;
                conteneurTexte.appendChild(span);
            }
            
            document.getElementById('lettre-0').classList.add('active');
            actualiserInterface();
        }

        function actualiserInterface() {
            document.getElementById('ui-niveau').textContent = `Niveau ${Math.min(niveauActuel + 1, banqueMots.length)}`;
            document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
            
            let pourcentage = (motsReussisNiveau / MOTS_POUR_MONTER_NIVEAU) * 100;
            document.getElementById('barre-progression').style.width = pourcentage + "%";
        }

        function gestionFrappe(event) {
            if (estBloque) return;
            
            // Ignorer les touches système (Majuscule, Alt, etc.)
            if(event.key.length > 1) return;
            
            let toucheFrappee = event.key.toLowerCase();
            let caractereAttendu = motEnCours[indexLettreActuelle].toLowerCase();
            let spanActuel = document.getElementById("lettre-" + indexLettreActuelle);

            if (toucheFrappee === caractereAttendu) {
                spanActuel.classList.remove('active', 'erreur');
                spanActuel.classList.add('correct');
                
                indexLettreActuelle++;
                
                if (indexLettreActuelle >= motEnCours.length) {
                    motReussi();
                } else {
                    document.getElementById("lettre-" + indexLettreActuelle).classList.add('active');
                }
            } else {
                vies--;
                spanActuel.classList.add('erreur');
                actualiserInterface();
                document.getElementById('feedback').textContent = "Oups ! Recommence ! 🙈";
                
                // Si elle se trompe, on réinitialise le mot actuel pour qu'elle apprenne bien
                estBloque = true;
                setTimeout(() => {
                    document.getElementById('feedback').textContent = "Appuie sur les touches !";
                    demarrerNouveauMot(); // On relance le même mot ou un nouveau selon ta préférence, ici un nouveau.
                }, 1000);
            }
        }

        function motReussi() {
            estBloque = true;
            motsReussisNiveau++;
            document.getElementById('feedback').textContent = "Bravo Lola ! ✨";
            
            sauverProfilCloud(2); // Gagne 2 XP par mot
            
            actualiserInterface();

            // Vérification du Level-Up
            if (motsReussisNiveau >= MOTS_POUR_MONTER_NIVEAU) {
                niveauActuel++;
                motsReussisNiveau = 0;
                sauverProfilCloud(15); // Bonus de changement de niveau
                
                if (niveauActuel >= banqueMots.length) {
                    document.getElementById('feedback').textContent = "🏆 CHAMPIONNE ! Tu as fini le jeu !";
                    return; // Fin du jeu
                } else {
                    document.getElementById('feedback').textContent = "NIVEAU SUPÉRIEUR ! 🚀";
                }
            }

            setTimeout(() => {
                document.getElementById('feedback').textContent = "Continue !";
                demarrerNouveauMot();
            }, 1000);
        }

        // --- INITIALISATION ---
        document.addEventListener("DOMContentLoaded", () => {
            chargerProfilCloud();
            document.addEventListener('keydown', gestionFrappe);
            demarrerNouveauMot();
        });
    </script>
</body>
</html>
