<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de Dames - Salle de Jeux</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: #2c3e50; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        #app-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); max-width: 700px; width: 100%; text-align: center; position: relative; }
        h1 { color: #8e44ad; font-weight: 900; font-size: 2.2rem; margin-bottom: 5px; }
        .sous-titre { color: #9b59b6; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        .hud-scores { display: flex; justify-content: space-around; background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 3px solid #ecf0f1; }
        .score-box { font-size: 1.2rem; font-weight: 900; padding: 10px 20px; border-radius: 12px; transition: 0.3s; opacity: 0.5;}
        .score-lola { color: #e91e63; } .score-theo { color: #3498db; } .score-ia { color: #2c3e50; }
        .tour-actif { opacity: 1; transform: scale(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.1); background: white;}

        #plateau-container { display: grid; grid-template-columns: repeat(8, 50px); grid-template-rows: repeat(8, 50px); gap: 0; border: 6px solid #2c3e50; border-radius: 5px; margin: 0 auto 20px auto; width: fit-content; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .case { width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; position: relative; }
        .case-claire { background: #f5deb3; } .case-sombre { background: #8b4513; }
        .case-possible { background: #2ecc71 !important; cursor: pointer; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        
        .pion { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; color: white; transition: 0.2s; }
        
        /* Couleurs dynamiques selon l'enfant */
        .pion-lola { background: radial-gradient(circle at 15px 15px, #ff4081, #c2185b); cursor: pointer; border: 2px solid #880e4f;}
        .pion-theo { background: radial-gradient(circle at 15px 15px, #4fc3f7, #0288d1); cursor: pointer; border: 2px solid #01579b;}
        .pion-ia { background: radial-gradient(circle at 15px 15px, #7f8c8d, #2c3e50); border: 2px solid #1a252f;}
        
        .pion.selectionne { transform: scale(1.2); box-shadow: 0 0 15px #f1c40f; border-color: #f1c40f; z-index: 10;}
        .pion.dame::after { content: '👑'; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s;}
        .btn-nav:hover { background: #7f8c8d; }
        #feedback { font-size: 1.3rem; font-weight: 900; height: 35px; margin-bottom: 15px; color: #8e44ad;}
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge" id="ui-xp">XP: ... ⭐</div>
        
        <h1 id="titre-jeu">Jeu de Dames 👑</h1>
        <p class="sous-titre">Réfléchis bien pour capturer les pions de l'ordinateur !</p>
        
        <div class="hud-scores">
            <div id="box-joueur" class="score-box tour-actif"><span id="nom-joueur">Joueur</span> <br> Pions: <span id="pions-joueur">12</span></div>
            <div id="box-ia" class="score-box score-ia">🤖 Ordi <br> Pions: <span id="pions-ia">12</span></div>
        </div>

        <div id="plateau-container"></div>
        <div id="feedback">C'est à ton tour ! Touche un pion.</div>

        <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        
        // 1. LECTURE DU CONTEXTE (Est-ce Théo ou Lola ?)
        const enfant = localStorage.getItem('enfantEnCours') || 'Lola';
        const enfantCle = enfant === 'Théo' ? 'theo' : 'lola';
        const DB_URL = `${FIREBASE_URL}scores/${enfantCle}/jeux.json`;

        let xpGlobale = 0;
        let plateau = [];
        let tourActuel = 1; 
        let pionSelectionne = null; 
        let mouvementsPossibles = []; 

        async function initPartage() {
            document.getElementById('nom-joueur').textContent = enfant === 'Lola' ? '👧 Lola' : '👦 Théo';
            document.getElementById('box-joueur').classList.add(enfant === 'Lola' ? 'score-lola' : 'score-theo');
            
            // On adapte le fond d'écran selon l'enfant
            if(enfant === 'Théo') {
                document.body.style.background = "linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)";
                document.querySelector('h1').style.color = "#2980b9";
            }

            try { let res = await fetch(DB_URL); let data = await res.json(); if (data && data.xp) xpGlobale = parseInt(data.xp) || 0; } catch(e) {}
            document.getElementById('ui-xp').textContent = `XP: ${xpGlobale} ⭐`;
            
            initialiserJeu();
        }

        async function ajouterXP(p) {
            xpGlobale += p; document.getElementById('ui-xp').textContent = `XP: ${xpGlobale} ⭐`;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: xpGlobale }) }); } catch(e) {}
        }

        function initialiserJeu() {
            plateau = Array(8).fill(0).map(() => Array(8).fill(0));
            for (let y = 0; y < 3; y++) { for (let x = 0; x < 8; x++) { if ((x + y) % 2 !== 0) plateau[y][x] = 2; } }
            for (let y = 5; y < 8; y++) { for (let x = 0; x < 8; x++) { if ((x + y) % 2 !== 0) plateau[y][x] = 1; } }
            tourActuel = 1; pionSelectionne = null; mouvementsPossibles = []; dessinerPlateau();
        }

        function dessinerPlateau() {
            const container = document.getElementById('plateau-container'); container.innerHTML = '';
            let compteJoueur = 0, compteIA = 0;

            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    let caseDiv = document.createElement('div');
                    caseDiv.className = `case ${(x + y) % 2 === 0 ? 'case-claire' : 'case-sombre'}`;
                    
                    let estMouvementPossible = mouvementsPossibles.find(m => m.toX === x && m.toY === y);
                    if (estMouvementPossible && tourActuel === 1) {
                        caseDiv.classList.add('case-possible'); caseDiv.onclick = () => executerMouvement(estMouvementPossible);
                    }

                    let valeur = plateau[y][x];
                    if (valeur !== 0) {
                        let pionDiv = document.createElement('div');
                        if (valeur === 1 || valeur === 3) {
                            pionDiv.className = `pion ${enfant === 'Théo' ? 'pion-theo' : 'pion-lola'} ${valeur === 3 ? 'dame' : ''}`;
                            compteJoueur++;
                            // C'est ici que le bug se manifestait : si tourActuel n'était pas encore remis à 1, le pion ne recevait pas le onclick.
                            if (tourActuel === 1) pionDiv.onclick = (e) => { e.stopPropagation(); selectionnerPion(x, y); };
                        } else {
                            pionDiv.className = `pion pion-ia ${valeur === 4 ? 'dame' : ''}`; compteIA++;
                        }
                        if (pionSelectionne && pionSelectionne.x === x && pionSelectionne.y === y) pionDiv.classList.add('selectionne');
                        caseDiv.appendChild(pionDiv);
                    }
                    container.appendChild(caseDiv);
                }
            }

            document.getElementById('pions-joueur').textContent = compteJoueur; document.getElementById('pions-ia').textContent = compteIA;
            if (compteJoueur === 0) finDePartie("L'ordinateur a gagné ! 🤖");
            else if (compteIA === 0) finDePartie(`Bravo ${enfant} ! Tu as gagné ! 🏆`, 50);
        }

        function selectionnerPion(x, y) {
            if (tourActuel !== 1) return;
            pionSelectionne = {x: x, y: y};
            mouvementsPossibles = calculerMouvementsPossibles(x, y, plateau[y][x]);
            dessinerPlateau();
        }

        function calculerMouvementsPossibles(x, y, typePion) {
            let mouvements = [];
            let directionsY = (typePion === 1) ? [-1] : (typePion === 2) ? [1] : [-1, 1];
            let directionsX = [-1, 1];

            directionsY.forEach(dy => {
                directionsX.forEach(dx => {
                    let nx = x + dx; let ny = y + dy;
                    if (estDansPlateau(nx, ny) && plateau[ny][nx] === 0) mouvements.push({ fromX: x, fromY: y, toX: nx, toY: ny, capture: false });
                    if (estDansPlateau(nx, ny) && estAdversaire(plateau[ny][nx], typePion)) {
                        let sautX = nx + dx; let sautY = ny + dy;
                        if (estDansPlateau(sautX, sautY) && plateau[sautY][sautX] === 0) mouvements.push({ fromX: x, fromY: y, toX: sautX, toY: sautY, capture: true, prisX: nx, prisY: ny });
                    }
                });
            });

            let prises = mouvements.filter(m => m.capture);
            if (prises.length > 0) return prises; return mouvements;
        }

        function estDansPlateau(x, y) { return x >= 0 && x < 8 && y >= 0 && y < 8; }
        function estAdversaire(valeurCase, typePionJoueur) {
            if (valeurCase === 0) return false;
            if (typePionJoueur === 1 || typePionJoueur === 3) return valeurCase === 2 || valeurCase === 4;
            return valeurCase === 1 || valeurCase === 3;
        }

        function executerMouvement(mouv) {
            let typePion = plateau[mouv.fromY][mouv.fromX];
            plateau[mouv.toY][mouv.toX] = typePion; plateau[mouv.fromY][mouv.fromX] = 0;
            if (mouv.capture) plateau[mouv.prisY][mouv.prisX] = 0;

            if (typePion === 1 && mouv.toY === 0) plateau[mouv.toY][mouv.toX] = 3; 
            if (typePion === 2 && mouv.toY === 7) plateau[mouv.toY][mouv.toX] = 4;

            pionSelectionne = null; mouvementsPossibles = []; 

            // LA CORRECTION : On met d'abord à jour le tour, puis on redessine !
            if (tourActuel === 1) {
                tourActuel = 2; // On bloque les actions du joueur
                document.getElementById('box-joueur').classList.remove('tour-actif'); document.getElementById('box-ia').classList.add('tour-actif');
                document.getElementById('feedback').textContent = "L'ordinateur réfléchit..."; 
                dessinerPlateau(); // Le plateau se dessine avec le tour 2 (le joueur ne peut plus cliquer)
                setTimeout(jouerTourIA, 1000); 
            } else {
                tourActuel = 1; // On rend la main au joueur
                document.getElementById('box-ia').classList.remove('tour-actif'); document.getElementById('box-joueur').classList.add('tour-actif');
                document.getElementById('feedback').textContent = "C'est à ton tour !";
                dessinerPlateau(); // Le plateau se dessine avec le tour 1 (le joueur PEUT cliquer)
            }
        }

        function jouerTourIA() {
            let tousMouvements = [];
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    let val = plateau[y][x];
                    if (val === 2 || val === 4) tousMouvements = tousMouvements.concat(calculerMouvementsPossibles(x, y, val));
                }
            }

            if (tousMouvements.length === 0) return finDePartie(`L'ordinateur est bloqué. Tu as gagné !`, 50);

            let mouvementsPrise = tousMouvements.filter(m => m.capture);
            let choix;

            // 2. DIFFICULTÉ DYNAMIQUE
            if (enfant === 'Lola') {
                if (mouvementsPrise.length > 0 && Math.random() > 0.3) choix = mouvementsPrise[Math.floor(Math.random() * mouvementsPrise.length)];
                else choix = tousMouvements[Math.floor(Math.random() * tousMouvements.length)];
            } else {
                if (mouvementsPrise.length > 0) choix = mouvementsPrise[Math.floor(Math.random() * mouvementsPrise.length)];
                else choix = tousMouvements[Math.floor(Math.random() * tousMouvements.length)];
            }

            executerMouvement(choix);
        }

        function finDePartie(msg, xp = 0) { tourActuel = 0; document.getElementById('feedback').textContent = msg; if(xp>0) ajouterXP(xp); }

        document.addEventListener("DOMContentLoaded", initPartage);
    </script>
</body>
</html>
