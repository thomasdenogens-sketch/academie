<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Découverte du Monde CE1 - Lola</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%); 
            color: #2c3e50; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 750px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #27ae60; font-weight: 900; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { color: #2c3e50; font-weight: bold; font-size: 1.1rem; margin-bottom: 25px; }
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Menu des thèmes avec Niveaux */
        .theme-container { border: 2px solid #ecf0f1; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .theme-header { font-size: 1.4rem; font-weight: 900; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .theme-espace .theme-header { color: #3498db; }
        .theme-temps .theme-header { color: #e67e22; }
        .theme-vivant .theme-header { color: #27ae60; }

        .grid-niveaux { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-menu-niv {
            background: #f8f9fa; border: 3px solid #e2e8f0; padding: 12px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center;
        }
        .btn-menu-niv:hover { transform: translateY(-4px); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .theme-espace .btn-menu-niv:hover { border-color: #3498db; background: #ebf5fb; }
        .theme-temps .btn-menu-niv:hover { border-color: #e67e22; background: #fdf2e9; }
        .theme-vivant .btn-menu-niv:hover { border-color: #27ae60; background: #eafaf1; }

        /* HUD Jeu */
        #hud { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; border: 2px solid #ecf0f1;}
        #ui-titre-niveau { color: #27ae60; font-weight: 900; font-size: 1.2rem;}

        /* Zone de la question enrichie */
        #question-box { background: #f1f8ff; padding: 20px; border-radius: 15px; border: 3px dashed #3498db; margin-bottom: 25px; }
        #question-image { font-size: 4rem; margin-bottom: 10px; animation: pop 0.3s ease-out; }
        #question-texte { font-size: 1.4rem; font-weight: 900; color: #2c3e50; line-height: 1.4; }
        
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        .zone-boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;}
        .btn-rep { background: white; border: 3px solid #bdc3c7; padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; color: #34495e; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 #bdc3c7; display: flex; align-items: center; justify-content: center; min-height: 80px;}
        .btn-rep:active { transform: translateY(4px); box-shadow: none; }
        .btn-rep.correct { background: #2ecc71; color: white; border-color: #27ae60; box-shadow: 0 4px 0 #2196f3; }
        .btn-rep.erreur { background: #e74c3c; color: white; border-color: #c0392b; box-shadow: 0 4px 0 #c0392b; }

        /* Boutons Généraux */
        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-nav:hover { background: #7f8c8d; }
        
        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        
        #feedback { font-size: 1.5rem; font-weight: 900; height: 40px; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge" id="ui-xp">XP: ... ⭐</div>

        <!-- ECRAN D'ACCUEIL -->
        <div id="ecran-accueil" class="ecran actif">
            <h1>Découverte du Monde 🌍</h1>
            <p class="subtitle">Espace, Temps et Nature (Niveau CE1)</p>
            
            <!-- SECTION ESPACE -->
            <div class="theme-container theme-espace">
                <div class="theme-header">🗺️ L'Espace et la Géographie</div>
                <div class="grid-niveaux">
                    <button class="btn-menu-niv" onclick="lancerNiveau('espace_1', 'La Terre et l\'Eau')">
                        <span style="font-size: 1.5rem;">🌍</span><span>Niv 1 : La Terre et l'eau</span>
                    </button>
                    <button class="btn-menu-niv" onclick="lancerNiveau('espace_2', 'Les Paysages')">
                        <span style="font-size: 1.5rem;">🏔️</span><span>Niv 2 : Les Paysages</span>
                    </button>
                </div>
            </div>

            <!-- SECTION TEMPS -->
            <div class="theme-container theme-temps">
                <div class="theme-header">⏳ Le Temps qui passe</div>
                <div class="grid-niveaux">
                    <button class="btn-menu-niv" onclick="lancerNiveau('temps_1', 'Les Jours et Saisons')">
                        <span style="font-size: 1.5rem;">📅</span><span>Niv 1 : Les Jours et Saisons</span>
                    </button>
                    <button class="btn-menu-niv" onclick="lancerNiveau('temps_2', 'Passé, Présent, Futur')">
                        <span style="font-size: 1.5rem;">🕰️</span><span>Niv 2 : Passé, Présent, Futur</span>
                    </button>
                </div>
            </div>

            <!-- SECTION VIVANT -->
            <div class="theme-container theme-vivant">
                <div class="theme-header">🌱 Le Monde Vivant</div>
                <div class="grid-niveaux">
                    <button class="btn-menu-niv" onclick="lancerNiveau('vivant_1', 'Animaux et Plantes')">
                        <span style="font-size: 1.5rem;">🦊</span><span>Niv 1 : Animaux et Plantes</span>
                    </button>
                    <button class="btn-menu-niv" onclick="lancerNiveau('vivant_2', 'Vivant ou Non-Vivant ?')">
                        <span style="font-size: 1.5rem;">🪨</span><span>Niv 2 : Vivant ou Non-Vivant ?</span>
                    </button>
                </div>
            </div>
            
            <button class="btn-nav" style="margin-top: 10px;" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div id="hud">
                <span id="ui-vies" style="letter-spacing: 5px;">❤️❤️❤️</span>
                <span id="ui-titre-niveau">Thème</span>
                <span id="ui-progression" style="color: #7f8c8d;">1 / 5</span>
            </div>
            
            <div id="question-box">
                <div id="question-image">❓</div>
                <div id="question-texte">Chargement...</div>
            </div>

            <div class="zone-boutons" id="boutons-reponses"></div>

            <div id="feedback"></div>
            <button class="btn-nav" onclick="retourAccueil()">⬅️ Changer de thème</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/lola/geoLola.json`;

        // BASE DE DONNÉES ENRICHIE AVEC DES EMOJIS VISUELS
        const bdd = {
            espace_1: [
                { img: "🌍", q: "Sur quel continent habitons-nous ?", rep: "En Europe", faux: ["En Asie", "En Afrique", "En Amérique"] },
                { img: "🌊", q: "Comment s'appelle une très grande étendue d'eau salée ?", rep: "Un océan", faux: ["Une rivière", "Un lac", "Un fleuve"] },
                { img: "🏝️", q: "Qu'est-ce qu'une île ?", rep: "Une terre entourée d'eau", faux: ["Une grande montagne", "Une forêt très dense", "Un désert de sable"] },
                { img: "🇫🇷", q: "Quelle est la capitale de la France ?", rep: "Paris", faux: ["Lyon", "Marseille", "Londres"] },
                { img: "🌐", q: "Comment s'appelle l'objet rond qui représente la Terre ?", rep: "Un globe terrestre", faux: ["Une boussole", "Une longue-vue", "Une carte"] }
            ],
            espace_2: [
                { img: "🏖️", q: "Quel est le paysage où l'on trouve du sable et la mer ?", rep: "Le littoral (la côte)", faux: ["La montagne", "La campagne", "La forêt"] },
                { img: "🏙️", q: "Où trouve-t-on beaucoup de grands immeubles et de routes ?", rep: "En ville", faux: ["À la campagne", "À la montagne", "Dans la forêt"] },
                { img: "🚜", q: "Où trouve-t-on des champs cultivés et des fermes ?", rep: "À la campagne", faux: ["En ville", "Au pôle nord", "Dans le désert"] },
                { img: "⛷️", q: "Dans quel paysage peut-on voir des vallées et des sommets ?", rep: "À la montagne", faux: ["Sur le littoral", "En pleine ville", "Dans l'océan"] },
                { img: "🧭", q: "Quel outil utilise-t-on pour s'orienter et trouver le Nord ?", rep: "Une boussole", faux: ["Un thermomètre", "Une montre", "Une balance"] }
            ],
            temps_1: [
                { img: "📆", q: "Combien y a-t-il de mois dans une année entière ?", rep: "12 mois", faux: ["10 mois", "7 mois", "24 mois"] },
                { img: "🌸", q: "Quelle saison vient juste après l'hiver ?", rep: "Le printemps", faux: ["L'été", "L'automne", "La saison des pluies"] },
                { img: "🏫", q: "Quel mois marque la rentrée des classes en France ?", rep: "Septembre", faux: ["Juillet", "Octobre", "Décembre"] },
                { img: "🍂", q: "Dans quelle saison les feuilles tombent-elles des arbres ?", rep: "L'automne", faux: ["Le printemps", "L'été", "L'hiver"] },
                { img: "🌞", q: "Quelle est la saison la plus chaude de l'année ?", rep: "L'été", faux: ["L'hiver", "L'automne", "Le printemps"] }
            ],
            temps_2: [
                { img: "⌚", q: "Combien y a-t-il d'heures dans une journée complète ?", rep: "24 heures", faux: ["12 heures", "60 heures", "7 heures"] },
                { img: "🦕", q: "Le temps des dinosaures, c'est...", rep: "Le passé", faux: ["Le présent", "Le futur", "Demain"] },
                { img: "🚀", q: "Quand tu seras grande et que tu travailleras, ce sera...", rep: "Le futur", faux: ["Le passé", "Le présent", "Hier"] },
                { img: "🎮", q: "Ce que tu es en train de faire en ce moment même, c'est...", rep: "Le présent", faux: ["Le passé", "Le futur", "L'année prochaine"] },
                { img: "⏰", q: "S'il est 8h00, c'est...", rep: "Le matin", faux: ["L'après-midi", "Le soir", "La nuit"] }
            ],
            vivant_1: [
                { img: "🌱", q: "Que faut-il à une plante pour grandir ?", rep: "De l'eau et de la lumière", faux: ["Seulement de la terre", "Du vent et du sable", "Rien du tout"] },
                { img: "🐱", q: "Lequel de ces animaux est un mammifère (il allaite ses petits) ?", rep: "Le chat", faux: ["La poule", "Le crocodile", "Le requin"] },
                { img: "🧊", q: "Sous quelle forme est l'eau quand elle est transformée en glace ?", rep: "Solide", faux: ["Liquide", "Gazeuse", "Chaude"] },
                { img: "🐝", q: "Quel insecte butine les fleurs pour fabriquer du miel ?", rep: "L'abeille", faux: ["La fourmi", "Le moustique", "Le papillon"] },
                { img: "🐣", q: "Comment appelle-t-on un animal qui naît dans un œuf ?", rep: "Un ovipare", faux: ["Un mammifère", "Un herbivore", "Un dinosaure"] }
            ],
            vivant_2: [
                { img: "🪨", q: "Lequel de ces éléments est NON-VIVANT ?", rep: "Un caillou", faux: ["Un arbre", "Une fourmi", "Un champignon"] },
                { img: "🦁", q: "Comment appelle-t-on les animaux qui mangent de la viande ?", rep: "Les carnivores", faux: ["Les herbivores", "Les végétariens", "Les omnivores"] },
                { img: "🐄", q: "La vache mange de l'herbe. Elle est donc...", rep: "Herbivore", faux: ["Carnivore", "Insectivore", "Omnivore"] },
                { img: "🧍‍♀️", q: "Les humains mangent de tout (viande, plantes). Ils sont...", rep: "Omnivores", faux: ["Herbivores", "Carnivores", "Granivores"] },
                { img: "🌳", q: "Un arbre grandit, se nourrit et meurt. Est-il vivant ?", rep: "Oui, c'est un être vivant", faux: ["Non, c'est comme un caillou", "Non, car il ne bouge pas", "Non, car il ne parle pas"] }
            ]
        };

        let profil = { xp: 0 };
        let vies = 3; 
        let indexQuestion = 0; 
        let listeQuestions = []; 
        let bloque = false;
        let questionActuelle = null;

        const E = (id) => document.getElementById(id);

        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            majXP();
        }

        async function sauverProfilCloud() {
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function majXP() { E('ui-xp').textContent = `XP: ${profil.xp} ⭐`; }
        function ajouterXP(points) { profil.xp += points; majXP(); sauverProfilCloud(); }

        function changerEcran(id) { document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); E(id).classList.add('actif'); }
        function retourAccueil() { changerEcran('ecran-accueil'); }

        function lancerNiveau(mode, titreNiveau) {
            vies = 3; 
            indexQuestion = 0; 
            E('ui-titre-niveau').textContent = titreNiveau;
            
            // Si la base contient plus de 5 questions à l'avenir, ça en piochera 5 aléatoirement !
            listeQuestions = [...bdd[mode]].sort(() => Math.random() - 0.5).slice(0, 5); 
            
            E('ui-vies').textContent = "❤️❤️❤️"; 
            E('feedback').textContent = ""; 
            
            changerEcran('ecran-jeu'); 
            poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) {
                alert("Plus de vies ! Réfléchis bien et réessaie.");
                return retourAccueil();
            }
            if (indexQuestion >= listeQuestions.length) {
                alert("Niveau terminé ! Bien joué Lola ! +15 XP 🎉");
                ajouterXP(15);
                return retourAccueil();
            }

            bloque = false;
            E('ui-progression').textContent = `${indexQuestion + 1} / ${listeQuestions.length}`; 
            E('feedback').textContent = "";
            
            questionActuelle = listeQuestions[indexQuestion];
            E('question-texte').textContent = questionActuelle.q;
            E('question-image').textContent = questionActuelle.img; // Affiche l'emoji
            
            // Retire l'animation et la remet pour qu'elle s'exécute à chaque question
            E('question-image').style.animation = 'none';
            setTimeout(() => { E('question-image').style.animation = ''; }, 10);

            let options = [questionActuelle.rep, ...questionActuelle.faux];
            options.sort(() => Math.random() - 0.5);

            const boxBoutons = E('boutons-reponses'); 
            boxBoutons.innerHTML = '';
            
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "btn-rep";
                btn.textContent = opt;
                btn.onclick = () => validerReponse(btn, opt === questionActuelle.rep);
                boxBoutons.appendChild(btn);
            });
        }

        function validerReponse(btn, isCorrect) {
            if (bloque) return;
            bloque = true;
            
            const fb = E('feedback');
            document.querySelectorAll('.btn-rep').forEach(b => b.onclick = null);

            if (isCorrect) {
                btn.classList.add('correct');
                fb.textContent = "Excellent ! ✨"; fb.style.color = "#27ae60"; ajouterXP(5);
                setTimeout(() => { indexQuestion++; poserQuestion(); }, 1500);
            } else {
                btn.classList.add('erreur');
                fb.textContent = "Aïe... Regarde la bonne réponse."; fb.style.color = "#c0392b";
                
                document.querySelectorAll('.btn-rep').forEach(b => {
                    if (b.textContent === questionActuelle.rep) b.classList.add('correct');
                });

                vies--; E('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3 - vies);
                setTimeout(() => { indexQuestion++; poserQuestion(); }, 3500);
            }
        }

        document.addEventListener("DOMContentLoaded", chargerProfilCloud);
    </script>
</body>
</html>
