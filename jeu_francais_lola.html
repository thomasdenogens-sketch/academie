<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Français CE1 - L'Académie de Lola</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #fdc830 0%, #f37335 100%); 
            color: #333; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); max-width: 750px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #d35400; font-weight: 900; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { color: #e67e22; font-weight: bold; font-size: 1.1rem; margin-bottom: 25px; }
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Niveaux Progressifs */
        .niveau-section { text-align: left; margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 15px; border: 2px solid #ecf0f1; }
        .niveau-titre { font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .grid-menu { display: grid; grid-template-columns: 1fr; gap: 10px; }
        
        .btn-menu-theme {
            background: white; border: 3px solid #bdc3c7; padding: 12px 15px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; color: #34495e; cursor: pointer; transition: 0.1s;
            display: flex; align-items: center; justify-content: flex-start; gap: 15px; text-align: left;
            box-shadow: 0 4px 0 #bdc3c7;
        }
        .btn-menu-theme:active { transform: translateY(4px); box-shadow: none; }
        .btn-menu-theme.niv1 { border-color: #4ecdc4; box-shadow: 0 4px 0 #16a085; }
        .btn-menu-theme.niv2 { border-color: #3498db; box-shadow: 0 4px 0 #2980b9; }
        .theme-icon { font-size: 1.8rem; }

        /* HUD Jeu */
        #hud { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; border: 2px solid #ecf0f1;}
        
        /* Mode Orthographe */
        #dessin-box { font-size: 4.5rem; margin: 10px 0; animation: flotte 2s infinite ease-in-out; }
        @keyframes flotte { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #mot-a-construire { display: flex; justify-content: center; gap: 8px; margin: 20px 0; min-height: 60px; flex-wrap: wrap;}
        .case-lettre { width: 45px; height: 60px; border-bottom: 4px solid #bdc3c7; display: flex; justify-content: center; align-items: flex-end; font-size: 2.2rem; font-weight: 900; color: #2c3e50; padding-bottom: 5px; }
        #lettres-melangees { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .tuile-lettre { background: #f39c12; color: white; width: 55px; height: 55px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #d35400; transition: transform 0.1s; }
        .tuile-lettre:active { transform: translateY(4px); box-shadow: none; }
        .tuile-lettre.utilisee { opacity: 0; pointer-events: none; }

        /* Mode QCM (Grammaire / Conjugaison) */
        #consigne-qcm { font-size: 1.3rem; font-weight: 900; color: #8e44ad; margin-bottom: 20px; }
        #phrase-qcm { font-size: 1.5rem; font-weight: bold; color: #34495e; margin-bottom: 30px; line-height: 1.5; background: #f8f9fa; padding: 20px; border-radius: 15px; border: 2px dashed #bdc3c7;}
        
        .zone-boutons-qcm { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;}
        .btn-qcm { background: white; border: 3px solid #3498db; padding: 12px 25px; border-radius: 12px; font-size: 1.3rem; font-weight: bold; color: #2980b9; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 #2980b9;}
        .btn-qcm:active { transform: translateY(4px); box-shadow: none; }
        .btn-qcm.correct { background: #2ecc71; color: white; border-color: #27ae60; box-shadow: 0 4px 0 #2196f3; }
        .btn-qcm.erreur { background: #e74c3c; color: white; border-color: #c0392b; box-shadow: 0 4px 0 #c0392b; }

        /* Boutons Généraux */
        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; text-decoration: none; display: inline-block; transition: 0.2s; margin-top:10px;}
        .btn-nav:hover { background: #7f8c8d; }
        
        .erreur-anim { animation: secousse 0.4s; }
        @keyframes secousse { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        
        #feedback { font-size: 1.5rem; font-weight: 900; height: 40px; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge" id="ui-xp">XP: ... ⭐</div>

        <!-- ECRAN D'ACCUEIL -->
        <div id="ecran-accueil" class="ecran actif">
            <h1>Français CE1 📖</h1>
            <p class="subtitle">Grammaire, Conjugaison et Orthographe</p>
            
            <div class="niveau-section">
                <div class="niveau-titre">🟢 Étape 1 : Révisions de fin de CP</div>
                <div class="grid-menu">
                    <button class="btn-menu-theme niv1" onclick="lancerNiveau('ortho_cp', 'orthographe')">
                        <span class="theme-icon">🧩</span>
                        <div><div style="color:#16a085;">Sons simples</div><div style="font-size:0.85rem; color:#7f8c8d;">Mots basiques (chat, vélo...)</div></div>
                    </button>
                    <button class="btn-menu-theme niv1" onclick="lancerNiveau('gram_cp', 'grammaire')">
                        <span class="theme-icon">🔎</span>
                        <div><div style="color:#16a085;">Le Détective</div><div style="font-size:0.85rem; color:#7f8c8d;">Trouver le verbe d'action</div></div>
                    </button>
                </div>
            </div>

            <div class="niveau-section">
                <div class="niveau-titre">🔵 Étape 2 : L'entrée en CE1</div>
                <div class="grid-menu">
                    <button class="btn-menu-theme niv2" onclick="lancerNiveau('ortho_ce1', 'orthographe')">
                        <span class="theme-icon">🧩</span>
                        <div><div style="color:#2980b9;">Sons complexes</div><div style="font-size:0.85rem; color:#7f8c8d;">Sons OU, ON, CH, EAU...</div></div>
                    </button>
                    <button class="btn-menu-theme niv2" onclick="lancerNiveau('gram_ce1', 'grammaire')">
                        <span class="theme-icon">🕵️‍♀️</span>
                        <div><div style="color:#2980b9;">Qui fait l'action ?</div><div style="font-size:0.85rem; color:#7f8c8d;">Trouver le Sujet</div></div>
                    </button>
                    <button class="btn-menu-theme niv2" onclick="lancerNiveau('conj_ce1', 'conjugaison')">
                        <span class="theme-icon">✍️</span>
                        <div><div style="color:#2980b9;">La Machine à Verbes</div><div style="font-size:0.85rem; color:#7f8c8d;">Être, Avoir et verbes en -ER</div></div>
                    </button>
                </div>
            </div>
            
            <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div id="hud">
                <span id="ui-vies" style="letter-spacing: 5px;">❤️❤️❤️</span>
                <span id="ui-progression" style="color: #7f8c8d;">1 / 5</span>
            </div>
            
            <!-- Module Orthographe -->
            <div id="module-orthographe" style="display: none;">
                <div id="dessin-box">🐱</div>
                <div id="mot-a-construire"></div>
                <div id="lettres-melangees"></div>
            </div>

            <!-- Module QCM (Grammaire / Conjugaison) -->
            <div id="module-qcm" style="display: none;">
                <div id="consigne-qcm">Consigne</div>
                <div id="phrase-qcm">La petite fille mange une pomme.</div>
                <div class="zone-boutons-qcm" id="boutons-qcm"></div>
            </div>

            <div id="feedback"></div>
            <button class="btn-nav" onclick="retourAccueil()">⬅️ Changer d'exercice</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/lola/francaisLola.json`;

        // BASE DE DONNÉES ENRICHIE
        const bdd = {
            ortho_cp: [
                { mot: "CHAT", emoji: "🐱" }, { mot: "VELO", emoji: "🚲" }, 
                { mot: "LUNE", emoji: "🌙" }, { mot: "FILLE", emoji: "👧" }, 
                { mot: "LIVRE", emoji: "📖" }, { mot: "POMME", emoji: "🍎" },
                { mot: "SOLEIL", emoji: "☀️" }, { mot: "TABLE", emoji: "🪑" }
            ],
            ortho_ce1: [
                { mot: "CHATEAU", emoji: "🏰" }, { mot: "POISSON", emoji: "🐟" }, 
                { mot: "OISEAU", emoji: "🐦" }, { mot: "BOUCHON", emoji: "🍾" }, 
                { mot: "CHAMPIGNON", emoji: "🍄" }, { mot: "VOITURE", emoji: "🚗" },
                { mot: "GARCON", emoji: "👦" }, { mot: "BATEAU", emoji: "⛵" },
                { mot: "PHOQUE", emoji: "🦭" }, { mot: "CHAUSSURE", emoji: "👟" }
            ],
            gram_cp: [
                { phrase: "Le petit chat dort sur le lit.", consigne: "Trouve le VERBE (l'action)", rep: "dort" },
                { phrase: "Lola mange une pomme rouge.", consigne: "Trouve le VERBE (l'action)", rep: "mange" },
                { phrase: "Le grand chien aboie fort.", consigne: "Trouve le VERBE (l'action)", rep: "aboie" },
                { phrase: "Papa lit une belle histoire.", consigne: "Trouve le VERBE (l'action)", rep: "lit" },
                { phrase: "Les enfants jouent dans le jardin.", consigne: "Trouve le VERBE (l'action)", rep: "jouent" }
            ],
            gram_ce1: [
                { phrase: "Maman prépare un bon gâteau.", consigne: "Trouve le SUJET (Qui est-ce qui prépare ?)", rep: "Maman" },
                { phrase: "L'oiseau vole dans le ciel.", consigne: "Trouve le SUJET (Qui est-ce qui vole ?)", rep: "L'oiseau" },
                { phrase: "Les chevaux galopent vite.", consigne: "Trouve le mot au PLURIEL", rep: "chevaux" },
                { phrase: "Une souris grise se cache.", consigne: "Trouve le SUJET (Qui est-ce qui se cache ?)", rep: "souris" },
                { phrase: "Mes amis arrivent demain.", consigne: "Trouve le mot au PLURIEL", rep: "amis" }
            ],
            conj_ce1: [
                { phrase: "Je (chanter) _____ une chanson.", consigne: "Choisis la bonne terminaison :", choix: ["chante", "chantes", "chantons"], rep: "chante" },
                { phrase: "Tu (jouer) _____ avec ton chat.", consigne: "Choisis la bonne terminaison :", choix: ["joue", "joues", "jouez"], rep: "joues" },
                { phrase: "Nous (manger) _____ des frites.", consigne: "Choisis la bonne terminaison :", choix: ["mangons", "mangeons", "mangez"], rep: "mangeons" },
                { phrase: "Ils (parler) _____ très fort.", consigne: "Choisis la bonne terminaison :", choix: ["parle", "parlons", "parlent"], rep: "parlent" },
                { phrase: "J' (avoir) _____ un beau vélo.", consigne: "Complète avec le verbe AVOIR :", choix: ["est", "ai", "as"], rep: "ai" },
                { phrase: "Tu (être) _____ très gentille.", consigne: "Complète avec le verbe ÊTRE :", choix: ["es", "est", "suis"], rep: "es" },
                { phrase: "Lola et Théo (être) _____ dans le jardin.", consigne: "Complète avec le verbe ÊTRE :", choix: ["sont", "sommes", "êtes"], rep: "sont" }
            ]
        };

        let profil = { xp: 0 };
        let vies = 3; 
        let indexQuestion = 0; 
        let listeQuestions = []; 
        let typeAffiche = "";
        let motAttendu = ""; 
        let motSaisi = "";
        let bloque = false;

        // LE SAC DE QUESTIONS (LA PIOCHE)
        let sacsQuestions = {
            ortho_cp: [], ortho_ce1: [],
            gram_cp: [], gram_ce1: [],
            conj_ce1: []
        };

        const E = (id) => document.getElementById(id);

        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            majXP();
        }

        async function sauverProfilCloud() {
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function majXP() { E('ui-xp').textContent = `XP: ${profil.xp} ⭐`; }
        function ajouterXP(points) { profil.xp += points; majXP(); sauverProfilCloud(); }

        function changerEcran(id) { document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); E(id).classList.add('actif'); }
        function retourAccueil() { changerEcran('ecran-accueil'); }

        // Moteur de la Pioche
        function piocherQuestions(categorie, nombre) {
            // Si le sac est vide ou n'a pas assez de questions, on le remplit avec la BDD et on mélange
            if (sacsQuestions[categorie].length < nombre) {
                sacsQuestions[categorie] = [...bdd[categorie]].sort(() => Math.random() - 0.5);
            }
            // On retire et on renvoie 'nombre' questions du sac
            return sacsQuestions[categorie].splice(0, nombre);
        }

        function lancerNiveau(categorie, typeUi) {
            typeAffiche = typeUi;
            vies = 3; 
            indexQuestion = 0; 
            
            // On utilise notre nouvelle fonction de pioche (5 questions)
            listeQuestions = piocherQuestions(categorie, 5);
            
            E('ui-vies').textContent = "❤️❤️❤️"; 
            E('feedback').textContent = ""; 
            
            E('module-orthographe').style.display = (typeUi === 'orthographe') ? 'block' : 'none';
            E('module-qcm').style.display = (typeUi !== 'orthographe') ? 'block' : 'none';
            
            changerEcran('ecran-jeu'); 
            poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) {
                alert("Plus de vies ! Entraîne-toi encore.");
                return retourAccueil();
            }
            if (indexQuestion >= listeQuestions.length) {
                alert("Série terminée ! Bien joué Lola !");
                return retourAccueil();
            }

            bloque = false;
            E('ui-progression').textContent = `${indexQuestion + 1} / ${listeQuestions.length}`; 
            E('feedback').textContent = "";
            let data = listeQuestions[indexQuestion];

            if (typeAffiche === 'orthographe') {
                motAttendu = data.mot; motSaisi = "";
                E('dessin-box').textContent = data.emoji;
                
                const boxMot = E('mot-a-construire'); boxMot.innerHTML = '';
                for(let i=0; i<motAttendu.length; i++) { let div = document.createElement('div'); div.className = 'case-lettre'; boxMot.appendChild(div); }
                
                let lettres = motAttendu.split('').sort(() => Math.random() - 0.5);
                const boxLettres = E('lettres-melangees'); boxLettres.innerHTML = '';
                lettres.forEach((lettre) => {
                    let tuile = document.createElement('div'); tuile.className = 'tuile-lettre'; tuile.textContent = lettre;
                    tuile.onclick = () => cliquerLettre(tuile, lettre); boxLettres.appendChild(tuile);
                });
            } 
            else if (typeAffiche === 'grammaire') {
                E('consigne-qcm').textContent = data.consigne;
                E('phrase-qcm').style.display = "none"; 
                
                const boxBoutons = E('boutons-qcm'); boxBoutons.innerHTML = '';
                let mots = data.phrase.split(" ");
                mots.forEach(mot => {
                    let motPropre = mot.replace(/[.,!?']/g, ""); 
                    let btn = document.createElement('button');
                    btn.className = "btn-qcm";
                    btn.style.margin = "5px";
                    btn.textContent = mot;
                    // On gère les mots avec apostrophe (ex: L'oiseau -> L'oiseau est la bonne rep)
                    btn.onclick = () => validerQCM(btn, mot === data.rep || motPropre === data.rep);
                    boxBoutons.appendChild(btn);
                });
            }
            else if (typeAffiche === 'conjugaison') {
                E('consigne-qcm').textContent = data.consigne;
                E('phrase-qcm').style.display = "block";
                E('phrase-qcm').textContent = data.phrase;
                
                const boxBoutons = E('boutons-qcm'); boxBoutons.innerHTML = '';
                let choixMelanges = [...data.choix].sort(() => Math.random() - 0.5);
                
                choixMelanges.forEach(choix => {
                    let btn = document.createElement('button');
                    btn.className = "btn-qcm";
                    btn.textContent = choix;
                    btn.onclick = () => {
                        E('phrase-qcm').innerHTML = data.phrase.replace("_____", `<span style='color:#2980b9;'>${choix}</span>`);
                        validerQCM(btn, choix === data.rep);
                    };
                    boxBoutons.appendChild(btn);
                });
            }
        }

        function cliquerLettre(tuileElement, lettre) {
            if(bloque) return;
            motSaisi += lettre; tuileElement.classList.add('utilisee');
            let cases = document.querySelectorAll('.case-lettre'); cases[motSaisi.length - 1].textContent = lettre;
            
            if (motSaisi.length === motAttendu.length) {
                bloque = true;
                const fb = E('feedback');
                if (motSaisi === motAttendu) {
                    fb.textContent = "Bravo ! 🌟"; fb.style.color = "#27ae60"; ajouterXP(5);
                    setTimeout(() => { indexQuestion++; poserQuestion(); }, 1000);
                } else {
                    fb.textContent = "Oups ! 🔴"; fb.style.color = "#c0392b";
                    vies--; E('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3 - vies);
                    document.querySelectorAll('.case-lettre').forEach(c => c.classList.add('erreur-anim'));
                    setTimeout(() => { poserQuestion(); }, 1500);
                }
            }
        }

        function validerQCM(btn, isCorrect) {
            if (bloque) return;
            bloque = true;
            const fb = E('feedback');
            document.querySelectorAll('.btn-qcm').forEach(b => b.onclick = null);

            if (isCorrect) {
                btn.classList.add('correct');
                fb.textContent = "Excellent ! ✨"; fb.style.color = "#27ae60"; ajouterXP(5);
                setTimeout(() => { indexQuestion++; poserQuestion(); }, 1500);
            } else {
                btn.classList.add('erreur');
                fb.textContent = "Aïe... Regarde la correction."; fb.style.color = "#c0392b";
                
                let data = listeQuestions[indexQuestion];
                document.querySelectorAll('.btn-qcm').forEach(b => {
                    let textPropre = b.textContent.replace(/[.,!?']/g, "");
                    if (b.textContent === data.rep || textPropre === data.rep) b.classList.add('correct');
                });

                vies--; E('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3 - vies);
                setTimeout(() => { poserQuestion(); }, 2500);
            }
        }

        chargerProfilCloud();
    </script>
</body>
</html>
