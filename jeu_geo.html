<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géographie CM2 - L'Académie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%); 
            color: #2c3e50; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 800px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #2980b9; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Menu Hub Niveaux */
        .grid-niveaux { display: flex; flex-direction: column; gap: 15px; max-width: 600px; margin: 0 auto 30px auto; }
        .btn-niveau {
            background: #f8f9fa; border: 3px solid #bdc3c7; padding: 20px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 20px; text-align: left;
        }
        .btn-niveau:hover { background: #ebf5fb; border-color: #3498db; transform: translateX(5px); }
        .btn-niveau:active { transform: translateY(2px); }
        .niveau-icon { font-size: 2.5rem; }

        /* HUD Jeu */
        .hud-jeu { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; border: 2px solid #ecf0f1; }
        
        #question-box {
            background: #eef2f3; border: 3px dashed #3498db; border-radius: 15px;
            padding: 25px; font-size: 1.5rem; font-weight: 900; color: #2c3e50; margin-bottom: 25px;
        }

        /* Grille des réponses */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn-opt {
            background: white; border: 3px solid #bdc3c7; padding: 15px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; color: #34495e; cursor: pointer; transition: 0.1s;
            box-shadow: 0 4px 0 #bdc3c7;
        }
        .btn-opt:active { transform: translateY(4px); box-shadow: none; }
        .btn-opt.correct { background: #2ecc71; color: white; border-color: #27ae60; box-shadow: 0 4px 0 #219a52; }
        .btn-opt.erreur { background: #e74c3c; color: white; border-color: #c0392b; box-shadow: 0 4px 0 #b53120; }

        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s;}
        .btn-nav:hover { background: #7f8c8d; }
        
        #feedback { font-size: 1.4rem; font-weight: 900; height: 35px; margin-bottom: 15px; }

        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp-jeu">...</span> ⭐</div>

        <!-- ECRAN D'ACCUEIL -->
        <div id="ecran-hub" class="ecran actif">
            <h1>Explorateur du Monde 🌍</h1>
            <p class="sous-titre">Programme de Géographie CM2</p>
            
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('niveau1', '🇫🇷 Mission France')">
                    <span class="niveau-icon">🇫🇷</span>
                    <div>
                        <div style="color: #2980b9; font-size: 1.3rem;">Niveau 1 : Mission France</div>
                        <div style="font-size: 0.9rem; color: #7f8c8d; font-weight: normal;">Révisions : Fleuves, massifs et frontières.</div>
                    </div>
                </button>

                <button class="btn-niveau" onclick="lancerJeu('niveau2', '🇪🇺 Mission Europe')">
                    <span class="niveau-icon">🇪🇺</span>
                    <div>
                        <div style="color: #2980b9; font-size: 1.3rem;">Niveau 2 : Mission Europe</div>
                        <div style="font-size: 0.9rem; color: #7f8c8d; font-weight: normal;">L'Union Européenne, les pays et capitales.</div>
                    </div>
                </button>

                <button class="btn-niveau" onclick="lancerJeu('niveau3', '🗺️ Mission Monde & Outre-Mer')">
                    <span class="niveau-icon">🗺️</span>
                    <div>
                        <div style="color: #2980b9; font-size: 1.3rem;">Niveau 3 : Le Grand Voyage</div>
                        <div style="font-size: 0.9rem; color: #7f8c8d; font-weight: normal;">Les océans, les continents et les DROM-COM.</div>
                    </div>
                </button>
            </div>

            <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div class="hud-jeu">
                <span id="ui-vies" style="letter-spacing: 3px; color:#e74c3c;">❤️❤️❤️</span>
                <span id="ui-titre-niveau" style="color: #2980b9;">Niveau...</span>
                <span id="ui-progression">1 / 5</span>
            </div>
            
            <div id="question-box">Chargement de la question...</div>

            <div id="zone-boutons" class="options-grid">
                <!-- Les réponses s'affichent ici -->
            </div>

            <div id="feedback"></div>

            <button class="btn-nav" onclick="retourAccueil()">⬅️ Quitter la mission</button>
        </div>

    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/geoSaveV1.json`;

        let profil = { xp: 0 };
        let niveauActuelId = "";
        let indexQuestion = 0;
        let vies = 3;
        const totalQuestions = 5; // 5 questions par série pour ne pas lasser
        let questionEnCours = null;
        let bloque = false;

        // Le fameux "Sac de pioche" pour ne pas répéter les questions
        let sacQuestions = [];

        // --- LA BASE DE DONNÉES GÉOGRAPHIE PROGRESSIVE ---
        const bddGeographie = {
            niveau1: [
                { q: "Quel est le plus long fleuve de France ?", rep: "La Loire", faux: ["Le Rhône", "La Seine", "La Garonne"] },
                { q: "Quelle chaîne de montagnes sépare la France de l'Espagne ?", rep: "Les Pyrénées", faux: ["Les Alpes", "Le Jura", "Le Massif Central"] },
                { q: "Quel océan borde la côte ouest de la France ?", rep: "L'Océan Atlantique", faux: ["La Mer Méditerranée", "La Manche", "L'Océan Pacifique"] },
                { q: "Quelle est la plus haute montagne de France et d'Europe ?", rep: "Le Mont Blanc", faux: ["Le Mont Ventoux", "Le Pic du Midi", "Le Piton des Neiges"] },
                { q: "Quel fleuve traverse Paris ?", rep: "La Seine", faux: ["Le Rhône", "La Loire", "Le Rhin"] },
                { q: "Avec quel pays la France ne partage-t-elle PAS de frontière terrestre ?", rep: "Le Portugal", faux: ["L'Italie", "L'Allemagne", "La Belgique"] }
            ],
            niveau2: [
                { q: "Combien de pays font partie de l'Union Européenne (en 2024) ?", rep: "27", faux: ["15", "50", "32"] },
                { q: "Quelle est la capitale de l'Allemagne ?", rep: "Berlin", faux: ["Munich", "Vienne", "Francfort"] },
                { q: "Quel pays ressemble à une grande botte sur la carte de l'Europe ?", rep: "L'Italie", faux: ["L'Espagne", "La Grèce", "Le Royaume-Uni"] },
                { q: "Dans quelle ville européenne se trouve le siège principal du Parlement européen ?", rep: "Strasbourg", faux: ["Bruxelles", "Paris", "Berlin"] },
                { q: "Quelle monnaie est utilisée par la majorité des pays de l'Union Européenne ?", rep: "L'Euro", faux: ["Le Dollar", "La Livre Sterling", "Le Franc"] },
                { q: "Quelle île se situe au sud de l'Italie ?", rep: "La Sicile", faux: ["La Corse", "La Crète", "Ibiza"] }
            ],
            niveau3: [
                { q: "Que signifie le sigle DROM ?", rep: "Département et Région d'Outre-Mer", faux: ["Domaine Réservé d'Outre-Mer", "Direction Régionale des Océans et Mers", "Département Reculé d'Outre-Mer"] },
                { q: "Laquelle de ces îles est un département français situé dans l'Océan Indien ?", rep: "La Réunion", faux: ["La Martinique", "La Guadeloupe", "La Nouvelle-Calédonie"] },
                { q: "Où se situe la Guyane française ?", rep: "En Amérique du Sud", faux: ["En Afrique", "En Océanie", "En Asie"] },
                { q: "Quel est le plus grand océan du monde ?", rep: "L'Océan Pacifique", faux: ["L'Océan Atlantique", "L'Océan Indien", "L'Océan Glacial Arctique"] },
                { q: "Sur quel continent se trouve le désert du Sahara ?", rep: "L'Afrique", faux: ["L'Asie", "L'Amérique du Sud", "L'Océanie"] },
                { q: "Lequel de ces territoires d'Outre-Mer est situé dans l'Océan Pacifique ?", rep: "La Polynésie française", faux: ["La Martinique", "Mayotte", "Saint-Pierre-et-Miquelon"] }
            ]
        };

        // --- GESTION DU CLOUD ---
        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            document.getElementById('ui-xp-jeu').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne;
            document.getElementById('ui-xp-jeu').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        // --- NAVIGATION ---
        function changerEcran(id) { 
            document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); 
            document.getElementById(id).classList.add('actif'); 
        }
        function retourAccueil() { changerEcran('ecran-hub'); }

        // --- MOTEUR DE JEU ---
        function lancerJeu(idNiveau, titreNiveau) {
            niveauActuelId = idNiveau;
            indexQuestion = 0;
            vies = 3;
            bloque = false;
            sacQuestions = []; // On vide le sac de pioche quand on change de niveau

            document.getElementById('ui-titre-niveau').textContent = titreNiveau;
            document.getElementById('ui-vies').textContent = "❤️❤️❤️";
            
            changerEcran('ecran-jeu');
            poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) {
                alert("Fin de l'expédition ! Plus de vies. Révise un peu et retente ta chance ! 🌍");
                return retourAccueil();
            }
            if (indexQuestion >= totalQuestions) {
                alert("Mission accomplie ! Un sans-faute parfait ! 🎉 (+20 XP Bonus)");
                sauverProfilCloud(20);
                return retourAccueil();
            }

            bloque = false;
            indexQuestion++;
            document.getElementById('ui-progression').textContent = `${indexQuestion} / ${totalQuestions}`;
            document.getElementById('feedback').textContent = "";
            
            // LA PIOCHE : Si le sac est vide, on le remplit avec les questions du niveau et on mélange !
            let bddNiveau = bddGeographie[niveauActuelId];
            if (sacQuestions.length === 0) {
                sacQuestions = [...bddNiveau].sort(() => Math.random() - 0.5);
            }

            // On tire une question du sac (sans remise)
            questionEnCours = sacQuestions.pop();

            // Affichage de la question
            document.getElementById('question-box').textContent = questionEnCours.q;

            // Mélange des réponses (1 vraie + 3 fausses)
            let options = [questionEnCours.rep, ...questionEnCours.faux];
            options.sort(() => Math.random() - 0.5);

            // Création des boutons HTML
            const zoneBoutons = document.getElementById('zone-boutons');
            zoneBoutons.innerHTML = "";
            
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "btn-opt";
                btn.textContent = opt;
                btn.onclick = () => verifierReponse(btn, opt === questionEnCours.rep);
                zoneBoutons.appendChild(btn);
            });
        }

        function verifierReponse(bouton, estCorrect) {
            if (bloque) return;
            bloque = true;

            const fb = document.getElementById('feedback');

            if (estCorrect) {
                bouton.classList.add('correct');
                fb.textContent = "Exact ! Bien joué ! 🧭"; 
                fb.style.color = "#27ae60";
                
                sauverProfilCloud(5); // +5 XP par bonne réponse
                
                setTimeout(poserQuestion, 1200);
            } else {
                bouton.classList.add('erreur');
                vies--;
                document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
                fb.textContent = `Aïe ! La bonne réponse était : ${questionEnCours.rep}`; 
                fb.style.color = "#c0392b";
                
                // Mettre en surbrillance la bonne réponse pour qu'il apprenne
                document.querySelectorAll('.btn-opt').forEach(b => {
                    if (b.textContent === questionEnCours.rep) b.classList.add('correct');
                });

                setTimeout(poserQuestion, 3000);
            }
        }

        // Lancement Initial
        chargerProfilCloud();
    </script>
</body>
</html>
