<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Studio de Géométrie CM2 - L'Académie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #16a085 0%, #f4d03f 100%); color: #2c3e50; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        #app-container { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 800px; width: 100%; text-align: center; position: relative; }
        h1 { color: #16a085; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        .grid-niveaux { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; text-align: left;}
        .btn-niveau { background: #fff; border: 3px solid #bdc3c7; padding: 15px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .btn-niveau:hover { background: #f8f9fa; border-color: #16a085; transform: translateX(5px); }

        .titre-section { background: #16a085; color: white; padding: 10px; border-radius: 10px; margin: 20px 0 10px 0; font-weight: 900;}
        .titre-section.geogebra { background: #8e44ad; }
        .titre-section.angles { background: #e67e22; }
        .titre-section.iso3d { background: #e74c3c; }
        .titre-section.symetrie { background: #2980b9; }

        .hud-jeu { background: #f8f9fa; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 2px solid #ecf0f1; }
        .hud-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px;}
        .barre-bg { width: 100%; height: 15px; background: #bdc3c7; border-radius: 10px; overflow: hidden; }
        .barre-fill { height: 100%; background: #2ecc71; width: 0%; transition: width 0.3s ease-out; }
        
        #canvas-container { background: #fdfdfd; border: 3px dashed #bdc3c7; border-radius: 15px; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; width: 100%; max-width: 400px; height: 400px; position: relative; overflow: hidden;}
        canvas { max-width: 100%; max-height: 100%; cursor: crosshair;}

        #question-texte { font-size: 1.4rem; color: #34495e; font-weight: 900; margin-bottom: 10px; }
        #consigne-supp { font-size: 1rem; color: #7f8c8d; font-weight: bold; margin-bottom: 20px; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn-opt { background: white; border: 3px solid #3498db; padding: 15px; border-radius: 15px; font-size: 1.3rem; font-weight: bold; color: #2980b9; cursor: pointer; transition: 0.1s; }
        .btn-opt.correct { background: #2ecc71; color: white; border-color: #27ae60; }
        .btn-opt.erreur { background: #e74c3c; color: white; border-color: #c0392b; }

        #zone-saisie { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; }
        #input-mesure { font-size: 1.5rem; width: 120px; padding: 10px; text-align: center; border: 3px solid #3498db; border-radius: 10px; font-weight: bold; }
        .btn-valider { background: #3498db; color: white; font-weight: bold; font-size: 1.2rem; padding: 10px 25px; border: none; border-radius: 10px; cursor: pointer; }

        #zone-actions { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn-action { background: #2ecc71; color: white; font-weight: bold; font-size: 1.1rem; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s;}
        
        .btn-nav { background: #7f8c8d; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s;}
        #feedback { font-size: 1.3rem; font-weight: 900; height: 35px; margin-bottom: 15px; }

        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp-jeu">...</span> ⭐</div>

        <!-- MENU PRINCIPAL -->
        <div id="ecran-hub" class="ecran actif">
            <h1>Studio de Géométrie 📐</h1>
            <p class="sous-titre">Entraînement progressif pour le CM2</p>

            <div class="titre-section symetrie">Le Dessin Vectoriel (Symétrie)</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('symetrie', 1)" style="border-color: #2980b9;">
                    <div><strong>Niv 1 : Formes Basiques</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Triangles, Carrés, Losanges</span></div><span>▶️</span>
                </button>
                <button class="btn-niveau" onclick="lancerJeu('symetrie', 2)" style="border-color: #2980b9;">
                    <div><strong>Niv 2 : Objets du quotidien</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Lettres, Maisons, Flèches</span></div><span>▶️</span>
                </button>
                <button class="btn-niveau" onclick="lancerJeu('symetrie', 3)" style="border-color: #2980b9;">
                    <div><strong>Niv 3 : Figures Complexes</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Étoiles, Couronnes, Sabliers</span></div><span>▶️</span>
                </button>
            </div>

            <div class="titre-section iso3d">La Construction Spatiale (Volumes 3D)</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('iso3d', 1)" style="border-color: #e74c3c;">
                    <div><strong>Le Moteur Isométrique</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Construis des volumes en 3D !</span></div><span>▶️</span>
                </button>
            </div>
            
            <div class="titre-section geogebra">L'Atelier Interactif (GeoGebra)</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('geoplan', 1)" style="border-color: #8e44ad;">
                    <div><strong>Le Géoplan Dynamique</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Construis, étire et reproduis !</span></div><span>▶️</span>
                </button>
            </div>

            <div class="titre-section">Périmètres et Aires (Classique)</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('mesures', 1)"><div><strong>Niveau 1 : Le Périmètre</strong></div><span>▶️</span></button>
                <button class="btn-niveau" onclick="lancerJeu('mesures', 2)"><div><strong>Niveau 2 : L'Aire</strong></div><span>▶️</span></button>
            </div>

            <div class="titre-section angles">Les Angles</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('angles', 1)"><div><strong>Niveau 1 : Les bases</strong></div><span>▶️</span></button>
                <button class="btn-niveau" onclick="lancerJeu('angles', 2)"><div><strong>Niveau 2 : L'œil de lynx</strong></div><span>▶️</span></button>
            </div>

            <button class="btn-nav" style="margin-top: 15px;" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div class="hud-jeu">
                <div class="hud-top">
                    <span id="ui-vies" style="letter-spacing: 3px; color:#e74c3c;">❤️❤️❤️</span>
                    <span id="ui-titre-niveau" style="color: #2980b9;">Niveau...</span>
                    <span id="ui-progression">1 / 5</span>
                </div>
                <div class="barre-bg"><div class="barre-fill" id="barre-prog"></div></div>
            </div>
            
            <div id="question-texte">Question...</div>
            <div id="consigne-supp"></div>

            <div id="canvas-container">
                <canvas id="canvas-geo" width="400" height="400"></canvas>
            </div>

            <div id="zone-boutons" class="options-grid"></div>
            <div id="zone-saisie"><input type="number" id="input-mesure" autocomplete="off"><button class="btn-valider" onclick="verifierSaisie()">Valider</button></div>

            <div id="zone-actions">
                <button class="btn-action" style="background:#e74c3c;" onclick="effacerDessin()">Effacer la ligne</button>
                <button class="btn-action" onclick="validerExercice()">Vérifier ma forme</button>
            </div>

            <div id="feedback"></div>
            <button class="btn-nav" onclick="retourAccueil()">⬅️ Quitter l'atelier</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION ET SAUVEGARDE CLOUD
        // ==========================================
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/mathsV8.json`;

        let profil = { xp: 0 };
        let modeActuel = "", niveauActuel = 1, indexQuestion = 0, vies = 3;
        const totalQuestions = 5; // Nombre de questions par série
        let reponseAttendue = null, isProcessing = false;

        const canvas = document.getElementById('canvas-geo');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // BASE DE DONNÉES SYMÉTRIE (Structurée par niveaux)
        // Les coordonnées s'inscrivent dans un cadre 400x400
        // ==========================================
        const bddSymetrie = {
            niv1: [
                [{x: 100, y: 100}, {x: 300, y: 100}, {x: 300, y: 300}, {x: 100, y: 300}], // Carré
                [{x: 200, y: 50}, {x: 350, y: 350}, {x: 50, y: 350}], // Triangle isocèle vertical
                [{x: 50, y: 200}, {x: 350, y: 50}, {x: 350, y: 350}], // Triangle isocèle horizontal
                [{x: 200, y: 50}, {x: 350, y: 200}, {x: 200, y: 350}, {x: 50, y: 200}], // Losange
                [{x: 100, y: 50}, {x: 300, y: 50}, {x: 300, y: 350}, {x: 100, y: 350}], // Rectangle vertical
                [{x: 50, y: 100}, {x: 350, y: 100}, {x: 350, y: 300}, {x: 50, y: 300}], // Rectangle horizontal
                [{x: 200, y: 50}, {x: 300, y: 150}, {x: 200, y: 350}, {x: 100, y: 150}], // Cerf-volant vertical
                [{x: 50, y: 200}, {x: 150, y: 100}, {x: 350, y: 200}, {x: 150, y: 300}]  // Cerf-volant horizontal
            ],
            niv2: [
                [{x: 100, y: 50}, {x: 300, y: 50}, {x: 300, y: 120}, {x: 230, y: 120}, {x: 230, y: 350}, {x: 170, y: 350}, {x: 170, y: 120}, {x: 100, y: 120}], // Lettre T
                [{x: 200, y: 50}, {x: 300, y: 150}, {x: 300, y: 350}, {x: 100, y: 350}, {x: 100, y: 150}], // Maison 
                [{x: 150, y: 50}, {x: 250, y: 50}, {x: 250, y: 150}, {x: 350, y: 150}, {x: 350, y: 250}, {x: 250, y: 250}, {x: 250, y: 350}, {x: 150, y: 350}, {x: 150, y: 250}, {x: 50, y: 250}, {x: 50, y: 150}, {x: 150, y: 150}], // Croix épaisse
                [{x: 50, y: 150}, {x: 350, y: 150}, {x: 350, y: 250}, {x: 250, y: 250}, {x: 250, y: 350}, {x: 150, y: 350}, {x: 150, y: 250}, {x: 50, y: 250}], // T inversé
                [{x: 150, y: 50}, {x: 250, y: 50}, {x: 250, y: 250}, {x: 350, y: 250}, {x: 350, y: 350}, {x: 50, y: 350}, {x: 50, y: 250}, {x: 150, y: 250}], // Forme U à l'envers
                [{x: 150, y: 250}, {x: 150, y: 50}, {x: 250, y: 50}, {x: 250, y: 250}, {x: 350, y: 250}, {x: 200, y: 380}, {x: 50, y: 250}], // Flèche vers le bas
                [{x: 250, y: 150}, {x: 350, y: 150}, {x: 350, y: 250}, {x: 250, y: 250}, {x: 250, y: 350}, {x: 120, y: 200}, {x: 250, y: 50}]  // Flèche vers la gauche
            ],
            niv3: [
                [{x: 100, y: 50}, {x: 300, y: 50}, {x: 100, y: 350}, {x: 300, y: 350}], // Sablier croisé (Papillon)
                [{x: 50, y: 50}, {x: 125, y: 150}, {x: 200, y: 50}, {x: 275, y: 150}, {x: 350, y: 50}, {x: 350, y: 350}, {x: 50, y: 350}], // Couronne
                [{x: 200, y: 50}, {x: 230, y: 150}, {x: 350, y: 150}, {x: 250, y: 220}, {x: 300, y: 350}, {x: 200, y: 280}, {x: 100, y: 350}, {x: 150, y: 220}, {x: 50, y: 150}, {x: 170, y: 150}], // Étoile complexe
                [{x: 150, y: 50}, {x: 250, y: 50}, {x: 350, y: 150}, {x: 350, y: 250}, {x: 250, y: 350}, {x: 150, y: 350}, {x: 50, y: 250}, {x: 50, y: 150}], // Octogone
                [{x: 100, y: 50}, {x: 300, y: 50}, {x: 350, y: 200}, {x: 300, y: 350}, {x: 100, y: 350}, {x: 50, y: 200}], // Hexagone plat
                [{x: 200, y: 50}, {x: 280, y: 150}, {x: 230, y: 150}, {x: 320, y: 280}, {x: 250, y: 280}, {x: 250, y: 350}, {x: 150, y: 350}, {x: 150, y: 280}, {x: 80, y: 280}, {x: 170, y: 150}, {x: 120, y: 150}] // Sapin
            ]
        };

        async function chargerProfilCloud() { try { let res = await fetch(DB_URL); let data = await res.json(); if (data && data.xp) profil.xp = parseInt(data.xp) || 0; } catch(e) {} document.getElementById('ui-xp-jeu').textContent = profil.xp; }
        async function sauverProfilCloud(xpGagne) { profil.xp += xpGagne; document.getElementById('ui-xp-jeu').textContent = profil.xp; try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {} }

        function changerEcran(id) { document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); document.getElementById(id).classList.add('actif'); }
        function retourAccueil() { changerEcran('ecran-hub'); }

        let formesMelangees = [];

        function lancerJeu(mode, niveau) {
            modeActuel = mode; niveauActuel = niveau; indexQuestion = 0; vies = 3; isProcessing = false;
            document.getElementById('ui-vies').textContent = "❤️❤️❤️";
            
            // L'ALGORITHME DE PIOCHE : On mélange les formes du bon niveau
            if (mode === 'symetrie') {
                let cleNiveau = 'niv' + niveauActuel;
                // Repli de sécurité si le niveau n'existe pas
                let reserveFormes = bddSymetrie[cleNiveau] || bddSymetrie.niv1; 
                formesMelangees = [...reserveFormes].sort(() => Math.random() - 0.5).slice(0, totalQuestions);
            }

            changerEcran('ecran-jeu'); poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) { alert("Plus de vies ! Révise encore un peu et réessaie."); return retourAccueil(); }
            if (indexQuestion >= totalQuestions) {
                alert(`Niveau ${niveauActuel} complété ! +${niveauActuel * 20} XP 🎉`);
                sauverProfilCloud(niveauActuel * 20); 
                return retourAccueil();
            }

            isProcessing = false; indexQuestion++;
            
            document.getElementById('ui-progression').textContent = `${indexQuestion} / ${totalQuestions}`;
            document.getElementById('barre-prog').style.width = `${(indexQuestion / totalQuestions) * 100}%`;
            
            let nomTitre = modeActuel === 'geoplan' ? 'Géoplan' : modeActuel === 'iso3d' ? 'Moteur 3D' : modeActuel === 'angles' ? 'Angles' : modeActuel === 'symetrie' ? 'Symétrie' : 'Mesures';
            document.getElementById('ui-titre-niveau').textContent = `${nomTitre} - Niv ${niveauActuel}`;
            document.getElementById('feedback').textContent = ""; document.getElementById('consigne-supp').textContent = "";
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            document.getElementById('zone-boutons').style.display = 'none'; document.getElementById('zone-saisie').style.display = 'none'; document.getElementById('zone-actions').style.display = 'none';
            canvas.onmousedown = null; canvas.onmousemove = null; canvas.onmouseup = null; canvas.onmouseleave = null;

            if (modeActuel === 'symetrie') genererQuestionSymetrie();
            else if (modeActuel === 'geoplan') genererQuestionGeoplan();
            else if (modeActuel === 'iso3d') genererQuestionIso3D();
            else if (modeActuel === 'angles') genererQuestionAngle();
            else genererQuestionMesure(); 
        }

        function effacerDessin() {
            if (modeActuel === 'geoplan') effacerGeoplan();
            else if (modeActuel === 'iso3d') effacerIso3D();
            else if (modeActuel === 'symetrie') effacerSymetrie();
        }

        function validerExercice() {
            if (modeActuel === 'geoplan') validerGeoplan();
            else if (modeActuel === 'iso3d') validerIso3D();
            else if (modeActuel === 'symetrie') validerSymetrie();
        }

        function reponseIncorrecte(message) {
            vies--; document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
            document.getElementById('feedback').textContent = message; document.getElementById('feedback').style.color = "#e74c3c";
            setTimeout(() => { isProcessing = false; }, 2000);
        }

        function reponseCorrecte(message, gainXP) {
            document.getElementById('feedback').textContent = message; document.getElementById('feedback').style.color = "#27ae60";
            sauverProfilCloud(gainXP); setTimeout(poserQuestion, 1500);
        }

        // ==========================================
        // 0. LA SYMÉTRIE AXIALE
        // ==========================================
        let formeASymetriser = [];
        let axeTraces = [];
        let isDrawingAxe = false;

        function genererQuestionSymetrie() {
            document.getElementById('zone-actions').style.display = 'flex';
            document.getElementById('question-texte').innerHTML = `Trace <strong>l'Axe de Symétrie</strong> de cette figure.`;
            document.getElementById('consigne-supp').textContent = "Clique pour placer le début de la ligne, glisse, et lâche pour placer la fin.";

            formeASymetriser = formesMelangees[indexQuestion - 1];
            axeTraces = [];
            dessinerEspaceSymetrie();

            canvas.onmousedown = function(e) {
                if (isProcessing || axeTraces.length === 2) return; 
                const rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left; let y = e.clientY - rect.top;
                axeTraces.push({x: x, y: y});
                isDrawingAxe = true;
            };

            canvas.onmousemove = function(e) {
                if (!isDrawingAxe) return;
                const rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left; let y = e.clientY - rect.top;
                
                dessinerEspaceSymetrie();
                ctx.beginPath();
                ctx.moveTo(axeTraces[0].x, axeTraces[0].y);
                ctx.lineTo(x, y);
                ctx.strokeStyle = "red"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            };

            canvas.onmouseup = function(e) {
                if (!isDrawingAxe) return;
                const rect = canvas.getBoundingClientRect();
                let x = e.clientX - rect.left; let y = e.clientY - rect.top;
                axeTraces.push({x: x, y: y}); 
                isDrawingAxe = false;
                dessinerEspaceSymetrie(); 
            };
        }

        function dessinerEspaceSymetrie() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.moveTo(formeASymetriser[0].x, formeASymetriser[0].y);
            for (let i = 1; i < formeASymetriser.length; i++) {
                ctx.lineTo(formeASymetriser[i].x, formeASymetriser[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = "rgba(41, 128, 185, 0.3)"; ctx.fill();
            ctx.strokeStyle = "#2980b9"; ctx.lineWidth = 3; ctx.stroke();

            if (axeTraces.length === 2) {
                ctx.beginPath();
                ctx.moveTo(axeTraces[0].x, axeTraces[0].y);
                ctx.lineTo(axeTraces[1].x, axeTraces[1].y);
                ctx.strokeStyle = "#e74c3c"; ctx.lineWidth = 4; ctx.stroke();
            }
        }

        function effacerSymetrie() {
            axeTraces = [];
            dessinerEspaceSymetrie();
            document.getElementById('feedback').textContent = "";
        }

        function validerSymetrie() {
            if (isProcessing) return;
            if (axeTraces.length < 2) {
                document.getElementById('feedback').textContent = "Trace un axe avant de valider !";
                document.getElementById('feedback').style.color = "#e67e22"; return;
            }
            isProcessing = true;

            let p1 = axeTraces[0]; let p2 = axeTraces[1];
            
            let distanceAxe = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            if (distanceAxe < 50) {
                effacerSymetrie(); 
                reponseIncorrecte("Ton axe est trop court, étire bien la ligne !"); return;
            }

            let a = p2.y - p1.y;
            let b = p1.x - p2.x;
            let c = (p2.x * p1.y) - (p1.x * p2.y);
            let diviseur = (a * a) + (b * b);

            let estSymetrique = true;

            for (let pt of formeASymetriser) {
                let temp = -2 * (a * pt.x + b * pt.y + c) / diviseur;
                let refX = pt.x + temp * a;
                let refY = pt.y + temp * b;

                let correspond = false;
                for (let cible of formeASymetriser) {
                    if (Math.abs(refX - cible.x) < 15 && Math.abs(refY - cible.y) < 15) {
                        correspond = true; break;
                    }
                }
                if (!correspond) { estSymetrique = false; break; }
            }

            if (estSymetrique) {
                reponseCorrecte("Magnifique ! C'est un axe parfait ! 📏✨", 20);
            } else {
                effacerSymetrie(); 
                reponseIncorrecte("Non, si tu plies sur cet axe, les bords ne se superposent pas !");
            }
        }


        // ==========================================
        // 1. LE MOTEUR ISOMÉTRIQUE 3D
        // ==========================================
        let grille3D = [];
        const ISO_GRID_SIZE = 5;
        const TILE_W = 40; const TILE_H = 20; const ISO_START_X = 200; const ISO_START_Y = 100;

        function genererQuestionIso3D() {
            document.getElementById('zone-actions').style.display = 'flex';
            grille3D = Array(ISO_GRID_SIZE).fill(0).map(() => Array(ISO_GRID_SIZE).fill(0));
            reponseAttendue = Math.floor(Math.random() * 8) + 5; 
            document.getElementById('question-texte').innerHTML = `Construis un solide avec un <strong>Volume de ${reponseAttendue} cubes</strong>.`;
            document.getElementById('consigne-supp').textContent = "Clique pour empiler des blocs. Clic droit (ou CTRL+Clic) pour retirer.";

            dessinerIso3D();

            canvas.onmousedown = function(e) {
                if(isProcessing) return;
                e.preventDefault(); 
                let coords = obtenirCoordsIso(e);
                if(coords) {
                    if (e.button === 2 || e.ctrlKey) {
                        if(grille3D[coords.y][coords.x] > 0) grille3D[coords.y][coords.x]--;
                    } else {
                        if(grille3D[coords.y][coords.x] < 6) grille3D[coords.y][coords.x]++;
                    }
                    dessinerIso3D();
                    document.getElementById('feedback').textContent = `Volume actuel : ${calculerVolume()} cubes`;
                    document.getElementById('feedback').style.color = "#e74c3c";
                }
            };
            canvas.oncontextmenu = e => e.preventDefault();
        }

        function obtenirCoordsIso(event) {
            const rect = canvas.getBoundingClientRect();
            let mx = event.clientX - rect.left - ISO_START_X; let my = event.clientY - rect.top - ISO_START_Y;
            let tileX = Math.floor((mx / (TILE_W / 2) + my / (TILE_H / 2)) / 2);
            let tileY = Math.floor((my / (TILE_H / 2) - mx / (TILE_W / 2)) / 2);
            if(tileX >= 0 && tileX < ISO_GRID_SIZE && tileY >= 0 && tileY < ISO_GRID_SIZE) return {x: tileX, y: tileY};
            return null;
        }

        function isoVersEcran(x, y, z) {
            return { x: ISO_START_X + (x - y) * (TILE_W / 2), y: ISO_START_Y + (x + y) * (TILE_H / 2) - (z * TILE_H) };
        }

        function dessinerIso3D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let x = 0; x < ISO_GRID_SIZE; x++) {
                for (let y = 0; y < ISO_GRID_SIZE; y++) {
                    dessinerFace(x, y, 0, "#bdc3c7");
                    for(let z = 1; z <= grille3D[y][x]; z++) dessinerCube(x, y, z);
                }
            }
        }

        function dessinerFace(x, y, z, couleur) {
            let p1 = isoVersEcran(x, y, z); let p2 = isoVersEcran(x, y+1, z); let p3 = isoVersEcran(x+1, y+1, z); let p4 = isoVersEcran(x+1, y, z);
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath();
            ctx.fillStyle = couleur; ctx.fill(); ctx.strokeStyle = "#95a5a6"; ctx.stroke();
        }

        function dessinerCube(x, y, z) {
            let pTop1 = isoVersEcran(x, y, z); let pTop2 = isoVersEcran(x, y+1, z); let pTop3 = isoVersEcran(x+1, y+1, z); let pTop4 = isoVersEcran(x+1, y, z);
            let pBot2 = isoVersEcran(x, y+1, z-1); let pBot3 = isoVersEcran(x+1, y+1, z-1); let pBot4 = isoVersEcran(x+1, y, z-1);

            ctx.beginPath(); ctx.moveTo(pTop1.x, pTop1.y); ctx.lineTo(pTop2.x, pTop2.y); ctx.lineTo(pTop3.x, pTop3.y); ctx.lineTo(pTop4.x, pTop4.y); ctx.closePath();
            ctx.fillStyle = "#5dade2"; ctx.fill(); ctx.strokeStyle = "#2980b9"; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(pTop2.x, pTop2.y); ctx.lineTo(pBot2.x, pBot2.y); ctx.lineTo(pBot3.x, pBot3.y); ctx.lineTo(pTop3.x, pTop3.y); ctx.closePath();
            ctx.fillStyle = "#2e86c1"; ctx.fill(); ctx.stroke();

            ctx.beginPath(); ctx.moveTo(pTop3.x, pTop3.y); ctx.lineTo(pBot3.x, pBot3.y); ctx.lineTo(pBot4.x, pBot4.y); ctx.lineTo(pTop4.x, pTop4.y); ctx.closePath();
            ctx.fillStyle = "#21618c"; ctx.fill(); ctx.stroke();
        }

        function effacerIso3D() { grille3D = Array(ISO_GRID_SIZE).fill(0).map(() => Array(ISO_GRID_SIZE).fill(0)); document.getElementById('feedback').textContent = ""; dessinerIso3D(); }
        function calculerVolume() { let v = 0; for(let x=0; x<ISO_GRID_SIZE; x++) for(let y=0; y<ISO_GRID_SIZE; y++) v += grille3D[y][x]; return v; }

        function validerIso3D() {
            if(isProcessing) return; isProcessing = true;
            let vol = calculerVolume();
            if(vol === reponseAttendue) reponseCorrecte("Génial ! Le volume est exact ! 🧊", 15); else reponseIncorrecte(`Faux. Il fallait ${reponseAttendue} cubes.`);
        }

        // ==========================================
        // 2. LES ANGLES
        // ==========================================
        function genererQuestionAngle() {
            document.getElementById('zone-boutons').style.display = 'grid'; document.getElementById('question-texte').textContent = "Quel est le type de cet angle ?";
            let types = ['Aigu', 'Droit', 'Obtus']; let typeChoisi = types[Math.floor(Math.random() * types.length)]; reponseAttendue = typeChoisi;
            let angleDeg; if (typeChoisi === 'Droit') angleDeg = 90; else if (typeChoisi === 'Aigu') angleDeg = Math.floor(Math.random() * 45) + 30; else angleDeg = Math.floor(Math.random() * 45) + 110; 
            let rotationBase = niveauActuel === 1 ? 0 : Math.floor(Math.random() * 360);

            ctx.save(); ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate((rotationBase * Math.PI) / 180);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(100, 0); ctx.lineWidth = 5; ctx.strokeStyle = "#34495e"; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(100 * Math.cos((-angleDeg * Math.PI) / 180), 100 * Math.sin((-angleDeg * Math.PI) / 180)); ctx.stroke();
            ctx.beginPath(); if (typeChoisi === 'Droit') { ctx.rect(0, -20, 20, 20); } else { ctx.arc(0, 0, 30, (-angleDeg * Math.PI) / 180, 0); }
            ctx.strokeStyle = "#e74c3c"; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();

            const zoneBtns = document.getElementById('zone-boutons'); zoneBtns.innerHTML = "";
            types.forEach(t => { let b = document.createElement('button'); b.className = 'btn-opt'; b.textContent = t; b.onclick = () => verifierAngle(b, t); zoneBtns.appendChild(b); });
        }

        function verifierAngle(bouton, choix) {
            if (isProcessing) return; isProcessing = true; document.querySelectorAll('.btn-opt').forEach(b => b.onclick = null);
            if (choix === reponseAttendue) { bouton.classList.add('correct'); reponseCorrecte("Super coup d'œil ! 👁️✅", 5); } 
            else { bouton.classList.add('erreur'); document.querySelectorAll('.btn-opt').forEach(b => { if (b.textContent === reponseAttendue) b.classList.add('correct'); }); reponseIncorrecte(`Raté ! C'était un angle ${reponseAttendue}.`); }
        }

        // ==========================================
        // 3. LE GÉOPLAN
        // ==========================================
        let pointsGeoplan = []; let modeleCible = []; let pointSelectionne = null; const TAILLE_G = 40;

        function genererQuestionGeoplan() {
            document.getElementById('zone-actions').style.display = 'flex'; pointsGeoplan = []; modeleCible = [];
            if (niveauActuel === 1) {
                reponseAttendue = Math.floor(Math.random() * 9) + 4; 
                document.getElementById('question-texte').innerHTML = `Construis un polygone avec une <strong>Aire de ${reponseAttendue} carreaux</strong>.`;
                document.getElementById('consigne-supp').textContent = "Ferme ta forme puis étire ses sommets !";
            } else {
                document.getElementById('question-texte').innerHTML = `<strong>Reproduis la figure en bleu clair !</strong>`;
                let formes = [ [{x:2,y:5}, {x:5,y:2}, {x:8,y:5}, {x:8,y:8}, {x:2,y:8}], [{x:3,y:4}, {x:7,y:4}, {x:7,y:2}, {x:9,y:5}, {x:7,y:8}, {x:7,y:6}, {x:3,y:6}], [{x:5,y:2}, {x:6,y:5}, {x:9,y:5}, {x:7,y:7}, {x:8,y:9}, {x:5,y:8}, {x:2,y:9}, {x:3,y:7}, {x:1,y:5}, {x:4,y:5}] ];
                modeleCible = formes[Math.floor(Math.random() * formes.length)];
            }
            dessinerGeoplan();
            canvas.onmousedown = handleMouseDownGeoplan; canvas.onmousemove = handleMouseMoveGeoplan; canvas.onmouseup = handleMouseUpGeoplan; canvas.onmouseleave = handleMouseUpGeoplan;
        }

        function obtenirCoordsGeoplan(event) { const rect = canvas.getBoundingClientRect(); return { x: Math.round((event.clientX - rect.left) / TAILLE_G), y: Math.round((event.clientY - rect.top) / TAILLE_G) }; }

        function handleMouseDownGeoplan(event) {
            if (isProcessing) return; const coords = obtenirCoordsGeoplan(event);
            if (pointsGeoplan.length >= 3 && !estGeoFermee() && coords.x === pointsGeoplan[0].x && coords.y === pointsGeoplan[0].y) { pointsGeoplan.push({x: coords.x, y: coords.y}); dessinerGeoplan(); actualiserFBGeo(); return; }
            for (let i = 0; i < pointsGeoplan.length; i++) { if (pointsGeoplan[i].x === coords.x && pointsGeoplan[i].y === coords.y) { pointSelectionne = pointsGeoplan[i]; if (i === pointsGeoplan.length - 1 && estGeoFermee()) pointSelectionne = pointsGeoplan[0]; return; } }
            if (!estGeoFermee()) { let lastPt = pointsGeoplan[pointsGeoplan.length - 1]; if (!lastPt || lastPt.x !== coords.x || lastPt.y !== coords.y) pointsGeoplan.push({x: coords.x, y: coords.y}); }
            dessinerGeoplan(); actualiserFBGeo();
        }

        function handleMouseMoveGeoplan(event) {
            if (pointSelectionne) {
                const coords = obtenirCoordsGeoplan(event);
                if (coords.x > 0 && coords.x < canvas.width/TAILLE_G && coords.y > 0 && coords.y < canvas.height/TAILLE_G) {
                    pointSelectionne.x = coords.x; pointSelectionne.y = coords.y;
                    if (estGeoFermee() && pointSelectionne === pointsGeoplan[0]) { pointsGeoplan[pointsGeoplan.length - 1].x = coords.x; pointsGeoplan[pointsGeoplan.length - 1].y = coords.y; }
                    dessinerGeoplan(); actualiserFBGeo();
                }
            }
        }

        function handleMouseUpGeoplan() { pointSelectionne = null; }

        function dessinerGeoplan() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#bdc3c7";
            for (let x = TAILLE_G; x < canvas.width; x += TAILLE_G) for (let y = TAILLE_G; y < canvas.height; y += TAILLE_G) { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }
            if (modeleCible.length > 0) {
                ctx.beginPath(); ctx.moveTo(modeleCible[0].x * TAILLE_G, modeleCible[0].y * TAILLE_G); for (let i = 1; i < modeleCible.length; i++) ctx.lineTo(modeleCible[i].x * TAILLE_G, modeleCible[i].y * TAILLE_G); ctx.closePath();
                ctx.fillStyle = "rgba(52, 152, 219, 0.2)"; ctx.fill(); ctx.strokeStyle = "rgba(52, 152, 219, 0.5)"; ctx.lineWidth = 4; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }
            if (pointsGeoplan.length > 0) {
                ctx.beginPath(); ctx.moveTo(pointsGeoplan[0].x * TAILLE_G, pointsGeoplan[0].y * TAILLE_G); for (let i = 1; i < pointsGeoplan.length; i++) ctx.lineTo(pointsGeoplan[i].x * TAILLE_G, pointsGeoplan[i].y * TAILLE_G);
                if (estGeoFermee()) { ctx.closePath(); ctx.fillStyle = "rgba(142, 68, 173, 0.3)"; ctx.fill(); }
                ctx.strokeStyle = "#8e44ad"; ctx.lineWidth = 4; ctx.stroke(); ctx.fillStyle = "#e74c3c";
                pointsGeoplan.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x * TAILLE_G, pt.y * TAILLE_G, 6, 0, Math.PI * 2); ctx.fill(); });
            }
        }

        function estGeoFermee() { if (pointsGeoplan.length < 4) return false; return (pointsGeoplan[0].x === pointsGeoplan[pointsGeoplan.length - 1].x && pointsGeoplan[0].y === pointsGeoplan[pointsGeoplan.length - 1].y); }
        function effacerGeoplan() { pointsGeoplan = []; document.getElementById('feedback').textContent = ""; dessinerGeoplan(); }
        function calculerAireGeo(points) { let aire = 0; let n = points.length - 1; for (let i = 0; i < n; i++) { let j = (i + 1) % n; aire += (points[i].x * points[j].y) - (points[j].x * points[i].y); } return Math.abs(aire / 2); }
        function actualiserFBGeo() { if (niveauActuel === 1 && estGeoFermee()) { document.getElementById('feedback').textContent = `Aire : ${calculerAireGeo(pointsGeoplan)} carreaux`; document.getElementById('feedback').style.color = "#8e44ad"; } else document.getElementById('feedback').textContent = ""; }

        function validerGeoplan() {
            if (isProcessing) return;
            if (!estGeoFermee()) { document.getElementById('feedback').textContent = "Ferme ta forme !"; document.getElementById('feedback').style.color = "#e67e22"; return; }
            isProcessing = true;

            if (niveauActuel === 1) {
                let aireT = calculerAireGeo(pointsGeoplan);
                if (aireT === reponseAttendue) reponseCorrecte("Parfait ! ✨", 15); else reponseIncorrecte(`Faux. L'aire est de ${aireT}.`);
            } else {
                let formeOk = true;
                if (pointsGeoplan.length - 1 !== modeleCible.length) formeOk = false;
                else { for (let ptC of modeleCible) { if (!pointsGeoplan.find(p => p.x === ptC.x && p.y === ptC.y)) formeOk = false; } }
                if (formeOk) reponseCorrecte("Copie conforme ! ✨", 20); else reponseIncorrecte("Ce n'est pas le bon modèle !");
            }
        }

        // ==========================================
        // 4. MESURES (Classique)
        // ==========================================
        function genererQuestionMesure() {
            document.getElementById('zone-saisie').style.display = 'flex'; let typeF = Math.random() > 0.5 ? 'carre' : 'rectangle'; let l, h;
            if (niveauActuel === 1) { l = Math.floor(Math.random() * 8) + 3; h = typeF === 'carre' ? l : Math.floor(Math.random() * 5) + 2; if(l===h) typeF='carre'; document.getElementById('question-texte').innerHTML = `Calcule le <strong>Périmètre</strong> de ce ${typeF}.`; reponseAttendue = typeF === 'carre' ? l * 4 : (l + h) * 2; } 
            else { l = Math.floor(Math.random() * 10) + 5; h = typeF === 'carre' ? l : Math.floor(Math.random() * 8) + 3; if(l===h) typeF='carre'; document.getElementById('question-texte').innerHTML = `Calcule l'<strong>Aire</strong> de ce ${typeF}.`; reponseAttendue = l * h; }

            ctx.beginPath(); let dW = typeF === 'carre' ? 150 : 220; let dH = typeF === 'carre' ? 150 : 100; let sX = (canvas.width - dW) / 2; let sY = (canvas.height - dH) / 2;
            ctx.rect(sX, sY, dW, dH); ctx.fillStyle = "rgba(52, 152, 219, 0.2)"; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = "#2980b9"; ctx.stroke();
            ctx.fillStyle = "#2c3e50"; ctx.font = "bold 20px Nunito"; ctx.textAlign = "center"; ctx.fillText(`${l} cm`, canvas.width / 2, sY - 15); 
            if (typeF === 'rectangle') { ctx.textAlign = "left"; ctx.fillText(`${h} cm`, sX + dW + 15, canvas.height / 2 + 5); }
        }

        function verifierSaisie() {
            if (isProcessing) return; let saisie = parseInt(document.getElementById('input-mesure').value); if (isNaN(saisie)) return;
            isProcessing = true;
            if (saisie === reponseAttendue) reponseCorrecte("Excellent ! ✅", 5); else reponseIncorrecte(`Faux. C'était ${reponseAttendue}.`);
        }

        chargerProfilCloud();
    </script>
</body>
