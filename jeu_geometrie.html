<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Studio de Géométrie CM2 - L'Académie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #16a085 0%, #f4d03f 100%); 
            color: #2c3e50; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 800px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #16a085; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Menu Hub & Niveaux */
        .grid-niveaux { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; text-align: left;}
        .btn-niveau {
            background: #fff; border: 3px solid #bdc3c7; padding: 15px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: space-between;
        }
        .btn-niveau:hover { background: #f8f9fa; border-color: #16a085; transform: translateX(5px); }
        .btn-niveau:active { transform: translateY(2px); }

        .titre-section { background: #16a085; color: white; padding: 10px; border-radius: 10px; margin: 20px 0 10px 0; font-weight: 900;}
        .titre-section.angles { background: #e67e22; }
        .titre-section.geogebra { background: #8e44ad; }

        /* HUD Jeu */
        .hud-jeu { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; border: 2px solid #ecf0f1; }
        
        /* Zone de dessin (Canvas) */
        #canvas-container {
            background: #fdfdfd; border: 3px dashed #bdc3c7; border-radius: 15px; 
            margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center;
            width: 100%; max-width: 400px; height: 400px; position: relative;
        }
        canvas { max-width: 100%; max-height: 100%; cursor: crosshair;}

        #question-texte { font-size: 1.4rem; color: #34495e; font-weight: 900; margin-bottom: 10px; }
        #consigne-supp { font-size: 1rem; color: #7f8c8d; font-weight: bold; margin-bottom: 20px; }

        /* Options de réponse (Exercices classiques) */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn-opt {
            background: white; border: 3px solid #3498db; padding: 15px; border-radius: 15px;
            font-size: 1.3rem; font-weight: bold; color: #2980b9; cursor: pointer; transition: 0.1s;
        }
        .btn-opt:active { transform: translateY(4px); }
        .btn-opt.correct { background: #2ecc71; color: white; border-color: #27ae60; }
        .btn-opt.erreur { background: #e74c3c; color: white; border-color: #c0392b; }

        /* Saisie manuelle */
        #zone-saisie { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; }
        #input-mesure { font-size: 1.5rem; width: 120px; padding: 10px; text-align: center; border: 3px solid #3498db; border-radius: 10px; font-weight: bold; }
        .btn-valider { background: #3498db; color: white; font-weight: bold; font-size: 1.2rem; padding: 10px 25px; border: none; border-radius: 10px; cursor: pointer; }

        /* Boutons d'action Géoplan */
        #zone-geoplan-actions { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn-action { background: #e67e22; color: white; font-weight: bold; font-size: 1.1rem; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; }

        .btn-nav { background: #7f8c8d; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s;}
        .btn-nav:hover { background: #95a5a6; }
        
        #feedback { font-size: 1.3rem; font-weight: 900; height: 35px; margin-bottom: 15px; }

        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp-jeu">...</span> ⭐</div>

        <!-- ECRAN D'ACCUEIL -->
        <div id="ecran-hub" class="ecran actif">
            <h1>Studio de Géométrie 📐</h1>
            <p class="sous-titre">Entraînement progressif pour le CM2</p>
            
            <div class="titre-section geogebra">L'Atelier Interactif (GeoGebra)</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('geoplan', 1)" style="border-color: #8e44ad;">
                    <div><strong>Le Géoplan</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Construis tes propres polygones !</span></div>
                    <span>▶️</span>
                </button>
            </div>

            <div class="titre-section">Périmètres et Aires (Classique)</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('mesures', 1)">
                    <div><strong>Niveau 1 : Le Périmètre</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Calculer le contour (Révisions)</span></div>
                    <span>▶️</span>
                </button>
                <button class="btn-niveau" onclick="lancerJeu('mesures', 2)">
                    <div><strong>Niveau 2 : L'Aire</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Calculer la surface intérieure</span></div>
                    <span>▶️</span>
                </button>
            </div>

            <div class="titre-section angles">Les Angles</div>
            <div class="grid-niveaux">
                <button class="btn-niveau" onclick="lancerJeu('angles', 1)">
                    <div><strong>Niveau 1 : Les bases</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Aigu, Obtus ou Droit ?</span></div>
                    <span>▶️</span>
                </button>
                <button class="btn-niveau" onclick="lancerJeu('angles', 2)">
                    <div><strong>Niveau 2 : L'œil de lynx</strong><br><span style="font-size:0.9rem; color:#7f8c8d;">Angles tournés dans tous les sens</span></div>
                    <span>▶️</span>
                </button>
            </div>

            <button class="btn-nav" style="margin-top: 15px;" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div class="hud-jeu">
                <span id="ui-vies" style="letter-spacing: 3px; color:#e74c3c;">❤️❤️❤️</span>
                <span id="ui-titre-niveau" style="color: #2980b9;">Niveau...</span>
                <span id="ui-progression">1 / 5</span>
            </div>
            
            <div id="question-texte">Question...</div>
            <div id="consigne-supp"></div>

            <div id="canvas-container">
                <canvas id="canvas-geo" width="400" height="400"></canvas>
            </div>

            <div id="zone-boutons" class="options-grid"></div>
            
            <div id="zone-saisie">
                <input type="number" id="input-mesure" autocomplete="off" placeholder="Ex: 12">
                <button class="btn-valider" onclick="verifierSaisie()">Valider</button>
            </div>

            <div id="zone-geoplan-actions">
                <button class="btn-action" style="background:#e74c3c;" onclick="effacerGeoplan()">Effacer</button>
                <button class="btn-action" style="background:#2ecc71;" onclick="validerGeoplan()">Vérifier ma forme</button>
            </div>

            <div id="feedback"></div>

            <button class="btn-nav" onclick="retourAccueil()">⬅️ Quitter l'atelier</button>
        </div>

    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/mathsV8.json`;

        let profil = { xp: 0 };
        let modeActuel = "";
        let niveauActuel = 1;
        let indexQuestion = 0;
        let vies = 3;
        const totalQuestions = 5;
        let reponseAttendue = null;
        let isProcessing = false;

        const canvas = document.getElementById('canvas-geo');
        const ctx = canvas.getContext('2d');

        // Variables spécifiques au Géoplan
        let pointsGeoplan = [];
        const TAILLE_GRILLE = 40; // Espacement entre les points en pixels

        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            document.getElementById('ui-xp-jeu').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne;
            document.getElementById('ui-xp-jeu').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function changerEcran(id) { 
            document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); 
            document.getElementById(id).classList.add('actif'); 
        }
        function retourAccueil() { changerEcran('ecran-hub'); }

        function lancerJeu(mode, niveau) {
            modeActuel = mode;
            niveauActuel = niveau;
            indexQuestion = 0;
            vies = 3;
            isProcessing = false;

            let titre = "Angles";
            if (mode === 'mesures') titre = "Mesures";
            if (mode === 'geoplan') titre = "Géoplan Actif";

            document.getElementById('ui-titre-niveau').textContent = `${titre} - Niv ${niveau}`;
            document.getElementById('ui-vies').textContent = "❤️❤️❤️";
            
            changerEcran('ecran-jeu');
            poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) {
                alert("Plus de vies ! Révise encore un peu et réessaie.");
                return retourAccueil();
            }
            if (indexQuestion >= totalQuestions) {
                alert("Série parfaite ! Tu gagnes un super bonus d'XP ! 🎉");
                sauverProfilCloud(niveauActuel * 20);
                return retourAccueil();
            }

            isProcessing = false;
            indexQuestion++;
            document.getElementById('ui-progression').textContent = `${indexQuestion} / ${totalQuestions}`;
            document.getElementById('feedback').textContent = "";
            document.getElementById('input-mesure').value = "";
            document.getElementById('consigne-supp').textContent = "";
            
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            // Cacher toutes les interfaces spécifiques
            document.getElementById('zone-boutons').style.display = 'none';
            document.getElementById('zone-saisie').style.display = 'none';
            document.getElementById('zone-geoplan-actions').style.display = 'none';

            // Routage vers le bon mode
            if (modeActuel === 'mesures') genererQuestionMesure();
            else if (modeActuel === 'angles') genererQuestionAngle();
            else if (modeActuel === 'geoplan') genererQuestionGeoplan();
        }

        // ==========================================
        // LE GÉOPLAN INTERACTIF (Style GeoGebra)
        // ==========================================
        function genererQuestionGeoplan() {
            document.getElementById('zone-geoplan-actions').style.display = 'flex';
            
            // Génération d'une mission d'aire aléatoire entre 4 et 12 unités
            reponseAttendue = Math.floor(Math.random() * 9) + 4; 
            
            document.getElementById('question-texte').innerHTML = `Construis un polygone avec une <strong>Aire de ${reponseAttendue} carreaux</strong>.`;
            document.getElementById('consigne-supp').textContent = "Clique sur la grille pour placer tes points. Relie le dernier point au premier pour fermer ta forme !";

            pointsGeoplan = [];
            dessinerGeoplan();

            // Activer l'écouteur de clic pour ce mode
            canvas.onclick = handleClickGeoplan;
        }

        function dessinerGeoplan() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Dessiner la grille de points
            ctx.fillStyle = "#bdc3c7";
            for (let x = TAILLE_GRILLE; x < canvas.width; x += TAILLE_GRILLE) {
                for (let y = TAILLE_GRILLE; y < canvas.height; y += TAILLE_GRILLE) {
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 2. Dessiner les lignes du polygone
            if (pointsGeoplan.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pointsGeoplan[0].x * TAILLE_GRILLE, pointsGeoplan[0].y * TAILLE_GRILLE);
                for (let i = 1; i < pointsGeoplan.length; i++) {
                    ctx.lineTo(pointsGeoplan[i].x * TAILLE_GRILLE, pointsGeoplan[i].y * TAILLE_GRILLE);
                }
                
                // Si la forme est fermée, on la remplit
                if (estFormeFermee()) {
                    ctx.closePath();
                    ctx.fillStyle = "rgba(142, 68, 173, 0.3)";
                    ctx.fill();
                }
                
                ctx.strokeStyle = "#8e44ad";
                ctx.lineWidth = 4;
                ctx.stroke();

                // 3. Dessiner les sommets (Points placés)
                ctx.fillStyle = "#e74c3c";
                pointsGeoplan.forEach(pt => {
                    ctx.beginPath();
                    ctx.arc(pt.x * TAILLE_GRILLE, pt.y * TAILLE_GRILLE, 6, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        function handleClickGeoplan(event) {
            if (isProcessing) return;

            // Calculer les coordonnées du clic relatives au canvas
            const rect = canvas.getBoundingClientRect();
            const xClick = event.clientX - rect.left;
            const yClick = event.clientY - rect.top;

            // Arrondir au point de grille le plus proche
            const gridX = Math.round(xClick / TAILLE_GRILLE);
            const gridY = Math.round(yClick / TAILLE_GRILLE);

            // Empêcher de cliquer hors de la grille utile
            if (gridX <= 0 || gridX >= canvas.width/TAILLE_GRILLE || gridY <= 0 || gridY >= canvas.height/TAILLE_GRILLE) return;

            // Vérifier si on clique sur le point de départ pour fermer la forme
            if (pointsGeoplan.length > 2 && gridX === pointsGeoplan[0].x && gridY === pointsGeoplan[0].y) {
                // On clone le premier point à la fin pour indiquer que c'est fermé
                pointsGeoplan.push({x: gridX, y: gridY});
            } 
            else if (!estFormeFermee()) {
                // Éviter les points en double à la suite
                let lastPt = pointsGeoplan[pointsGeoplan.length - 1];
                if (!lastPt || lastPt.x !== gridX || lastPt.y !== gridY) {
                    pointsGeoplan.push({x: gridX, y: gridY});
                }
            }

            dessinerGeoplan();
            
            // Calcul et affichage en temps réel de l'aire (feedback visuel immédiat)
            if (estFormeFermee()) {
                let aireActuelle = calculerAire(pointsGeoplan);
                document.getElementById('feedback').textContent = `Aire actuelle : ${aireActuelle} carreaux`;
                document.getElementById('feedback').style.color = "#8e44ad";
            } else {
                document.getElementById('feedback').textContent = "";
            }
        }

        function estFormeFermee() {
            if (pointsGeoplan.length < 4) return false;
            let premier = pointsGeoplan[0];
            let dernier = pointsGeoplan[pointsGeoplan.length - 1];
            return (premier.x === dernier.x && premier.y === dernier.y);
        }

        function effacerGeoplan() {
            pointsGeoplan = [];
            document.getElementById('feedback').textContent = "";
            dessinerGeoplan();
        }

        // L'algorithme mathématique du Lacet (Shoelace Formula) pour calculer l'aire de n'importe quel polygone !
        function calculerAire(points) {
            let aire = 0;
            // On ignore le dernier point car il est identique au premier (forme fermée)
            let n = points.length - 1; 
            for (let i = 0; i < n; i++) {
                let j = (i + 1) % n;
                aire += (points[i].x * points[j].y) - (points[j].x * points[i].y);
            }
            return Math.abs(aire / 2);
        }

        function validerGeoplan() {
            if (isProcessing) return;
            if (!estFormeFermee()) {
                document.getElementById('feedback').textContent = "Tu dois d'abord fermer ta forme (relie le dernier point au premier) !";
                document.getElementById('feedback').style.color = "#e67e22";
                return;
            }

            isProcessing = true;
            canvas.onclick = null; // Désactive les clics

            let aireTrouvee = calculerAire(pointsGeoplan);
            const fb = document.getElementById('feedback');

            if (aireTrouvee === reponseAttendue) {
                fb.textContent = "Architecte de génie ! L'aire est parfaite ! ✨"; 
                fb.style.color = "#27ae60";
                sauverProfilCloud(15);
                setTimeout(poserQuestion, 2000);
            } else {
                vies--;
                document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
                fb.textContent = `Ta forme a une aire de ${aireTrouvee}. Il fallait ${reponseAttendue}. Efface et réessaie !`; 
                fb.style.color = "#e74c3c";
                
                setTimeout(() => {
                    isProcessing = false;
                    effacerGeoplan();
                    canvas.onclick = handleClickGeoplan; // Réactive les clics
                }, 3000);
            }
        }

        // ==========================================
        // LES AUTRES MODES (Conservés à l'identique)
        // ==========================================

        function genererQuestionMesure() {
            canvas.onclick = null;
            document.getElementById('zone-saisie').style.display = 'flex';
            
            let typeForme = Math.random() > 0.5 ? 'carre' : 'rectangle';
            let largeur, hauteur;

            if (niveauActuel === 1) {
                largeur = Math.floor(Math.random() * 8) + 3; 
                hauteur = typeForme === 'carre' ? largeur : Math.floor(Math.random() * 5) + 2;
                if (largeur === hauteur) typeForme = 'carre';
                
                document.getElementById('question-texte').innerHTML = `Calcule le <strong>Périmètre</strong> de ce ${typeForme}.`;
                reponseAttendue = typeForme === 'carre' ? largeur * 4 : (largeur + hauteur) * 2;
            } else {
                largeur = Math.floor(Math.random() * 10) + 5; 
                hauteur = typeForme === 'carre' ? largeur : Math.floor(Math.random() * 8) + 3;
                if (largeur === hauteur) typeForme = 'carre';
                
                document.getElementById('question-texte').innerHTML = `Calcule l'<strong>Aire</strong> de ce ${typeForme} (L x l).`;
                reponseAttendue = largeur * hauteur;
            }

            ctx.beginPath();
            let drawW = typeForme === 'carre' ? 150 : 220;
            let drawH = typeForme === 'carre' ? 150 : 100;
            let startX = (canvas.width - drawW) / 2;
            let startY = (canvas.height - drawH) / 2;

            ctx.rect(startX, startY, drawW, drawH);
            ctx.fillStyle = "rgba(52, 152, 219, 0.2)";
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#2980b9";
            ctx.stroke();

            ctx.fillStyle = "#2c3e50";
            ctx.font = "bold 20px Nunito";
            ctx.textAlign = "center";
            ctx.fillText(`${largeur} cm`, canvas.width / 2, startY - 15); 
            
            if (typeForme === 'rectangle') {
                ctx.textAlign = "left";
                ctx.fillText(`${hauteur} cm`, startX + drawW + 15, canvas.height / 2 + 5); 
            }
        }

        function verifierSaisie() {
            if (isProcessing) return;
            let saisie = parseInt(document.getElementById('input-mesure').value);
            if (isNaN(saisie)) return;
            isProcessing = true;

            const fb = document.getElementById('feedback');
            if (saisie === reponseAttendue) {
                fb.textContent = "Excellent ! ✅"; fb.style.color = "#27ae60";
                sauverProfilCloud(5);
                setTimeout(poserQuestion, 1000);
            } else {
                vies--;
                document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
                fb.textContent = `Faux. La bonne réponse était ${reponseAttendue}.`; fb.style.color = "#e74c3c";
                setTimeout(poserQuestion, 2500);
            }
        }

        function genererQuestionAngle() {
            canvas.onclick = null;
            document.getElementById('zone-boutons').style.display = 'grid';
            document.getElementById('question-texte').textContent = "Quel est le type de cet angle ?";

            let types = ['Aigu', 'Droit', 'Obtus'];
            let typeChoisi = types[Math.floor(Math.random() * types.length)];
            reponseAttendue = typeChoisi;

            let angleDeg;
            if (typeChoisi === 'Droit') angleDeg = 90;
            else if (typeChoisi === 'Aigu') angleDeg = Math.floor(Math.random() * 45) + 30;
            else angleDeg = Math.floor(Math.random() * 45) + 110; 

            let rotationBase = niveauActuel === 1 ? 0 : Math.floor(Math.random() * 360);

            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let longueur = 100;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((rotationBase * Math.PI) / 180);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(longueur, 0);
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#34495e";
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(longueur * Math.cos((-angleDeg * Math.PI) / 180), longueur * Math.sin((-angleDeg * Math.PI) / 180));
            ctx.stroke();

            ctx.beginPath();
            if (typeChoisi === 'Droit') {
                ctx.rect(0, -20, 20, 20); 
            } else {
                ctx.arc(0, 0, 30, (-angleDeg * Math.PI) / 180, 0);
            }
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();

            const zoneBtns = document.getElementById('zone-boutons');
            zoneBtns.innerHTML = "";
            types.forEach(t => {
                let b = document.createElement('button');
                b.className = 'btn-opt';
                b.textContent = t;
                b.onclick = () => verifierAngle(b, t);
                zoneBtns.appendChild(b);
            });
        }

        function verifierAngle(bouton, choix) {
            if (isProcessing) return;
            isProcessing = true;
            document.querySelectorAll('.btn-opt').forEach(b => b.onclick = null);

            const fb = document.getElementById('feedback');
            if (choix === reponseAttendue) {
                bouton.classList.add('correct');
                fb.textContent = "Super coup d'œil ! 👁️✅"; fb.style.color = "#27ae60";
                sauverProfilCloud(5);
                setTimeout(poserQuestion, 1000);
            } else {
                bouton.classList.add('erreur');
                vies--;
                document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
                fb.textContent = `Raté ! C'était un angle ${reponseAttendue}.`; fb.style.color = "#e74c3c";
                
                document.querySelectorAll('.btn-opt').forEach(b => {
                    if (b.textContent === reponseAttendue) b.classList.add('correct');
                });
                
                setTimeout(poserQuestion, 2500);
            }
        }

        chargerProfilCloud();
    </script>
</body>
</html>
