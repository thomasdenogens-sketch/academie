<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Studio de Géométrie CM2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #16a085 0%, #2ecc71 100%); 
            color: #333; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-width: 800px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #27ae60; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 20px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* La zone de dessin */
        #canvas-container {
            display: flex; justify-content: center; margin-bottom: 20px;
            border: 4px solid #bdc3c7; border-radius: 10px; background: #fdfdfd;
            overflow: hidden;
        }
        canvas { background-color: transparent; }

        /* Le panneau de contrôle */
        #controles {
            background: #f8f9fa; padding: 20px; border-radius: 15px;
            border: 2px dashed #bdc3c7; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .slider-group { display: flex; align-items: center; justify-content: space-between; gap: 15px; font-weight: bold; font-size: 1.2rem; color: #2c3e50;}
        input[type="range"] { flex: 1; cursor: pointer; height: 8px; border-radius: 5px; outline: none; }
        .valeur-input { background: #3498db; color: white; padding: 5px 15px; border-radius: 10px; min-width: 60px; }

        /* Affichage des calculs en temps réel */
        #calculs-live {
            display: flex; justify-content: space-around; background: #e0f7fa;
            padding: 15px; border-radius: 15px; border: 2px solid #00bcd4; margin-bottom: 20px;
        }
        .calc-box { font-size: 1.3rem; font-weight: 900; color: #0097a7; }

        /* Zone de Mission */
        #mission-box { background: #fff3cd; padding: 15px; border-radius: 15px; border: 2px solid #f39c12; margin-bottom: 20px;}
        #mission-texte { font-size: 1.4rem; font-weight: 900; color: #d35400; }

        /* Boutons */
        .btn { font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: bold; padding: 15px 30px; border: none; border-radius: 12px; cursor: pointer; color: white; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-primaire { background: #27ae60; box-shadow: 0 4px #219a52; }
        .btn-secondaire { background: #95a5a6; box-shadow: 0 4px #7f8c8d; color: white; margin-top: 10px; font-size: 1rem; padding: 10px 20px;}
        
        #feedback { font-size: 1.4rem; font-weight: 900; height: 35px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp-jeu">...</span> ⭐</div>

        <h1>Studio de Géométrie 📐</h1>
        <p class="sous-titre">Périmètres, Aires et Formes</p>

        <div id="mission-box">
            <div style="font-size: 1rem; color:#d35400; font-weight:bold;">🎯 Mission actuelle :</div>
            <div id="mission-texte">Chargement du défi...</div>
        </div>

        <!-- NOTRE TOILE DE DESSIN -->
        <div id="canvas-container">
            <canvas id="geoCanvas" width="400" height="300"></canvas>
        </div>

        <div id="calculs-live">
            <div class="calc-box">Périmètre = <span id="val-perimetre">0</span></div>
            <div class="calc-box">Aire = <span id="val-aire">0</span></div>
        </div>

        <div id="controles">
            <div class="slider-group">
                <span>Largeur (L)</span>
                <input type="range" id="slider-largeur" min="1" max="15" value="5">
                <span class="valeur-input" id="lbl-largeur">5</span>
            </div>
            <div class="slider-group">
                <span>Hauteur (l)</span>
                <input type="range" id="slider-hauteur" min="1" max="10" value="3">
                <span class="valeur-input" id="lbl-hauteur">3</span>
            </div>
        </div>

        <div id="feedback"></div>
        <button class="btn btn-primaire" id="btn-valider" onclick="verifierMission()">Vérifier ma forme !</button>
        <br>
        <button class="btn btn-secondaire" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
    </div>

    <script>
        // 1. CONFIGURATION DU CLOUD (Base de données)
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/geometrieV1.json`;

        let profil = { xp: 0 };
        let missionActuelle = null;
        let tailleCarreau = 20; // 1 unité = 20 pixels sur l'écran

        // Base de données des missions générées aléatoirement
        const typesMissions = [
            { type: "aire", generateur: () => { let l=Math.floor(Math.random()*8)+2, h=Math.floor(Math.random()*5)+2; return {cible: l*h, texte: `Crée un rectangle avec une AIRE de ${l*h}`}; } },
            { type: "perimetre", generateur: () => { let l=Math.floor(Math.random()*8)+2, h=Math.floor(Math.random()*5)+2; return {cible: (l+h)*2, texte: `Crée un rectangle avec un PÉRIMÈTRE de ${(l+h)*2}`}; } },
            { type: "carre", generateur: () => { let c=Math.floor(Math.random()*5)+3; return {cible: c, texte: `Crée un CARRÉ de côté ${c}`}; } }
        ];

        // --- ÉLÉMENTS DU DOM (HTML) ---
        const canvas = document.getElementById('geoCanvas');
        const ctx = canvas.getContext('2d'); // Le "pinceau" pour dessiner en JavaScript
        const sliderLargeur = document.getElementById('slider-largeur');
        const sliderHauteur = document.getElementById('slider-hauteur');

        // --- SAUVEGARDE CLOUD ---
        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            document.getElementById('ui-xp-jeu').textContent = profil.xp;
        }

        async function sauverProfilCloud() {
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        // --- MOTEUR DE DESSIN ---
        // Cette fonction dessine le quadrillage du fond
        function dessinerGrille() {
            ctx.strokeStyle = "#ecf0f1"; // Couleur gris clair
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += tailleCarreau) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += tailleCarreau) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        // Cette fonction s'exécute à chaque fois qu'on bouge un curseur
        function actualiserDessin() {
            // 1. On efface toute la toile
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 2. On redessine le fond
            dessinerGrille();

            // 3. On lit la valeur des curseurs
            let largeurUnite = parseInt(sliderLargeur.value);
            let hauteurUnite = parseInt(sliderHauteur.value);

            // 4. On calcule la taille en pixels
            let largeurPixel = largeurUnite * tailleCarreau;
            let hauteurPixel = hauteurUnite * tailleCarreau;

            // 5. On dessine le rectangle au centre de la toile
            let xPosition = (canvas.width - largeurPixel) / 2;
            let yPosition = (canvas.height - hauteurPixel) / 2;

            ctx.fillStyle = "rgba(52, 152, 219, 0.5)"; // Bleu transparent
            ctx.strokeStyle = "#2980b9"; // Bordure bleue foncée
            ctx.lineWidth = 4;
            
            ctx.fillRect(xPosition, yPosition, largeurPixel, hauteurPixel);
            ctx.strokeRect(xPosition, yPosition, largeurPixel, hauteurPixel);

            // 6. On met à jour l'interface avec les maths
            document.getElementById('lbl-largeur').textContent = largeurUnite;
            document.getElementById('lbl-hauteur').textContent = hauteurUnite;
            
            let perimetre = (largeurUnite + hauteurUnite) * 2;
            let aire = largeurUnite * hauteurUnite;
            
            document.getElementById('val-perimetre').textContent = perimetre;
            document.getElementById('val-aire').textContent = aire;
        }

        // --- LOGIQUE DE JEU ---
        function genererMission() {
            // On tire une mission au hasard
            let typeRandom = typesMissions[Math.floor(Math.random() * typesMissions.length)];
            missionActuelle = typeRandom.generateur();
            missionActuelle.type = typeRandom.type;
            
            document.getElementById('mission-texte').textContent = missionActuelle.texte;
            document.getElementById('feedback').textContent = "";
            document.getElementById('btn-valider').style.display = "inline-block";
        }

        function verifierMission() {
            let L = parseInt(sliderLargeur.value);
            let l = parseInt(sliderHauteur.value);
            let estCorrect = false;

            if (missionActuelle.type === "aire") {
                if ((L * l) === missionActuelle.cible) estCorrect = true;
            } 
            else if (missionActuelle.type === "perimetre") {
                if (((L + l) * 2) === missionActuelle.cible) estCorrect = true;
            }
            else if (missionActuelle.type === "carre") {
                // Pour un carré, L et l doivent être égaux ET correspondre à la cible
                if (L === l && L === missionActuelle.cible) estCorrect = true;
            }

            const feedback = document.getElementById('feedback');
            
            if (estCorrect) {
                feedback.textContent = "C'est exact ! Superbe construction ! ✨";
                feedback.style.color = "#27ae60";
                
                profil.xp += 15;
                document.getElementById('ui-xp-jeu').textContent = profil.xp;
                sauverProfilCloud();

                document.getElementById('btn-valider').style.display = "none";
                setTimeout(genererMission, 2000);
            } else {
                feedback.textContent = "Ce n'est pas tout à fait ça. Regarde tes calculs !";
                feedback.style.color = "#e74c3c";
            }
        }

        // --- INITIALISATION ---
        // On connecte les sliders à notre fonction de dessin
        sliderLargeur.addEventListener('input', actualiserDessin);
        sliderHauteur.addEventListener('input', actualiserDessin);

        // On lance le jeu
        chargerProfilCloud();
        genererMission();
        actualiserDessin(); // On dessine une première fois au chargement
    </script>
</body>
</html>
