<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Maths Progression - Lola</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #333; text-align: center; padding: 20px; }
        #conteneur-appli { width: 100%; max-width: 650px; background-color: #ffffff; padding: 30px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative; }
        .ecran { display: none; animation: fadeIn 0.4s ease-out; }
        .ecran.actif { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-size: 2.2rem; color: #ff6b6b; margin-bottom: 5px; font-weight: 900;}
        .subtitle { font-size: 1.1rem; color: #e67e22; margin-bottom: 25px; font-weight: bold;}
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Nouveaux styles pour les niveaux progressifs */
        .niveau-section { text-align: left; margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 15px; border: 2px solid #ecf0f1; }
        .niveau-titre { font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .btn-progression { background: white; border: 3px solid #bdc3c7; padding: 12px 15px; border-radius: 12px; font-size: 1rem; font-weight: bold; color: #34495e; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 #bdc3c7; width: 100%; margin-bottom: 10px; text-align: left;}
        .btn-progression:active { transform: translateY(4px); box-shadow: none; }
        .btn-progression.niv1 { border-color: #4ecdc4; box-shadow: 0 4px 0 #16a085; }
        .btn-progression.niv2 { border-color: #3498db; box-shadow: 0 4px 0 #2980b9; }

        /* Zone de jeu */
        #infos-jeu { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; border: 2px solid #ecf0f1; }
        #question { font-size: 4rem; font-weight: 900; margin: 25px 0; color: #2c3e50; min-height: 80px; display: flex; justify-content: center; align-items: center;}
        #zone-saisie { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        #reponse { font-size: 3rem; width: 140px; padding: 10px; text-align: center; border: 4px solid #f39c12; border-radius: 15px; font-weight: bold; outline: none; color: #d35400; font-family: 'Nunito', sans-serif;}
        #btn-valider { padding: 15px 30px; font-size: 1.5rem; font-weight: 900; background: #27ae60; box-shadow: 0 5px 0 #2ecc71; color: white; border:none; border-radius: 15px; cursor:pointer; transition: 0.1s;}
        #btn-valider:active { transform: translateY(5px); box-shadow: none; }
        #feedback { height: 40px; font-size: 1.5rem; margin-top: 20px; font-weight: 900; }
        
        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="conteneur-appli">
        <div class="xp-badge" id="ui-xp">XP: ... ⭐</div>

        <!-- MENU DE SÉLECTION PROGRESSIF -->
        <div id="ecran-selection" class="ecran actif">
            <h1>L'Aventure des Nombres 🦄</h1>
            <p class="subtitle">Progression Douce : du CP au CE1</p>
            
            <div class="niveau-section">
                <div class="niveau-titre">🟢 Étape 1 : Révisions de fin de CP</div>
                <button onclick="lancerJeu('cp_add10')" class="btn-progression niv1">➕ Additions jusqu'à 10 (ex: 4 + 3)</button>
                <button onclick="lancerJeu('cp_add20')" class="btn-progression niv1">➕ Additions jusqu'à 20 (ex: 12 + 5)</button>
                <button onclick="lancerJeu('cp_sous10')" class="btn-progression niv1">➖ Petites Soustractions (ex: 8 - 2)</button>
            </div>

            <div class="niveau-section">
                <div class="niveau-titre">🔵 Étape 2 : L'entrée en CE1</div>
                <button onclick="lancerJeu('ce1_addDizaines')" class="btn-progression niv2">➕ Dizaines entières (ex: 20 + 30)</button>
                <button onclick="lancerJeu('ce1_addCinquante')" class="btn-progression niv2">➕ Nombres jusqu'à 50 (ex: 24 + 12)</button>
                <button onclick="lancerJeu('ce1_doubles')" class="btn-progression niv2">⚖️ Les petits doubles (ex: Double de 4)</button>
            </div>
            
            <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div id="infos-jeu">
                <span id="infos-vies" style="letter-spacing: 5px;">❤️❤️❤️</span>
                <span id="infos-progression" style="color: #7f8c8d;">1 / 10</span>
            </div>
            
            <div id="question">...</div>
            <div id="zone-saisie">
                <input type="number" id="reponse" autocomplete="off" inputmode="numeric">
                <button id="btn-valider" onclick="verifierReponse()">OK</button>
            </div>
            <div id="feedback"></div>
            
            <button class="btn-nav" onclick="montrerEcran('ecran-selection')">⬅️ Changer de niveau</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/lola/mathsLola.json`;

        let profil = { xp: 0 };
        let vies = 3; let indexQuestion = 0; let nbQuestions = 10;
        let modeActuel = ''; let reponseAttendue = 0; let isProcessing = false;
        const E = (id) => document.getElementById(id);

        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            E('ui-xp').textContent = `XP: ${profil.xp} ⭐`;
        }

        async function sauverProfilCloud() {
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
            E('ui-xp').textContent = `XP: ${profil.xp} ⭐`;
        }

        function montrerEcran(id) { document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); E(id).classList.add('actif'); }

        function lancerJeu(mode) {
            modeActuel = mode; vies = 3; indexQuestion = 1; isProcessing = false;
            E('infos-vies').textContent = "❤️❤️❤️"; 
            montrerEcran('ecran-jeu'); poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0 || indexQuestion > nbQuestions) {
                alert(vies > 0 ? "Superbe ! Fin de la série." : "Plus de vies, on réessaie !");
                profil.xp += (vies * 5); sauverProfilCloud();
                return montrerEcran('ecran-selection');
            }
            isProcessing = false;
            E('infos-progression').textContent = `${indexQuestion} / ${nbQuestions}`;
            let n1, n2, txt;

            // --- ALGORITHME DE DIFFICULTÉ PROGRESSIVE ---
            if (modeActuel === 'cp_add10') {
                n1 = Math.floor(Math.random() * 8) + 1; n2 = Math.floor(Math.random() * (10 - n1)) + 1;
                reponseAttendue = n1 + n2; txt = `${n1} + ${n2} =`;
            } 
            else if (modeActuel === 'cp_add20') {
                n1 = Math.floor(Math.random() * 10) + 5; n2 = Math.floor(Math.random() * 8) + 1;
                reponseAttendue = n1 + n2; txt = `${n1} + ${n2} =`;
            }
            else if (modeActuel === 'cp_sous10') {
                n1 = Math.floor(Math.random() * 6) + 4; // de 4 à 10
                n2 = Math.floor(Math.random() * (n1 - 1)) + 1; // plus petit que n1
                reponseAttendue = n1 - n2; txt = `${n1} - ${n2} =`;
            }
            else if (modeActuel === 'ce1_addDizaines') {
                n1 = (Math.floor(Math.random() * 4) + 1) * 10; // 10, 20, 30, 40
                n2 = (Math.floor(Math.random() * 4) + 1) * 10;
                reponseAttendue = n1 + n2; txt = `${n1} + ${n2} =`;
            }
            else if (modeActuel === 'ce1_addCinquante') {
                n1 = Math.floor(Math.random() * 20) + 10; // 10 à 30
                n2 = Math.floor(Math.random() * 10) + 5;  // 5 à 15 (sans retenue complexe pour l'instant)
                reponseAttendue = n1 + n2; txt = `${n1} + ${n2} =`;
            }
            else if (modeActuel === 'ce1_doubles') {
                let base = Math.floor(Math.random() * 10) + 1;
                reponseAttendue = base * 2; txt = `Double de ${base} =`;
            }
            
            E('question').textContent = txt; 
            E('reponse').value = ''; E('reponse').disabled = false; 
            E('btn-valider').style.display = 'inline-block'; 
            E('reponse').focus(); E('feedback').textContent = '';
        }

        function verifierReponse() {
            if (isProcessing) return;
            let valeur = E('reponse').value; if (valeur.trim() === '') return;
            isProcessing = true;
            E('reponse').disabled = true; E('btn-valider').style.display = 'none';
            
            if (parseInt(valeur) === reponseAttendue) { 
                E('feedback').textContent = "Bravo Lola ! ✨"; E('feedback').style.color = "#27ae60"; 
                profil.xp += 2; sauverProfilCloud();
                indexQuestion++; setTimeout(poserQuestion, 1000); 
            } else { 
                vies--; E('infos-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3 - vies);
                E('feedback').textContent = `Presque ! C'était ${reponseAttendue}`; E('feedback').style.color = "#c0392b"; 
                setTimeout(() => { indexQuestion++; poserQuestion(); }, 2000);
            }
        }

        E('reponse').addEventListener("keyup", (e) => { if (e.key === "Enter" && !E('reponse').disabled) verifierReponse(); });
        chargerProfilCloud();
    </script>
</body>
</html>
