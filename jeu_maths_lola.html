<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>L'Aventure des Nombres - L'Académie de Lola</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%); 
            color: #2c3e50; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 650px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #e74c3c; font-weight: 900; font-size: 2.2rem; margin-bottom: 5px; }
        .sous-titre { color: #e67e22; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: -15px; right: 20px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 10px 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-size: 1.1rem;}

        /* Menu de la capture d'écran */
        .etape-container { border: 2px solid #ecf0f1; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .etape-titre { font-size: 1.2rem; font-weight: 900; color: #2c3e50; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; }
        .dot-vert { background: #2ecc71; } .dot-bleu { background: #3498db; } .dot-violet { background: #9b59b6; } .dot-orange { background: #e67e22; }

        .btn-mission { 
            background: white; border: 2px solid #1abc9c; padding: 12px 15px; border-radius: 10px; 
            font-size: 1rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s; 
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px; width: 100%; text-align: left;
        }
        .btn-mission:hover { background: #e8f8f5; transform: translateX(5px); }
        .etape-2 .btn-mission { border-color: #3498db; } .etape-2 .btn-mission:hover { background: #ebf5fb; }
        .etape-3 .btn-mission { border-color: #9b59b6; } .etape-3 .btn-mission:hover { background: #f4ecf7; }
        .etape-4 .btn-mission { border-color: #e67e22; } .etape-4 .btn-mission:hover { background: #fdf2e9; }

        .btn-nav { background: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-top: 10px;}
        .btn-nav:hover { background: #7f8c8d; }

        /* HUD du jeu */
        .hud { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 2px solid #ecf0f1;}
        .progression-container { width: 100%; background: #ecf0f1; height: 10px; border-radius: 10px; margin-bottom: 25px; overflow: hidden;}
        #barre-progression { background: #2ecc71; height: 100%; width: 0%; transition: width 0.4s ease-out; }

        /* Zone de question adaptée (Chiffres ou Texte long) */
        #zone-calcul { font-size: 2.2rem; font-weight: 900; color: #e74c3c; margin-bottom: 30px; line-height: 1.3; background: #fff0f5; padding: 20px; border-radius: 15px; border: 3px dashed #f48fb1; }

        .options-grid { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;}
        .btn-opt { background: white; border: 3px solid #3498db; padding: 15px 25px; border-radius: 15px; font-size: 1.4rem; font-weight: 900; color: #2980b9; cursor: pointer; transition: 0.1s; min-width: 90px; }
        .btn-opt:active { transform: translateY(4px); }
        .btn-opt.correct { background: #2ecc71; color: white; border-color: #27ae60; }
        .btn-opt.erreur { background: #e74c3c; color: white; border-color: #c0392b; }

        #feedback { font-size: 1.3rem; font-weight: 900; height: 35px; margin-bottom: 15px; }

        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp">...</span> ⭐</div>

        <!-- ECRAN D'ACCUEIL -->
        <div id="ecran-hub" class="ecran actif">
            <h1>L'Aventure des Nombres</h1>
            <p class="sous-titre">Progression Douce : du CP au CE1</p>
            
            <div class="etape-container">
                <div class="etape-titre"><span class="dot dot-vert"></span> Étape 1 : Révisions de fin de CP</div>
                <button class="btn-mission" onclick="lancerJeu('add10', 'Additions jusqu\'à 10')">➕ Additions jusqu'à 10 (ex: 4 + 3)</button>
                <button class="btn-mission" onclick="lancerJeu('add20', 'Additions jusqu\'à 20')">➕ Additions jusqu'à 20 (ex: 12 + 5)</button>
                <button class="btn-mission" onclick="lancerJeu('sous_petites', 'Petites Soustractions')">➖ Petites Soustractions (ex: 8 - 2)</button>
            </div>

            <div class="etape-container etape-2">
                <div class="etape-titre"><span class="dot dot-bleu"></span> Étape 2 : L'entrée en CE1</div>
                <button class="btn-mission" onclick="lancerJeu('dizaines', 'Dizaines entières')">➕ Dizaines entières (ex: 20 + 30)</button>
                <button class="btn-mission" onclick="lancerJeu('add50', 'Nombres jusqu\'à 50')">➕ Nombres jusqu'à 50 (ex: 24 + 12)</button>
                <button class="btn-mission" onclick="lancerJeu('doubles', 'Les petits doubles')">⚖️ Les petits doubles (ex: Double de 4)</button>
            </div>

            <div class="etape-container etape-3">
                <div class="etape-titre"><span class="dot dot-violet"></span> Étape 3 : Les Multiplications</div>
                <button class="btn-mission" onclick="lancerJeu('multi', 'Les Multiplications')">✖️ Les Tables (2, 3, 4, 5 et 10)</button>
            </div>

            <!-- NOUVEAU : Étape 4 (Logique, Mesures, Géométrie) -->
            <div class="etape-container etape-4">
                <div class="etape-titre"><span class="dot dot-orange"></span> Étape 4 : Défis Avancés</div>
                <button class="btn-mission" onclick="lancerJeu('problemes', 'Résolution de Problèmes')">🧠 Résolution de Problèmes</button>
                <button class="btn-mission" onclick="lancerJeu('mesures', 'Grandeurs et Mesures')">📏 Grandeurs et Mesures</button>
                <button class="btn-mission" onclick="lancerJeu('geometrie', 'Espace et Géométrie')">🔺 Espace et Géométrie</button>
            </div>

            <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div class="hud">
                <span id="ui-titre-niveau" style="color: #2c3e50;">Mission...</span>
                <span style="color:#e74c3c;">Vies : <span id="ui-vies">❤️❤️❤️</span></span>
            </div>
            
            <div class="progression-container"><div id="barre-progression"></div></div>
            
            <div id="zone-calcul">? + ? =</div>

            <div id="zone-boutons" class="options-grid"></div>
            <div id="feedback"></div>

            <button class="btn-nav" onclick="retourAccueil()">⬅️ Quitter l'exercice</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/lola/mathsLola.json`;

        // ==========================================
        // LA BASE DE DONNÉES STATIQUE (Pour Étape 4)
        // ==========================================
        const bddMathsTextuel = {
            problemes: [
                { q: "Lola a 5 bonbons. Son frère lui en donne 3 autres. Combien a-t-elle de bonbons au total ?", rep: "8", faux: ["2", "10"] },
                { q: "Il y a 10 oiseaux sur l'arbre. 4 s'envolent. Combien en reste-t-il ?", rep: "6", faux: ["14", "5"] },
                { q: "Une boîte contient 12 crayons. Lola achète une 2ème boîte identique. Combien a-t-elle de crayons ?", rep: "24", faux: ["14", "20"] },
                { q: "Pour faire un gâteau, il faut 3 œufs. Théo veut faire 2 gâteaux. Combien d'œufs faut-il ?", rep: "6", faux: ["5", "9"] },
                { q: "Lola a 15 euros. Elle achète un livre à 5 euros. Combien d'argent lui reste-t-il ?", rep: "10 euros", faux: ["20 euros", "5 euros"] }
            ],
            mesures: [
                { q: "Avec quel outil peux-tu mesurer la longueur de ton cahier ?", rep: "Une règle", faux: ["Une balance", "Un chronomètre"] },
                { q: "Quelle unité utilise-t-on pour mesurer le poids d'une pomme ?", rep: "En grammes (g)", faux: ["En litres (L)", "En centimètres (cm)"] },
                { q: "Combien y a-t-il de minutes dans une heure ?", rep: "60 minutes", faux: ["100 minutes", "24 minutes"] },
                { q: "Si ton film commence à 14h00 et dure 1h, à quelle heure se termine-t-il ?", rep: "15h00", faux: ["13h00", "16h00"] },
                { q: "Que trouve-t-on dans une bouteille d'eau ?", rep: "1 Litre (1 L)", faux: ["1 Mètre (1 m)", "1 Kilo (1 kg)"] }
            ],
            geometrie: [
                { q: "Je n'ai pas de coins, je suis tout rond. Qui suis-je ?", rep: "Un cercle 🔴", faux: ["Un carré 🟦", "Un triangle 🔺"] },
                { q: "J'ai 4 côtés exactement de la même longueur. Qui suis-je ?", rep: "Un carré 🟦", faux: ["Un rectangle ▭", "Un triangle 🔺"] },
                { q: "Combien de côtés possède un triangle ?", rep: "3 côtés", faux: ["4 côtés", "5 côtés"] },
                { q: "J'ai 4 côtés, mais seulement ceux d'en face sont de la même longueur. Qui suis-je ?", rep: "Un rectangle ▭", faux: ["Un carré 🟦", "Un cube 🧊"] },
                { q: "Comment appelle-t-on la pointe (le coin) d'un triangle ou d'un carré ?", rep: "Un sommet", faux: ["Un côté", "Une face"] }
            ]
        };

        let profil = { xp: 0 };
        let modeActuel = "";
        let indexQuestion = 0, vies = 3;
        const questionsParSession = 5; // Uniformisé à 5 pour tous les modes
        let reponseAttendue = 0;
        let isProcessing = false;
        let listeQuestionsStatiques = []; // Pour stocker les questions de l'Étape 4

        async function chargerProfilCloud() {
            try { let res = await fetch(DB_URL); let data = await res.json(); if (data && data.xp) profil.xp = parseInt(data.xp) || 0; } catch(e) {}
            document.getElementById('ui-xp').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne; document.getElementById('ui-xp').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function changerEcran(id) { document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); document.getElementById(id).classList.add('actif'); }
        function retourAccueil() { changerEcran('ecran-hub'); }

        function lancerJeu(mode, titre) {
            modeActuel = mode; 
            indexQuestion = 0; vies = 3; isProcessing = false;
            document.getElementById('ui-titre-niveau').textContent = titre;
            document.getElementById('ui-vies').textContent = "❤️❤️❤️";
            
            // Si on lance un mode de l'Étape 4, on prépare le sac de questions
            if (['problemes', 'mesures', 'geometrie'].includes(modeActuel)) {
                listeQuestionsStatiques = [...bddMathsTextuel[modeActuel]].sort(() => Math.random() - 0.5);
            }

            changerEcran('ecran-jeu'); 
            poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) { alert("Plus de vies ! Révise bien et réessaie."); return retourAccueil(); }
            if (indexQuestion >= questionsParSession) {
                alert(`Mission accomplie ! +20 XP Bonus 🎉`);
                sauverProfilCloud(20); return retourAccueil();
            }

            isProcessing = false; indexQuestion++;
            document.getElementById('barre-progression').style.width = `${(indexQuestion / questionsParSession) * 100}%`;
            document.getElementById('feedback').textContent = "";
            
            // --- BRANCHEMENT : TEXTUEL OU PROCÉDURAL ? ---
            if (['problemes', 'mesures', 'geometrie'].includes(modeActuel)) {
                // LOGIQUE STATIQUE (Texte)
                let qTextuelle = listeQuestionsStatiques[indexQuestion - 1];
                document.getElementById('zone-calcul').textContent = qTextuelle.q;
                document.getElementById('zone-calcul').style.fontSize = "1.5rem"; // Plus petit pour lire la phrase
                reponseAttendue = qTextuelle.rep;
                
                genererBoutonsTextuels(qTextuelle.rep, qTextuelle.faux);
            } 
            else {
                // LOGIQUE PROCÉDURALE (Chiffres mathématiques)
                document.getElementById('zone-calcul').style.fontSize = "2.8rem"; // Gros pour le calcul
                let num1, num2, affichage;

                if (modeActuel === 'add10') { num1 = mathAleatoire(1, 9); num2 = mathAleatoire(1, 10 - num1); reponseAttendue = num1 + num2; affichage = `${num1} + ${num2} = ?`; } 
                else if (modeActuel === 'add20') { num1 = mathAleatoire(5, 15); num2 = mathAleatoire(1, 20 - num1); reponseAttendue = num1 + num2; affichage = `${num1} + ${num2} = ?`; }
                else if (modeActuel === 'sous_petites') { num1 = mathAleatoire(5, 10); num2 = mathAleatoire(1, num1 - 1); reponseAttendue = num1 - num2; affichage = `${num1} - ${num2} = ?`; }
                else if (modeActuel === 'dizaines') { num1 = mathAleatoire(1, 5) * 10; num2 = mathAleatoire(1, 4) * 10; reponseAttendue = num1 + num2; affichage = `${num1} + ${num2} = ?`; }
                else if (modeActuel === 'add50') { num1 = mathAleatoire(10, 30); num2 = mathAleatoire(5, 20); reponseAttendue = num1 + num2; affichage = `${num1} + ${num2} = ?`; }
                else if (modeActuel === 'doubles') { num1 = mathAleatoire(2, 10); reponseAttendue = num1 * 2; affichage = `Double de ${num1} = ?`; }
                else if (modeActuel === 'multi') { let tables = [2, 3, 4, 5, 10]; num1 = tables[Math.floor(Math.random() * tables.length)]; num2 = mathAleatoire(1, 10); reponseAttendue = num1 * num2; affichage = `${num1} x ${num2} = ?`; }

                document.getElementById('zone-calcul').textContent = affichage;
                genererBoutonsQCMChiffres();
            }
        }

        function mathAleatoire(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        // GÉNÉRATEUR N°1 : Pour les calculs mathématiques purs (Invente de faux nombres proches)
        function genererBoutonsQCMChiffres() {
            let choix = [reponseAttendue]; 
            while(choix.length < 3) {
                let ecart = Math.floor(Math.random() * 5) + 1;
                let fauxChoix = Math.random() > 0.5 ? reponseAttendue + ecart : reponseAttendue - ecart;
                if(fauxChoix >= 0 && !choix.includes(fauxChoix)) choix.push(fauxChoix);
            }
            choix.sort(() => Math.random() - 0.5); 
            afficherBoutonsHTML(choix);
        }

        // GÉNÉRATEUR N°2 : Pour les textes (Utilise les fausses réponses de la base de données)
        function genererBoutonsTextuels(bonneReponse, tableauFaussesReponses) {
            let choix = [bonneReponse, ...tableauFaussesReponses];
            choix.sort(() => Math.random() - 0.5); 
            afficherBoutonsHTML(choix, true);
        }

        // FONCTION COMMUNE D'AFFICHAGE
        function afficherBoutonsHTML(choix, estTexte = false) {
            const zoneBtns = document.getElementById('zone-boutons');
            zoneBtns.innerHTML = "";
            choix.forEach(valeur => {
                let btn = document.createElement('button'); 
                btn.className = 'btn-opt'; 
                btn.textContent = valeur;
                if (estTexte) btn.style.fontSize = "1.2rem"; // Texte plus petit pour que ça rentre dans les boutons
                btn.onclick = () => verifierReponse(btn, valeur); 
                zoneBtns.appendChild(btn);
            });
        }

        function verifierReponse(boutonElement, valeurChoisie) {
            if (isProcessing) return; isProcessing = true;
            const fb = document.getElementById('feedback');

            if (valeurChoisie === reponseAttendue) {
                boutonElement.classList.add('correct');
                fb.textContent = "Bravo ! ✨"; fb.style.color = "#27ae60"; sauverProfilCloud(3);
                setTimeout(poserQuestion, 1200); 
            } else {
                boutonElement.classList.add('erreur'); vies--; 
                document.getElementById('ui-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3-vies);
                fb.textContent = `Aïe ! La réponse était : ${reponseAttendue}`; fb.style.color = "#e74c3c";
                
                document.querySelectorAll('.btn-opt').forEach(b => { 
                    if (b.textContent == reponseAttendue) b.classList.add('correct'); 
                });
                setTimeout(poserQuestion, 3000); 
            }
        }

        document.addEventListener("DOMContentLoaded", chargerProfilCloud);
    </script>
</body>
</html>
