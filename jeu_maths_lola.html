<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Maths CE1 - L'Aventure des Nombres (Cloud)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            min-height: 100vh; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); 
            color: #333; text-align: center; padding: 20px;
        }
        
        #conteneur-appli { 
            width: 100%; max-width: 650px; background-color: #ffffff; 
            padding: 30px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            position: relative;
        }
        
        .ecran { display: none; animation: fadeIn 0.4s ease-out; }
        .ecran.actif { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-size: 2.2rem; color: #ff6b6b; margin-bottom: 5px; font-weight: 900;}
        .subtitle { font-size: 1.1rem; color: #e67e22; margin-bottom: 25px; font-weight: bold;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Menu Grid */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .btn-menu {
            background: #f8f9fa; border: 3px solid #e2e8f0; padding: 15px; border-radius: 15px;
            font-size: 1rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
        }
        .btn-menu:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .theme-icon { font-size: 2.5rem; }
        
        /* Couleurs des bordures par thème */
        .btn-menu.cp { border-color: #4ecdc4; }
        .btn-menu.ce1-add { border-color: #3498db; }
        .btn-menu.ce1-mul { border-color: #9b59b6; }
        .btn-menu.ce1-log { border-color: #e67e22; }

        /* Zone de jeu */
        #infos-jeu { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; border: 2px solid #ecf0f1; }
        #question { font-size: 4rem; font-weight: 900; margin: 25px 0; color: #2c3e50; min-height: 80px; display: flex; justify-content: center; align-items: center;}
        
        #zone-saisie { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        #reponse { font-size: 3rem; width: 140px; padding: 10px; text-align: center; border: 4px solid #f39c12; border-radius: 15px; font-weight: bold; outline: none; color: #d35400; font-family: 'Nunito', sans-serif;}
        #btn-valider { padding: 15px 30px; font-size: 1.5rem; font-weight: 900; background: #27ae60; box-shadow: 0 5px 0 #2ecc71; color: white; border:none; border-radius: 15px; cursor:pointer; transition: 0.1s;}
        #btn-valider:active { transform: translateY(5px); box-shadow: none; }
        
        #feedback { height: 40px; font-size: 1.5rem; margin-top: 20px; font-weight: 900; }
        
        /* Boutons Généraux */
        .btn-nav { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-nav:hover { background: #7f8c8d; }
        .btn-rejouer { background: #4ecdc4; box-shadow: 0 4px 0 #16a085; color: white; font-size: 1.2rem; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.1s; margin-right: 10px;}
        .btn-rejouer:active { transform: translateY(4px); box-shadow: none; }

        .rapport-box { background: #f8f9fa; padding: 25px; border-radius: 15px; text-align: center; margin-bottom: 25px; border: 2px dashed #bdc3c7;}
    </style>
</head>
<body>

    <div id="conteneur-appli">
        <div class="xp-badge" id="ui-xp">XP: ... ⭐</div>

        <!-- ECRAN D'ACCUEIL -->
        <div id="ecran-selection" class="ecran actif">
            <h1>L'Aventure des Nombres 🦄</h1>
            <p class="subtitle">Programme CE1 : Calculs & Tables</p>
            
            <div class="grid-menu">
                <button onclick="lancerJeu('cp_revisions')" class="btn-menu cp">
                    <span class="theme-icon">🎒</span>
                    <span style="color:#16a085;">Échauffement CP</span>
                    <span style="font-size:0.8rem; color:#7f8c8d;">Petites additions & soustractions</span>
                </button>
                <button onclick="lancerJeu('ce1_add_sous')" class="btn-menu ce1-add">
                    <span class="theme-icon">➕</span>
                    <span style="color:#2980b9;">Calcul CE1</span>
                    <span style="font-size:0.8rem; color:#7f8c8d;">Additions (jusqu'à 100) & Soustractions</span>
                </button>
                <button onclick="lancerJeu('ce1_tables')" class="btn-menu ce1-mul">
                    <span class="theme-icon">✖️</span>
                    <span style="color:#8e44ad;">Les Tables</span>
                    <span style="font-size:0.8rem; color:#7f8c8d;">Multiplications : x2, x3, x4, x5, x10</span>
                </button>
                <button onclick="lancerJeu('ce1_logique')" class="btn-menu ce1-log">
                    <span class="theme-icon">⚖️</span>
                    <span style="color:#d35400;">Doubles & Moitiés</span>
                    <span style="font-size:0.8rem; color:#7f8c8d;">Calcul mental rapide</span>
                </button>
            </div>
            
            <button class="btn-nav" style="margin-top: 10px;" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN DE JEU -->
        <div id="ecran-jeu" class="ecran">
            <div id="infos-jeu">
                <span id="infos-vies" style="letter-spacing: 5px;">❤️❤️❤️</span>
                <span id="infos-progression" style="color: #7f8c8d;">1 / 10</span>
            </div>
            
            <div id="question">...</div>
            
            <div id="zone-saisie">
                <input type="number" id="reponse" autocomplete="off" inputmode="numeric">
                <button id="btn-valider" onclick="verifierReponse()">OK</button>
            </div>
            
            <div id="feedback"></div>
            
            <button class="btn-nav" style="margin-top: 15px;" onclick="montrerEcran('ecran-selection')">⬅️ Changer d'exercice</button>
        </div>

        <!-- ECRAN DE FIN -->
        <div id="ecran-fin" class="ecran">
            <h1 style="color:#27ae60; margin-bottom:10px;" id="titre-fin">Superbe réussite ! 🎉</h1>
            <div class="rapport-box">
                <p style="font-size:1.5rem; font-weight: 900; color: #34495e;">Score : <span id="fin-score" style="color:#e67e22;">10</span> / 10</p>
                <p style="font-size:1.2rem; margin-top:10px; font-weight: bold; color: #7f8c8d;">XP Gagné : <span id="fin-xp" style="color:#2ecc71;">+0 ⭐</span></p>
            </div>
            <button onclick="lancerJeu(modeActuel)" class="btn-rejouer">🔄 Rejouer</button>
            <button onclick="montrerEcran('ecran-selection')" class="btn-nav">Menu Principal</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/lola/mathsLola.json`;

        let profil = { xp: 0 };
        let vies = 3; 
        let indexQuestion = 0; 
        let nbQuestions = 10;
        let modeActuel = ''; 
        let reponseAttendue = 0; 
        let scorePartie = 0;
        let isProcessing = false;

        const E = (id) => document.getElementById(id);

        // --- SAUVEGARDE CLOUD FIREBASE ---
        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            majXP();
        }

        async function sauverProfilCloud() {
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        function majXP() { E('ui-xp').textContent = `XP: ${profil.xp} ⭐`; }
        function ajouterXP(points) { profil.xp += points; majXP(); sauverProfilCloud(); }

        // --- NAVIGATION ---
        function montrerEcran(id) { document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); E(id).classList.add('actif'); }

        // --- MOTEUR DE JEU ---
        function lancerJeu(mode) {
            modeActuel = mode; 
            vies = 3; 
            indexQuestion = 1; 
            scorePartie = 0;
            isProcessing = false;
            
            E('infos-vies').textContent = "❤️❤️❤️"; 
            montrerEcran('ecran-jeu'); 
            poserQuestion();
        }

        function poserQuestion() {
            if (vies <= 0) return finirJeu(false);
            if (indexQuestion > nbQuestions) return finirJeu(true);
            
            isProcessing = false;
            E('infos-progression').textContent = `${indexQuestion} / ${nbQuestions}`;
            let n1, n2, txt;

            if (modeActuel === 'cp_revisions') {
                if (Math.random() > 0.5) {
                    n1 = Math.floor(Math.random() * 9) + 1; 
                    n2 = Math.floor(Math.random() * (10 - n1)) + 1;
                    reponseAttendue = n1 + n2; txt = `${n1} + ${n2} =`;
                } else {
                    n1 = Math.floor(Math.random() * 10) + 5; 
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    reponseAttendue = n1 - n2; txt = `${n1} - ${n2} =`;
                }
            } 
            else if (modeActuel === 'ce1_add_sous') {
                if (Math.random() > 0.5) {
                    // Additions jusqu'à 100
                    n1 = Math.floor(Math.random() * 50) + 10; 
                    n2 = Math.floor(Math.random() * 40) + 10;
                    reponseAttendue = n1 + n2; txt = `${n1} + ${n2} =`;
                } else {
                    // Soustractions CE1
                    n1 = Math.floor(Math.random() * 40) + 20; 
                    n2 = Math.floor(Math.random() * 19) + 1;
                    reponseAttendue = n1 - n2; txt = `${n1} - ${n2} =`;
                }
            } 
            else if (modeActuel === 'ce1_tables') {
                let tables = [2, 3, 4, 5, 10];
                n1 = tables[Math.floor(Math.random() * tables.length)];
                n2 = Math.floor(Math.random() * 10) + 1;
                reponseAttendue = n1 * n2;
                txt = (Math.random() > 0.5) ? `${n1} x ${n2} =` : `${n2} x ${n1} =`;
            } 
            else if (modeActuel === 'ce1_logique') {
                if(Math.random() > 0.5) {
                    let base = Math.floor(Math.random() * 15) + 1; // Double de 1 à 15
                    if(Math.random() > 0.8) base = [20, 30, 40, 50][Math.floor(Math.random()*4)]; // Quelques dizaines entières
                    reponseAttendue = base * 2;
                    txt = `Double de ${base} =`;
                } else {
                    let base = Math.floor(Math.random() * 10) + 1; // Moitié de 2 à 20 (pair)
                    if(Math.random() > 0.8) base = [10, 15, 20, 25, 50][Math.floor(Math.random()*5)]; // Moitié de 20, 30, 40, 50, 100
                    let cible = base * 2;
                    reponseAttendue = base;
                    txt = `Moitié de ${cible} =`;
                }
            }
            
            E('question').textContent = txt; 
            E('reponse').value = ''; 
            E('reponse').disabled = false; 
            E('btn-valider').style.display = 'inline-block'; 
            E('reponse').focus(); 
            E('feedback').textContent = '';
        }

        function verifierReponse() {
            if (isProcessing) return;
            let valeur = E('reponse').value; 
            if (valeur.trim() === '') return;
            
            isProcessing = true;
            E('reponse').disabled = true; 
            E('btn-valider').style.display = 'none';
            
            if (parseInt(valeur) === reponseAttendue) { 
                E('feedback').textContent = "Bravo Lola ! ✨"; 
                E('feedback').style.color = "#27ae60"; 
                scorePartie++; 
                indexQuestion++; 
                setTimeout(poserQuestion, 1000); 
            } else { 
                vies--; 
                E('infos-vies').textContent = "❤️".repeat(vies) + "🖤".repeat(3 - vies);
                E('feedback').textContent = `Oups ! C'était ${reponseAttendue}`; 
                E('feedback').style.color = "#c0392b"; 
                setTimeout(() => { 
                    indexQuestion++; 
                    poserQuestion(); 
                }, 2000);
            }
        }

        function finirJeu(victoire) { 
            let xpGagne = (scorePartie * 2) + (vies * 5); // 2 XP par bonne réponse + 5 XP par vie restante
            if (!victoire && scorePartie === 0) xpGagne = 0;

            E('titre-fin').textContent = victoire ? "Superbe réussite ! 🎉" : "Entraînement terminé ! 📚";
            E('titre-fin').style.color = victoire ? "#27ae60" : "#e67e22";
            
            E('fin-score').textContent = scorePartie;
            E('fin-xp').textContent = `+${xpGagne} ⭐`;
            
            ajouterXP(xpGagne);
            montrerEcran('ecran-fin'); 
        }

        // Validation avec la touche Entrée
        E('reponse').addEventListener("keyup", (e) => { 
            if (e.key === "Enter" && !E('reponse').disabled) verifierReponse(); 
        });
        
        chargerProfilCloud();
    </script>
</body>
</html>
