<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sciences & Labo CM2 - L'Académie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); 
            color: #2c3e50; display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px; 
        }
        
        #app-container { 
            background: white; padding: 30px; border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 900px; width: 100%; text-align: center; position: relative;
        }
        
        h1 { color: #27ae60; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; margin-bottom: 25px; font-weight: 700; font-size: 1.1rem;}
        
        .xp-badge { position: absolute; top: 20px; right: 25px; font-weight: 900; background: #fff3cd; color: #f39c12; padding: 8px 15px; border-radius: 20px; border: 2px solid #ffeeba; font-size: 1.1rem;}

        /* Menu Hub */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .btn-mode {
            background: #f8f9fa; border: 3px solid #bdc3c7; padding: 20px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .btn-mode:hover { transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .mode-chimie:hover { border-color: #8e44ad; background: #f4ecf7; }
        .mode-physique:hover { border-color: #d35400; background: #fdf2e9; }
        .mode-astro:hover { border-color: #2980b9; background: #ebf5fb; }
        .mode-icon { font-size: 3rem; }

        /* HUD Jeu */
        .hud-jeu { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; border: 2px solid #ecf0f1; }
        
        /* === MODE CHIMIE === */
        #mission-chimie { font-size: 1.4rem; color: #8e44ad; font-weight: 900; margin-bottom: 20px; }
        
        .elements-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .btn-element {
            background: white; border: 3px solid #3498db; border-radius: 50%; width: 80px; height: 80px;
            font-size: 2rem; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #2980b9; transition: 0.1s;
        }
        .btn-element:active { transform: translateY(5px); box-shadow: none; }
        .btn-element.selectionne { background: #f1c40f; border-color: #f39c12; box-shadow: 0 5px 0 #e67e22; transform: scale(1.1); }

        #chaudron {
            background: #2c3e50; width: 100%; max-width: 300px; height: 120px; margin: 0 auto 20px auto;
            border-radius: 20px; border-bottom: 10px solid #1a252f; display: flex; justify-content: center; align-items: center; gap: 20px;
            color: white; font-size: 2rem;
        }
        .slot-melange { width: 60px; height: 60px; border: 3px dashed #7f8c8d; border-radius: 10px; display: flex; justify-content: center; align-items: center; }

        /* === MODE PHYSIQUE (BALANCE) === */
        #mission-balance { font-size: 1.4rem; color: #d35400; font-weight: 900; margin-bottom: 20px; }
        
        .balance-container {
            display: flex; justify-content: space-around; align-items: flex-end;
            height: 150px; border-bottom: 6px solid #bdc3c7; margin-bottom: 30px; padding-bottom: 10px; position: relative;
        }
        .plateau {
            width: 120px; height: 100px; border-bottom: 4px solid #34495e;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            font-size: 1.5rem; font-weight: bold; color: #2c3e50; transition: transform 0.5s;
        }
        .plateau-cible { background: rgba(231, 76, 60, 0.1); border-radius: 10px 10px 0 0; }
        .plateau-joueur { background: rgba(46, 204, 113, 0.1); border-radius: 10px 10px 0 0; }
        
        .poids-grid { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .btn-poids {
            background: #95a5a6; color: white; font-weight: bold; font-size: 1.2rem;
            border: none; padding: 15px 25px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 0 #7f8c8d; transition: 0.1s;
        }
        .btn-poids:active { transform: translateY(5px); box-shadow: none; }

        /* === NOUVEAU : MODE ASTRONOMIE === */
        #mission-astro { font-size: 1.4rem; color: #2980b9; font-weight: 900; margin-bottom: 20px; }
        
        #espace-solaire {
            background: #000; border-radius: 15px; padding: 20px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: flex-start; gap: 10px; overflow-x: auto;
            border: 4px solid #34495e; min-height: 180px; position: relative;
        }
        
        .soleil { font-size: 5rem; margin-right: 20px; text-shadow: 0 0 20px #f1c40f; }
        
        .orbite-slot {
            width: 80px; height: 80px; border: 2px dashed #7f8c8d; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
            transition: 0.2s; position: relative;
        }
        .orbite-slot.survol { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); transform: scale(1.1); }
        .orbite-slot::after { content: attr(data-position); position: absolute; bottom: -25px; color: #bdc3c7; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }

        #inventaire-planetes {
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
            background: #f8f9fa; padding: 15px; border-radius: 15px; border: 2px solid #ecf0f1; min-height: 100px;
        }

        .planete-drag {
            cursor: grab; font-size: 3rem; transition: transform 0.1s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            display: flex; flex-direction: column; align-items: center;
        }
        .planete-drag span { font-size: 0.8rem; font-weight: bold; background: white; padding: 2px 8px; border-radius: 10px; border: 1px solid #ccc; margin-top: 5px; }
        .planete-drag:active { cursor: grabbing; transform: scale(1.1); }

        /* Éléments communs */
        .btn-nav { background: #7f8c8d; color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s; margin-top: 15px;}
        .btn-nav:hover { background: #95a5a6; }
        
        #feedback { font-size: 1.4rem; font-weight: 900; height: 35px; margin-bottom: 15px; }

        .ecran { display: none; }
        .ecran.actif { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="xp-badge">XP: <span id="ui-xp">...</span> ⭐</div>

        <!-- MENU HUB -->
        <div id="ecran-hub" class="ecran actif">
            <h1>Laboratoire des Sciences 🔬</h1>
            <p class="sous-titre">Choisis ton atelier d'expérimentation</p>
            
            <div class="menu-grid">
                <button class="btn-mode mode-chimie" onclick="lancerChimie()">
                    <span class="mode-icon">🧪</span>
                    <span>Chimie & États</span>
                    <span style="font-size: 0.9rem; color: #7f8c8d; font-weight: normal;">Mélanges et réactions</span>
                </button>
                <button class="btn-mode mode-physique" onclick="lancerPhysique()">
                    <span class="mode-icon">⚖️</span>
                    <span>Physique des Masses</span>
                    <span style="font-size: 0.9rem; color: #7f8c8d; font-weight: normal;">Équilibre la balance</span>
                </button>
                <!-- NOUVEAU BOUTON -->
                <button class="btn-mode mode-astro" onclick="lancerAstronomie()">
                    <span class="mode-icon">🪐</span>
                    <span>Astronomie</span>
                    <span style="font-size: 0.9rem; color: #7f8c8d; font-weight: normal;">Le Système Solaire</span>
                </button>
            </div>

            <button class="btn-nav" onclick="window.location.href='index.html'">🏠 Retour à l'Académie</button>
        </div>

        <!-- ECRAN CHIMIE -->
        <div id="ecran-chimie" class="ecran">
            <div class="hud-jeu"><span style="color:#8e44ad;">Atelier de Chimie</span></div>
            <div id="mission-chimie">...</div>

            <div id="chaudron">
                <div class="slot-melange" id="slot-1">?</div>
                <span>+</span>
                <div class="slot-melange" id="slot-2">?</div>
            </div>

            <div class="elements-grid" id="inventaire-elements"></div>
            
            <div id="feedback-chimie" style="font-size: 1.4rem; font-weight: 900; height: 35px; margin-bottom: 15px;"></div>
            <div>
                <button class="btn-nav" style="background:#e74c3c;" onclick="viderChaudron()">Vider le chaudron</button>
                <button class="btn-nav" onclick="quitterJeu()">⬅️ Retour au Labo</button>
            </div>
        </div>

        <!-- ECRAN PHYSIQUE -->
        <div id="ecran-physique" class="ecran">
            <div class="hud-jeu"><span style="color:#d35400;">Atelier de Physique</span></div>
            <div id="mission-balance">...</div>

            <div class="balance-container">
                <div class="plateau plateau-cible" id="ui-poids-cible">
                    <div style="font-size: 3rem;">📦</div>
                    <span id="txt-cible">0g</span>
                </div>
                <div style="width: 4px; height: 80px; background: #34495e;"></div>
                <div class="plateau plateau-joueur" id="ui-poids-actuel">
                    <div style="font-size: 3rem;">⚖️</div>
                    <span id="txt-actuel">0g</span>
                </div>
            </div>

            <div class="poids-grid">
                <button class="btn-poids" onclick="ajouterPoids(10)">+ 10g</button>
                <button class="btn-poids" onclick="ajouterPoids(50)">+ 50g</button>
                <button class="btn-poids" onclick="ajouterPoids(100)">+ 100g</button>
                <button class="btn-poids" onclick="ajouterPoids(500)" style="background:#2c3e50; box-shadow: 0 5px 0 #1a252f;">+ 500g</button>
            </div>

            <div id="feedback-physique" style="font-size: 1.4rem; font-weight: 900; height: 35px; margin-bottom: 15px;"></div>

            <div>
                <button class="btn-nav" style="background:#e74c3c;" onclick="viderBalance()">Vider la balance</button>
                <button class="btn-nav" onclick="quitterJeu()">⬅️ Retour au Labo</button>
            </div>
        </div>

        <!-- NOUVEL ECRAN ASTRONOMIE -->
        <div id="ecran-astro" class="ecran">
            <div class="hud-jeu"><span style="color:#2980b9;">Atelier d'Astronomie</span></div>
            <div id="mission-astro">Ordonne les planètes à partir du Soleil !</div>

            <!-- La zone de dépôt spatiale -->
            <div id="espace-solaire">
                <div class="soleil" title="Le Soleil">☀️</div>
                <!-- Les orbites seront générées ici par JS -->
            </div>

            <!-- La banque de planètes -->
            <div id="inventaire-planetes"></div>

            <div id="feedback-astro" style="font-size: 1.4rem; font-weight: 900; height: 35px; margin-bottom: 15px;"></div>

            <div>
                <button class="btn-nav" onclick="quitterJeu()">⬅️ Retour au Labo</button>
            </div>
        </div>

    </div>

    <script>
        // --- BASE DE DONNÉES CLOUD ---
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/theo/sciencesSaveV1.json`;

        let profil = { xp: 0 };
        
        function changerEcran(id) { 
            document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif')); 
            document.getElementById(id).classList.add('actif'); 
        }
        function quitterJeu() { changerEcran('ecran-hub'); }

        async function chargerProfilCloud() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data && data.xp !== undefined) profil.xp = parseInt(data.xp) || 0;
            } catch(e) {}
            document.getElementById('ui-xp').textContent = profil.xp;
        }

        async function sauverProfilCloud(xpGagne) {
            profil.xp += xpGagne;
            document.getElementById('ui-xp').textContent = profil.xp;
            try { await fetch(DB_URL, { method: 'PUT', body: JSON.stringify({ xp: profil.xp }) }); } catch(e) {}
        }

        // ==========================================
        // MOTEUR 1 : CHIMIE
        // ==========================================
        const elementsBase = [
            { id: "eau", emoji: "💧", nom: "Eau" }, { id: "feu", emoji: "🔥", nom: "Chaleur" },
            { id: "froid", emoji: "❄️", nom: "Froid" }, { id: "terre", emoji: "🪨", nom: "Terre" }, { id: "air", emoji: "💨", nom: "Air" }
        ];

        const recettes = [
            { resultat: "de la Glace", verbe: "Solidification", ingredients: ["eau", "froid"] },
            { resultat: "de la Vapeur d'eau", verbe: "Évaporation", ingredients: ["eau", "feu"] },
            { resultat: "de la Lave", verbe: "Fusion", ingredients: ["terre", "feu"] },
            { resultat: "de la Boue", verbe: "Mélange", ingredients: ["terre", "eau"] },
            { resultat: "un Nuage", verbe: "Condensation", ingredients: ["air", "eau"] }
        ];

        let recetteActive = null;
        let chaudron = [];

        function lancerChimie() {
            chaudron = []; genererInterfaceElements(); nouvelleRecette(); changerEcran('ecran-chimie');
        }

        function genererInterfaceElements() {
            const container = document.getElementById('inventaire-elements'); container.innerHTML = "";
            elementsBase.forEach(el => {
                let btn = document.createElement('button'); btn.className = "btn-element"; btn.textContent = el.emoji; btn.title = el.nom;
                btn.onclick = () => ajouterAuChaudron(el, btn); container.appendChild(btn);
            });
        }

        function nouvelleRecette() {
            viderChaudron(); recetteActive = recettes[Math.floor(Math.random() * recettes.length)];
            document.getElementById('mission-chimie').innerHTML = `Mission : Fabrique <strong>${recetteActive.resultat}</strong> !`;
            document.getElementById('feedback-chimie').textContent = "";
        }

        function ajouterAuChaudron(element, btnHTML) {
            if (chaudron.length >= 2) return;
            chaudron.push(element.id); btnHTML.classList.add('selectionne');
            if (chaudron.length === 1) document.getElementById('slot-1').textContent = element.emoji;
            if (chaudron.length === 2) { document.getElementById('slot-2').textContent = element.emoji; verifierMelange(); }
        }

        function viderChaudron() {
            chaudron = []; document.getElementById('slot-1').textContent = "?"; document.getElementById('slot-2').textContent = "?";
            document.querySelectorAll('.btn-element').forEach(b => b.classList.remove('selectionne'));
            document.getElementById('feedback-chimie').textContent = "";
        }

        function verifierMelange() {
            let melangeTrie = [...chaudron].sort(); let recetteTriee = [...recetteActive.ingredients].sort();
            const fb = document.getElementById('feedback-chimie');
            if (JSON.stringify(melangeTrie) === JSON.stringify(recetteTriee)) {
                fb.innerHTML = `Bravo ! C'est le principe de <strong>${recetteActive.verbe}</strong> ✨`; fb.style.color = "#27ae60";
                sauverProfilCloud(15); setTimeout(nouvelleRecette, 2500);
            } else {
                fb.textContent = "Ce mélange ne donne pas le bon résultat... 💥"; fb.style.color = "#e74c3c"; setTimeout(viderChaudron, 2000);
            }
        }

        // ==========================================
        // MOTEUR 2 : PHYSIQUE
        // ==========================================
        let poidsCible = 0; let poidsActuel = 0;

        function lancerPhysique() { nouvellePesee(); changerEcran('ecran-physique'); }

        function nouvellePesee() {
            poidsActuel = 0; poidsCible = (Math.floor(Math.random() * 90) + 10) * 10; 
            document.getElementById('mission-balance').textContent = `Mission : Équilibre la balance à exactement ${poidsCible}g !`;
            document.getElementById('txt-cible').textContent = `${poidsCible}g`;
            document.getElementById('feedback-physique').textContent = ""; actualiserBalance();
        }

        function ajouterPoids(valeur) { poidsActuel += valeur; actualiserBalance(); verifierEquilibre(); }
        function viderBalance() { poidsActuel = 0; actualiserBalance(); document.getElementById('feedback-physique').textContent = ""; }

        function actualiserBalance() {
            document.getElementById('txt-actuel').textContent = `${poidsActuel}g`;
            const plateauCible = document.getElementById('ui-poids-cible'); const plateauJoueur = document.getElementById('ui-poids-actuel');
            if (poidsActuel === 0) { plateauCible.style.transform = "translateY(20px)"; plateauJoueur.style.transform = "translateY(-20px)"; } 
            else if (poidsActuel < poidsCible) { plateauCible.style.transform = "translateY(10px)"; plateauJoueur.style.transform = "translateY(-10px)"; } 
            else if (poidsActuel === poidsCible) { plateauCible.style.transform = "translateY(0px)"; plateauJoueur.style.transform = "translateY(0px)"; } 
            else { plateauCible.style.transform = "translateY(-20px)"; plateauJoueur.style.transform = "translateY(20px)"; }
        }

        function verifierEquilibre() {
            const fb = document.getElementById('feedback-physique');
            if (poidsActuel === poidsCible) {
                fb.textContent = "Équilibre parfait ! Bravo ! ⚖️✨"; fb.style.color = "#27ae60";
                sauverProfilCloud(15); setTimeout(nouvellePesee, 2000);
            } else if (poidsActuel > poidsCible) {
                fb.textContent = "Trop lourd ! La balance bascule ! 💥"; fb.style.color = "#e74c3c"; setTimeout(viderBalance, 1500);
            }
        }

        // ==========================================
        // MOTEUR 3 : ASTRONOMIE (Le Système Solaire)
        // ==========================================
        const systemeSolaire = [
            { id: "p1", nom: "Mercure", emoji: "🪨" },
            { id: "p2", nom: "Vénus", emoji: "⭐" },
            { id: "p3", nom: "Terre", emoji: "🌍" },
            { id: "p4", nom: "Mars", emoji: "🔴" },
            { id: "p5", nom: "Jupiter", emoji: "🪐" }, // On triche avec l'emoji saturne pour le visuel géant gazeux
            { id: "p6", nom: "Saturne", emoji: "🪐" },
            { id: "p7", nom: "Uranus", emoji: "🧊" },
            { id: "p8", nom: "Neptune", emoji: "🌊" }
        ];

        let planetesPlacees = 0;

        function lancerAstronomie() {
            planetesPlacees = 0;
            genererEspaceSolaire();
            document.getElementById('feedback-astro').textContent = "";
            changerEcran('ecran-astro');
        }

        function genererEspaceSolaire() {
            const espace = document.getElementById('espace-solaire');
            const inventaire = document.getElementById('inventaire-planetes');
            
            // On nettoie, mais on garde le soleil !
            espace.innerHTML = '<div class="soleil" title="Le Soleil">☀️</div>';
            inventaire.innerHTML = '';

            // 1. Création des orbites (zones de drop)
            systemeSolaire.forEach((planete, index) => {
                let slot = document.createElement('div');
                slot.className = "orbite-slot";
                slot.dataset.planeteId = planete.id;
                slot.dataset.position = `${index + 1}`; // Affiche 1, 2, 3 en dessous
                
                // Événements pour le drag & drop
                slot.ondragover = (e) => { e.preventDefault(); };
                slot.ondragenter = () => slot.classList.add('survol');
                slot.ondragleave = () => slot.classList.remove('survol');
                slot.ondrop = dropPlanete;
                
                espace.appendChild(slot);
            });

            // 2. Création des planètes mélangées (les éléments draggables)
            let planetesMelangees = [...systemeSolaire].sort(() => Math.random() - 0.5);
            planetesMelangees.forEach(planete => {
                let pDiv = document.createElement('div');
                pDiv.className = "planete-drag";
                pDiv.id = `drag-${planete.id}`;
                pDiv.dataset.idReponse = planete.id;
                pDiv.draggable = true;
                pDiv.innerHTML = `${planete.emoji}<span>${planete.nom}</span>`;
                
                pDiv.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', planete.id);
                };
                
                inventaire.appendChild(pDiv);
            });
        }

        function dropPlanete(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('survol');

            const idPlaneteLachee = e.dataTransfer.getData('text/plain');
            const idPlaneteAttendue = e.currentTarget.dataset.planeteId;
            const fb = document.getElementById('feedback-astro');

            // Logique de validation
            if (idPlaneteLachee === idPlaneteAttendue) {
                // Succès ! La planète est dans la bonne orbite
                let elementPlanete = document.getElementById(`drag-${idPlaneteLachee}`);
                
                // On la met dans l'orbite et on empêche de la rebouger
                elementPlanete.draggable = false;
                elementPlanete.style.cursor = "default";
                e.currentTarget.appendChild(elementPlanete);
                
                planetesPlacees++;
                fb.textContent = "Bonne orbite ! ✨";
                fb.style.color = "#27ae60";

                // Condition de victoire
                if (planetesPlacees === systemeSolaire.length) {
                    fb.textContent = "Incroyable ! Le système solaire est reconstitué ! 🏆";
                    sauverProfilCloud(30); // Grosse récompense !
                    setTimeout(lancerAstronomie, 4000); // Recommence après 4 secondes
                }

            } else {
                // Erreur
                fb.textContent = "Oups... Cette planète n'est pas à cette place !";
                fb.style.color = "#e74c3c";
            }
        }

        // Lancement initial
        chargerProfilCloud();
    </script>
</body>
</html>
