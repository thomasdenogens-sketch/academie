<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Tangram - Jeux de Réflexion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Nunito', sans-serif; background: #2c3e50; color: #ecf0f1; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; 
            user-select: none; touch-action: none;
        }
        
        h1 { color: #2ecc71; font-weight: 900; margin-bottom: 5px; font-size: 2.5rem;}
        .sous-titre { color: #bdc3c7; margin-bottom: 20px; font-size: 1.1rem; }

        /* Le plateau de jeu 100% SVG */
        .plateau-container {
            width: 100%; max-width: 800px; background: white; border-radius: 15px; 
            border: 4px dashed #7f8c8d; box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            margin-bottom: 20px; overflow: hidden;
        }

        #jeu-tangram {
            width: 100%; height: auto; display: block;
        }

        .piece-mobile { cursor: grab; transition: filter 0.2s; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4)); }
        .piece-mobile:active { cursor: grabbing; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; justify-content: center; align-items: center;}
        
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1.1rem; border: none; font-family: 'Nunito', sans-serif;}
        .btn:active { transform: scale(0.95); }
        
        .btn-outil { background: #34495e; color: white; border: 2px solid #bdc3c7;}
        .btn-outil:hover { background: #2c3e50; }
        
        .btn-aide { background: #f39c12; color: white; box-shadow: 0 4px 0 #d35400;}
        .btn-aide:hover { background: #f1c40f; }

        .btn-valider { background: #27ae60; color: white; box-shadow: 0 4px 0 #219a52; font-size: 1.2rem; padding: 12px 25px;}
        .btn-valider:hover { background: #2ecc71; }

        .consigne { font-weight: bold; color: #f1c40f; margin-bottom: 10px; background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 10px; text-align: center;}
        .btn-nav { background: #95a5a6; color: white; margin-top: 20px;}
        
        #hud-niveau { font-size: 1.5rem; font-weight: 900; color: #3498db; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;}
        
        .indice-piece { opacity: 0; transition: opacity 0.5s ease; }
        .indice-piece.visible { opacity: 1; }
    </style>
</head>
<body>

    <h1>Le Tangram 🔺</h1>
    <p class="sous-titre">Reproduis l'ombre chinoise exacte !</p>

    <div id="hud-niveau">Niveau 1 : Le Carré</div>

    <div class="consigne">
        👉 <strong>Glisse</strong> une pièce pour la bouger. <br>
        👉 <strong>Touche-la (clic court)</strong> pour la tourner. <br>
        👉 Utilise le bouton <strong>Miroir</strong> pour retourner le parallélogramme !
    </div>

    <div class="toolbar">
        <button class="btn btn-outil" onclick="reinitialiserPieces()">🔄 Ranger les pièces</button>
        <button class="btn btn-outil" onclick="retournerPiece()" style="background: #8e44ad; border-color: #9b59b6;">🪞 Miroir (Pièce sélectionnée)</button>
        <button class="btn btn-aide" onclick="afficherIndice()">💡 Indice !</button>
    </div>

    <!-- NOUVEAU PLATEAU 100% MATHÉMATIQUE -->
    <div class="plateau-container">
        <svg id="jeu-tangram" viewBox="0 0 800 600">
            <!-- 1. L'ombre grise générée automatiquement -->
            <g id="couche-ombre"></g>
            
            <!-- 2. Les fantômes bleus (indices) -->
            <g id="couche-indices"></g>
            
            <!-- 3. Les pièces interactives -->
            <g id="couche-pieces"></g>
        </svg>
    </div>

    <button class="btn btn-valider" onclick="validerNiveau()">✅ J'ai réussi !</button>
    <button class="btn btn-nav" onclick="window.location.href='index.html'">🏠 Retour</button>

    <script>
        // --- 1. DÉFINITION GÉOMÉTRIQUE PURE DU TANGRAM ---
        // cx, cy représentent le centre mathématique pour tourner la pièce proprement
        const defPiecesTangram = [
            { id: "gros1", color: "#e74c3c", path: "M 0 0 L 200 0 L 100 100 Z", cx: 100, cy: 50 },
            { id: "gros2", color: "#3498db", path: "M 0 0 L 100 100 L 0 200 Z", cx: 50, cy: 100 },
            { id: "moyen", color: "#2ecc71", path: "M 0 100 L 100 100 L 100 0 Z", cx: 50, cy: 50 }, 
            { id: "carre", color: "#e67e22", path: "M 0 50 L 50 0 L 100 50 L 50 100 Z", cx: 50, cy: 50 },
            { id: "petit1", color: "#f1c40f", path: "M 0 0 L 50 50 L 0 100 Z", cx: 25, cy: 50 },
            { id: "petit2", color: "#9b59b6", path: "M 0 50 L 100 50 L 50 0 Z", cx: 50, cy: 25 },
            { id: "para", color: "#1abc9c", path: "M 0 50 L 100 50 L 150 0 L 50 0 Z", cx: 75, cy: 25 }
        ];

        // --- 2. LES NIVEAUX ET SOLUTIONS ---
        const niveauxTangram = [
            {
                nom: "Le Grand Carré",
                solution: [
                    { id: "gros1",  x: 300, y: 200, rot: 0, flip: 1 },
                    { id: "gros2",  x: 300, y: 200, rot: 0, flip: 1 },
                    { id: "moyen",  x: 400, y: 300, rot: 0, flip: 1 },
                    { id: "carre",  x: 400, y: 250, rot: 0, flip: 1 },
                    { id: "petit1", x: 400, y: 200, rot: 0, flip: 1 },
                    { id: "petit2", x: 350, y: 300, rot: 0, flip: 1 },
                    { id: "para",   x: 300, y: 350, rot: 0, flip: 1 }
                ]
            },
            {
                nom: "Le Cygne",
                solution: [
                    { id: "gros1",  x: 350, y: 350, rot: 180, flip: 1 },
                    { id: "gros2",  x: 250, y: 250, rot: -90, flip: 1 },
                    { id: "moyen",  x: 450, y: 250, rot: 90, flip: 1 },
                    { id: "carre",  x: 200, y: 200, rot: 0, flip: 1 },
                    { id: "para",   x: 150, y: 150, rot: -45, flip: 1 },
                    { id: "petit1", x: 100, y: 100, rot: 135, flip: 1 },
                    { id: "petit2", x: 50,  y: 100, rot: 45, flip: 1 }
                ]
            },
            {
                nom: "La Fusée",
                solution: [
                    { id: "gros1",  x: 300, y: 200, rot: 90, flip: 1 },
                    { id: "gros2",  x: 400, y: 200, rot: -90, flip: 1 },
                    { id: "moyen",  x: 350, y: 100, rot: 45, flip: 1 }, 
                    { id: "carre",  x: 350, y: 400, rot: 45, flip: 1 }, 
                    { id: "para",   x: 350, y: 250, rot: 90, flip: 1 }, 
                    { id: "petit1", x: 250, y: 400, rot: -45, flip: 1 }, 
                    { id: "petit2", x: 450, y: 400, rot: 45, flip: 1 }
                ]
            }
        ];

        let niveauActuelIdx = 0;
        let niveauActuel = niveauxTangram[0];
        let indicesAffiches = 0;

        // --- 3. GÉNÉRATION GRAPHIQUE ---
        function chargerNiveau() {
            niveauActuel = niveauxTangram[niveauActuelIdx];
            document.getElementById('hud-niveau').textContent = `Niveau ${niveauActuelIdx + 1} : ${niveauActuel.nom}`;
            indicesAffiches = 0;
            
            dessinerOmbreMagique();
            dessinerIndices();
            genererPiecesMobiles();
        }

        // C'est ici la magie : On dessine l'ombre en assemblant les pièces de la solution en gris !
        // C'est donc mathématiquement impossible que ça ne corresponde pas.
        function dessinerOmbreMagique() {
            const couche = document.getElementById("couche-ombre");
            couche.innerHTML = "";
            niveauActuel.solution.forEach(sol => {
                const def = defPiecesTangram.find(p => p.id === sol.id);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", "#bdc3c7");
                path.setAttribute("stroke", "#bdc3c7");
                path.setAttribute("stroke-width", "3");
                path.setAttribute("stroke-linejoin", "round");
                path.setAttribute("transform", `translate(${sol.x}, ${sol.y}) rotate(${sol.rot}, ${def.cx}, ${def.cy}) scale(${sol.flip}, 1)`);
                couche.appendChild(path);
            });
        }

        function dessinerIndices() {
            const couche = document.getElementById("couche-indices");
            couche.innerHTML = "";
            niveauActuel.solution.forEach(sol => {
                const def = defPiecesTangram.find(p => p.id === sol.id);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", "rgba(52, 152, 219, 0.4)");
                path.setAttribute("stroke", "#2980b9");
                path.setAttribute("stroke-width", "3");
                path.setAttribute("class", "indice-piece");
                path.setAttribute("transform", `translate(${sol.x}, ${sol.y}) rotate(${sol.rot}, ${def.cx}, ${def.cy}) scale(${sol.flip}, 1)`);
                couche.appendChild(path);
            });
        }

        function genererPiecesMobiles() {
            const couche = document.getElementById("couche-pieces");
            couche.innerHTML = "";
            
            // On les aligne proprement en bas
            const posInit = [
                {x: 50, y: 450}, {x: 200, y: 450}, {x: 350, y: 450},
                {x: 450, y: 450}, {x: 550, y: 450}, {x: 650, y: 450}, {x: 50, y: 350}
            ];

            defPiecesTangram.forEach((def, index) => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "piece-mobile");
                g.dataset.id = def.id;
                g.dataset.x = posInit[index].x;
                g.dataset.y = posInit[index].y;
                g.dataset.rot = 0;
                g.dataset.flip = 1;
                g.setAttribute("transform", `translate(${g.dataset.x}, ${g.dataset.y}) rotate(0, ${def.cx}, ${def.cy}) scale(1, 1)`);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", def.color);
                path.setAttribute("stroke", "rgba(0,0,0,0.2)");
                path.setAttribute("stroke-width", "2");

                g.appendChild(path);
                couche.appendChild(g);

                g.addEventListener("mousedown", startDrag);
                g.addEventListener("touchstart", startDrag, {passive: false});
            });
        }

        // --- 4. LE MOTEUR UNIFIÉ DRAG & DROP SVG ---
        let dragEl = null;
        let lastSelectedPiece = null;
        let offset = {x: 0, y: 0};
        const svg = document.getElementById("jeu-tangram");
        let aBouge = false;

        // Convertit les pixels de l'écran en mathématiques SVG
        function getMousePos(e) {
            let pt = svg.createSVGPoint();
            pt.x = e.clientX || (e.touches && e.touches[0].clientX);
            pt.y = e.clientY || (e.touches && e.touches[0].clientY);
            return pt.matrixTransform(svg.getScreenCTM().inverse());
        }

        function startDrag(e) {
            if(e.type === "touchstart") e.preventDefault();
            dragEl = e.currentTarget;
            lastSelectedPiece = dragEl;
            
            // Place la pièce au-dessus des autres visuellement
            dragEl.parentNode.appendChild(dragEl);
            
            // Effet visuel de sélection
            document.querySelectorAll('.piece-mobile').forEach(p => p.style.filter = "drop-shadow(2px 4px 6px rgba(0,0,0,0.4))");
            dragEl.style.filter = "drop-shadow(0px 0px 15px rgba(241,196,15,0.8))";

            let mousePos = getMousePos(e);
            let x = parseFloat(dragEl.dataset.x);
            let y = parseFloat(dragEl.dataset.y);
            
            offset.x = mousePos.x - x;
            offset.y = mousePos.y - y;
            aBouge = false;

            document.addEventListener("mousemove", drag);
            document.addEventListener("touchmove", drag, {passive: false});
            document.addEventListener("mouseup", endDrag);
            document.addEventListener("touchend", endDrag);
        }

        function drag(e) {
            if (!dragEl) return;
            e.preventDefault();
            let mousePos = getMousePos(e);
            let nx = mousePos.x - offset.x;
            let ny = mousePos.y - offset.y;

            // Détecter si on a bougé la souris (plus que 2 pixels)
            let dx = nx - parseFloat(dragEl.dataset.x);
            let dy = ny - parseFloat(dragEl.dataset.y);
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) aBouge = true;

            dragEl.dataset.x = nx;
            dragEl.dataset.y = ny;
            updateTransform(dragEl);
        }

        function endDrag(e) {
            if (!dragEl) return;
            
            // Si on a relâché sans bouger, c'est un clic = on tourne !
            if (!aBouge) {
                let rot = parseInt(dragEl.dataset.rot);
                dragEl.dataset.rot = (rot + 45) % 360;
                updateTransform(dragEl);
            }
            
            dragEl = null;
            document.removeEventListener("mousemove", drag);
            document.removeEventListener("touchmove", drag);
            document.removeEventListener("mouseup", endDrag);
            document.removeEventListener("touchend", endDrag);
        }

        function updateTransform(el) {
            let id = el.dataset.id;
            let def = defPiecesTangram.find(p => p.id === id);
            // La commande mathématique SVG absolue !
            el.setAttribute("transform", `translate(${el.dataset.x}, ${el.dataset.y}) rotate(${el.dataset.rot}, ${def.cx}, ${def.cy}) scale(${el.dataset.flip}, 1)`);
        }

        // --- 5. LES OUTILS ET BOUTONS ---
        function retournerPiece() {
            if (!lastSelectedPiece) {
                alert("Touche d'abord la pièce que tu veux retourner !");
                return;
            }
            let flip = parseInt(lastSelectedPiece.dataset.flip);
            lastSelectedPiece.dataset.flip = flip * -1;
            updateTransform(lastSelectedPiece);
        }

        function afficherIndice() {
            let listeIndices = document.querySelectorAll('.indice-piece:not(.visible)');
            if (listeIndices.length > 0) {
                let indiceHasard = listeIndices[Math.floor(Math.random() * listeIndices.length)];
                indiceHasard.classList.add('visible');
                indicesAffiches++;
            } else {
                alert("Tous les indices sont déjà affichés !");
            }
        }

        function reinitialiserPieces() {
            genererPiecesMobiles();
            document.querySelectorAll('.indice-piece.visible').forEach(ind => ind.classList.remove('visible'));
            indicesAffiches = 0;
            lastSelectedPiece = null;
        }

        function validerNiveau() {
            let gainXP = 50 - (indicesAffiches * 5); 
            if (gainXP < 10) gainXP = 10; 
            
            alert(`🎉 Super ! Tu as terminé : ${niveauActuel.nom} !\n\nRécompense simulée : +${gainXP} XP (Tu as utilisé ${indicesAffiches} indices).`);
            
            niveauActuelIdx++;
            if (niveauActuelIdx >= niveauxTangram.length) {
                alert("🏆 Incroyable, tu as fini tous les niveaux du Tangram ! Le jeu recommence.");
                niveauActuelIdx = 0;
            }
            chargerNiveau();
        }

        document.addEventListener("DOMContentLoaded", chargerNiveau);
    </script>
</body>
</html>
