<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Tangram - Édition Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Nunito', sans-serif; background: #0f172a; color: #f8fafc; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; 
            user-select: none; touch-action: none; overflow: hidden;
        }
        
        /* En-tête et Navigation */
        .top-nav { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-quit { background: #e74c3c; color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 #c0392b; transition: 0.1s; display: inline-flex; align-items: center; gap: 8px;}
        .btn-quit:active { transform: translateY(4px); box-shadow: none; }
        
        h1 { color: #38bdf8; font-weight: 900; margin: 0; font-size: 2.2rem;}
        
        #hud-niveau { font-size: 1.4rem; font-weight: 900; color: #2dd4bf; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px;}

        /* Barre d'outils */
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; justify-content: center; align-items: center;}
        .btn { padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.1s; font-size: 1rem; border: none; font-family: 'Nunito', sans-serif;}
        .btn:active { transform: translateY(4px); box-shadow: none !important; }
        
        .btn-action { background: #8b5cf6; color: white; box-shadow: 0 4px 0 #7c3aed;}
        .btn-outil { background: #334155; color: white; box-shadow: 0 4px 0 #1e293b;}
        .btn-aide { background: #f59e0b; color: white; box-shadow: 0 4px 0 #d97706;}
        .btn-menu { background: #2ecc71; color: white; box-shadow: 0 4px 0 #27ae60; font-size: 1.2rem;}

        .consigne { font-weight: bold; color: #fcd34d; margin-bottom: 10px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 12px; text-align: center; font-size: 0.95rem;}
        
        /* Le plateau de jeu SVG */
        .plateau-container {
            width: 100%; max-width: 900px; height: 55vh; background: #f1f5f9; border-radius: 20px; 
            border: 6px solid #cbd5e1; box-shadow: inset 0 0 30px rgba(0,0,0,0.1), 0 15px 35px rgba(0,0,0,0.3);
            margin-bottom: 20px; overflow: hidden; position: relative;
        }
        #jeu-tangram { width: 100%; height: 100%; display: block; }

        .piece-mobile { cursor: grab; transition: filter 0.2s; filter: drop-shadow(3px 6px 8px rgba(0,0,0,0.4)); }
        .piece-mobile:active { cursor: grabbing; filter: drop-shadow(6px 12px 16px rgba(0,0,0,0.5)); }
        .piece-mobile.selectionnee path { stroke: #fbbf24; stroke-width: 6; }

        .indice-piece { opacity: 0; transition: opacity 0.5s ease; }
        .indice-piece.visible { opacity: 1; }

        /* Le Menu des Niveaux (Modale) */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #f8fafc; padding: 30px; border-radius: 20px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .modal h2 { color: #0f172a; font-size: 2rem; margin-bottom: 20px; font-weight: 900;}
        .grille-niveaux { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .btn-niveau { background: #38bdf8; color: white; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; border: none; box-shadow: 0 4px 0 #0284c7; transition: 0.1s;}
        .btn-niveau:active { transform: translateY(4px); box-shadow: none; }
        
        .btn-dev { background: #e74c3c; color: white; display: none; margin-top:10px; width:100%;}
    </style>
</head>
<body>

    <div class="top-nav">
        <h1>Le Tangram 🔺</h1>
        <a href="index.html" class="btn-quit">🏠 Quitter</a>
    </div>

    <div id="hud-niveau">Niveau 1 : Le Grand Carré</div>

    <div class="consigne">
        👉 <strong>Touche</strong> une pièce pour la sélectionner (en jaune). <br>
        👉 <strong>Tourne-la</strong> ou <strong>Retourne-la</strong>, puis glisse-la sur l'ombre !
    </div>

    <div class="toolbar">
        <button class="btn btn-menu" onclick="ouvrirMenuNiveaux()">📋 Les Défis</button>
        <div style="width: 10px;"></div>
        <button class="btn btn-action" onclick="tournerPiece()">↻ Tourner</button>
        <button class="btn btn-action" onclick="retournerPiece()">🪞 Miroir</button>
        <button class="btn btn-outil" onclick="reinitialiserPieces()">🔄 Ranger</button>
        <button class="btn btn-aide" id="btn-indice" onclick="afficherIndice()">💡 Indice</button>
    </div>

    <div class="plateau-container">
        <svg id="jeu-tangram" viewBox="0 0 1000 850" preserveAspectRatio="xMidYMid meet">
            <g id="couche-ombre"></g>
            <g id="couche-indices"></g>
            <g id="couche-pieces"></g>
        </svg>
    </div>

    <button class="btn btn-dev" id="btn-export" onclick="exporterNiveauDev()">🛠️ Générer le Code du Niveau Créé</button>

    <!-- Menu de sélection des niveaux -->
    <div id="overlay-niveaux" class="overlay">
        <div class="modal">
            <h2>Choisis un Défi 🧩</h2>
            <div class="grille-niveaux" id="liste-niveaux"></div>
            <button class="btn btn-outil" style="margin-top: 25px; width: 100%;" onclick="fermerMenuNiveaux()">Retour au jeu</button>
        </div>
    </div>

    <!-- Zone pour copier le code (Mode Dev) -->
    <div id="code-export-zone" class="overlay">
        <div class="modal">
            <h3 style="color:#0284c7;">Code généré :</h3>
            <textarea id="code-export-text" style="width: 100%; height: 200px; font-family: monospace;"></textarea>
            <button class="btn btn-menu" style="margin-top:10px; width: 100%;" onclick="document.getElementById('code-export-zone').style.display='none'">Fermer</button>
        </div>
    </div>

    <script>
        // --- 1. DÉFINITION GÉOMÉTRIQUE PURE ---
        const defPiecesTangram = [
            { id: "gros1",  color: "#ef4444", path: "M -200 -100 L 200 -100 L 0 100 Z", cx: 0, cy: 0 },
            { id: "gros2",  color: "#3b82f6", path: "M -100 -200 L -100 200 L 100 0 Z", cx: 0, cy: 0 },
            { id: "moyen",  color: "#10b981", path: "M 100 100 L -100 100 L 100 -100 Z", cx: 0, cy: 0 }, 
            { id: "carre",  color: "#f59e0b", path: "M -100 0 L 0 -100 L 100 0 L 0 100 Z", cx: 0, cy: 0 },
            { id: "petit1", color: "#eab308", path: "M -50 -100 L 50 0 L -50 100 Z", cx: 0, cy: 0 },
            { id: "petit2", color: "#d946ef", path: "M -50 0 L 50 -100 L 50 100 Z", cx: 0, cy: 0 },
            { id: "para",   color: "#14b8a6", path: "M -150 50 L 50 50 L 150 -50 L -50 -50 Z", cx: 0, cy: 0 }
        ];

        // --- 2. BASE DE DONNÉES CORRIGÉE ---
        const niveauxTangram = [
            {
                nom: "Le Grand Carré",
                solution: [
                    { id: "gros1",  x: 500, y: 200, rot: 0, flip: 1 },
                    { id: "gros2",  x: 400, y: 300, rot: 0, flip: 1 },
                    { id: "moyen",  x: 600, y: 400, rot: 0, flip: 1 },
                    { id: "carre",  x: 600, y: 300, rot: 0, flip: 1 },
                    { id: "petit1", x: 500, y: 350, rot: 270, flip: 1 }, // LA CORRECTION DU TROU BLANC EST ICI
                    { id: "petit2", x: 650, y: 200, rot: 0, flip: 1 },
                    { id: "para",   x: 450, y: 450, rot: 0, flip: 1 }
                ]
            },
            {
                nom: "Le Bateau",
                solution: [
                    { id: "gros1", x: 450, y: 200, rot: 90, flip: 1 },
                    { id: "gros2", x: 300, y: 200, rot: 0, flip: 1 },
                    { id: "moyen", x: 450, y: 450, rot: -45, flip: 1 },
                    { id: "carre", x: 350, y: 500, rot: 45, flip: 1 },
                    { id: "petit1", x: 450, y: 150, rot: 0, flip: 1 },
                    { id: "petit2", x: 600, y: 450, rot: 180, flip: 1 },
                    { id: "para", x: 250, y: 450, rot: 0, flip: 1 }
                ]
            },
            {
                nom: "La Maison",
                solution: [
                    { id: "gros1", x: 500, y: 300, rot: 0, flip: 1 },
                    { id: "gros2", x: 300, y: 400, rot: 0, flip: 1 },
                    { id: "moyen", x: 700, y: 400, rot: 0, flip: 1 },
                    { id: "carre", x: 500, y: 400, rot: 0, flip: 1 },
                    { id: "petit1", x: 600, y: 100, rot: 0, flip: 1 },
                    { id: "petit2", x: 400, y: 100, rot: 0, flip: 1 },
                    { id: "para", x: 550, y: 550, rot: 0, flip: 1 }
                ]
            },
            {
                nom: "La Montagne",
                solution: [
                    { id: "gros1", x: 400, y: 400, rot: -45, flip: 1 },
                    { id: "gros2", x: 600, y: 400, rot: -135, flip: 1 },
                    { id: "moyen", x: 500, y: 250, rot: 45, flip: 1 },
                    { id: "carre", x: 500, y: 475, rot: 45, flip: 1 },
                    { id: "petit1", x: 300, y: 450, rot: -45, flip: 1 },
                    { id: "petit2", x: 700, y: 450, rot: -135, flip: 1 },
                    { id: "para", x: 500, y: 550, rot: 0, flip: 1 }
                ]
            },
            {
                nom: "Le Poisson",
                solution: [
                    { id: "gros1", x: 500, y: 300, rot: 135, flip: 1 },
                    { id: "gros2", x: 500, y: 300, rot: -135, flip: 1 },
                    { id: "moyen", x: 300, y: 300, rot: -45, flip: 1 },
                    { id: "carre", x: 650, y: 300, rot: 45, flip: 1 },
                    { id: "para", x: 750, y: 250, rot: -45, flip: 1 },
                    { id: "petit1", x: 750, y: 350, rot: 45, flip: 1 },
                    { id: "petit2", x: 200, y: 300, rot: -45, flip: 1 }
                ]
            },
            {
                nom: "Le Petit Chat",
                solution: [
                    { id: "gros1", x: 500, y: 400, rot: 135, flip: 1 },
                    { id: "gros2", x: 500, y: 400, rot: 45, flip: 1 },
                    { id: "moyen", x: 700, y: 500, rot: 45, flip: 1 },
                    { id: "carre", x: 300, y: 250, rot: 45, flip: 1 },
                    { id: "petit1", x: 250, y: 150, rot: 135, flip: 1 },
                    { id: "petit2", x: 350, y: 150, rot: -45, flip: 1 },
                    { id: "para", x: 650, y: 650, rot: 45, flip: 1 }
                ]
            }
        ];

        let niveauActuelIdx = 0;
        let niveauActuel = niveauxTangram[0];
        let indicesAffiches = 0;

        // --- 3. MENUS ET GÉNÉRATION GRAPHIQUE ---
        function ouvrirMenuNiveaux() {
            const liste = document.getElementById('liste-niveaux');
            liste.innerHTML = "";
            niveauxTangram.forEach((niv, index) => {
                let btn = document.createElement('button');
                btn.className = "btn-niveau";
                btn.textContent = `${index + 1}. ${niv.nom}`;
                btn.onclick = () => { niveauActuelIdx = index; fermerMenuNiveaux(); chargerNiveau(); };
                liste.appendChild(btn);
            });
            document.getElementById('overlay-niveaux').style.display = 'flex';
        }

        function fermerMenuNiveaux() { document.getElementById('overlay-niveaux').style.display = 'none'; }

        function chargerNiveau() {
            niveauActuel = niveauxTangram[niveauActuelIdx];
            document.getElementById('hud-niveau').textContent = `Défi ${niveauActuelIdx + 1} : ${niveauActuel.nom}`;
            indicesAffiches = 0;
            lastSelectedPiece = null;
            
            if (localStorage.getItem('modeDev') === 'actif') {
                document.getElementById("couche-ombre").innerHTML = "";
                document.getElementById("couche-indices").innerHTML = "";
                document.getElementById("btn-indice").style.display = "none";
            } else {
                dessinerOmbreMagique();
                dessinerIndices();
                document.getElementById("btn-indice").style.display = "inline-flex";
            }
            genererPiecesMobiles();
        }

        function dessinerOmbreMagique() {
            const couche = document.getElementById("couche-ombre");
            couche.innerHTML = "";
            niveauActuel.solution.forEach(sol => {
                const def = defPiecesTangram.find(p => p.id === sol.id);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", "#334155");
                path.setAttribute("stroke", "#334155");
                path.setAttribute("stroke-width", "8"); // Soude l'ombre pour la rendre solide
                path.setAttribute("stroke-linejoin", "round");
                path.setAttribute("transform", `translate(${sol.x}, ${sol.y}) rotate(${sol.rot}, ${def.cx}, ${def.cy}) scale(${sol.flip}, 1)`);
                couche.appendChild(path);
            });
        }

        function dessinerIndices() {
            const couche = document.getElementById("couche-indices");
            couche.innerHTML = "";
            niveauActuel.solution.forEach(sol => {
                const def = defPiecesTangram.find(p => p.id === sol.id);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", "rgba(56, 189, 248, 0.4)");
                path.setAttribute("stroke", "#38bdf8");
                path.setAttribute("stroke-width", "2");
                path.setAttribute("class", "indice-piece");
                path.setAttribute("id", `indice-${sol.id}`);
                path.setAttribute("transform", `translate(${sol.x}, ${sol.y}) rotate(${sol.rot}, ${def.cx}, ${def.cy}) scale(${sol.flip}, 1)`);
                couche.appendChild(path);
            });
        }

        function genererPiecesMobiles() {
            const couche = document.getElementById("couche-pieces");
            couche.innerHTML = "";
            
            const posInit = [
                {x: 100, y: 720}, {x: 230, y: 720}, {x: 360, y: 720},
                {x: 490, y: 720}, {x: 620, y: 720}, {x: 750, y: 720}, {x: 880, y: 720}
            ];
            let positionsMelangees = [...posInit].sort(() => Math.random() - 0.5);

            defPiecesTangram.forEach((def, index) => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "piece-mobile");
                g.dataset.id = def.id;
                g.dataset.x = positionsMelangees[index].x;
                g.dataset.y = positionsMelangees[index].y;
                g.dataset.rot = 0;
                g.dataset.flip = 1;
                g.dataset.snapped = "false";
                g.dataset.snappedTo = "";
                
                g.setAttribute("transform", `translate(${g.dataset.x}, ${g.dataset.y}) rotate(0, ${def.cx}, ${def.cy}) scale(1, 1)`);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", def.color);
                path.setAttribute("stroke", "rgba(0,0,0,0.1)");
                path.setAttribute("stroke-width", "2");

                g.appendChild(path);
                couche.appendChild(g);

                g.addEventListener("mousedown", startDrag);
                g.addEventListener("touchstart", startDrag, {passive: false});
            });
        }

        // --- 4. LE MOTEUR UNIFIÉ DRAG & DROP & SNAP ---
        let dragEl = null;
        let lastSelectedPiece = null;
        let offset = {x: 0, y: 0};
        const svg = document.getElementById("jeu-tangram");

        function getMousePos(e) {
            let pt = svg.createSVGPoint();
            pt.x = e.clientX || (e.touches && e.touches[0].clientX);
            pt.y = e.clientY || (e.touches && e.touches[0].clientY);
            return pt.matrixTransform(svg.getScreenCTM().inverse());
        }

        function selectPiece(el) {
            if (lastSelectedPiece) lastSelectedPiece.classList.remove('selectionnee');
            lastSelectedPiece = el;
            lastSelectedPiece.classList.add('selectionnee');
            el.parentNode.appendChild(el);
        }

        function startDrag(e) {
            if(e.type === "touchstart") e.preventDefault();
            dragEl = e.currentTarget;
            selectPiece(dragEl);
            dragEl.dataset.snapped = "false";
            dragEl.dataset.snappedTo = "";

            let mousePos = getMousePos(e);
            let x = parseFloat(dragEl.dataset.x);
            let y = parseFloat(dragEl.dataset.y);
            
            offset.x = mousePos.x - x;
            offset.y = mousePos.y - y;

            document.addEventListener("mousemove", drag);
            document.addEventListener("touchmove", drag, {passive: false});
            document.addEventListener("mouseup", endDrag);
            document.addEventListener("touchend", endDrag);
        }

        function drag(e) {
            if (!dragEl) return;
            e.preventDefault();
            let mousePos = getMousePos(e);
            dragEl.dataset.x = mousePos.x - offset.x;
            dragEl.dataset.y = mousePos.y - offset.y;
            updateTransform(dragEl);
        }

        function endDrag(e) {
            if (!dragEl) return;
            if (localStorage.getItem('modeDev') !== 'actif') verifierMagnetisme(dragEl);
            
            dragEl = null;
            document.removeEventListener("mousemove", drag);
            document.removeEventListener("touchmove", drag);
            document.removeEventListener("mouseup", endDrag);
            document.removeEventListener("touchend", endDrag);
        }

        function updateTransform(el) {
            let def = defPiecesTangram.find(p => p.id === el.dataset.id);
            el.setAttribute("transform", `translate(${el.dataset.x}, ${el.dataset.y}) rotate(${el.dataset.rot}, ${def.cx}, ${def.cy}) scale(${el.dataset.flip}, 1)`);
        }

        // --- 5. LOGIQUE D'INTERCHANGEABILITÉ ---
        function verifierMagnetisme(el) {
            // L'ordinateur sait maintenant que gros1 et gros2, ou petit1 et petit2 sont les mêmes formes !
            let typesEquivalents = [el.dataset.id];
            if (el.dataset.id === "gros1" || el.dataset.id === "gros2") typesEquivalents = ["gros1", "gros2"];
            if (el.dataset.id === "petit1" || el.dataset.id === "petit2") typesEquivalents = ["petit1", "petit2"];

            let aTrouvePlace = false;

            for (let tid of typesEquivalents) {
                let sol = niveauActuel.solution.find(s => s.id === tid);
                if (!sol) continue;

                let dist = Math.hypot(parseFloat(el.dataset.x) - sol.x, parseFloat(el.dataset.y) - sol.y);
                let r1 = (parseInt(el.dataset.rot) % 360 + 360) % 360;
                let r2 = (sol.rot % 360 + 360) % 360;
                let f1 = parseInt(el.dataset.flip);
                
                // Calcul intelligent de la rotation si l'enfant a interverti des pièces
                let r_expected = r2;
                if (el.dataset.id === "gros2" && tid === "gros1") r_expected = (r2 + 90) % 360;
                if (el.dataset.id === "gros1" && tid === "gros2") r_expected = (r2 + 270) % 360;
                if (el.dataset.id === "petit2" && tid === "petit1") r_expected = (r2 + 180) % 360;
                if (el.dataset.id === "petit1" && tid === "petit2") r_expected = (r2 + 180) % 360;

                let rotMatch = false;
                if (el.dataset.id === 'carre') { rotMatch = (r1 % 90 === r_expected % 90); } 
                else if (el.dataset.id === 'para') { rotMatch = (f1 === sol.flip && r1 % 180 === r_expected % 180); } 
                else { rotMatch = (r1 === r_expected); } 

                if (dist < 60 && rotMatch) {
                    let slotPris = Array.from(document.querySelectorAll('.piece-mobile')).some(p => p !== el && p.dataset.snappedTo === tid);
                    
                    if (!slotPris) {
                        el.dataset.x = sol.x; el.dataset.y = sol.y; el.dataset.rot = r1; 
                        el.dataset.flip = f1; el.dataset.snapped = "true"; el.dataset.snappedTo = tid;
                        updateTransform(el);
                        aTrouvePlace = true;
                        verifierVictoire();
                        break;
                    }
                }
            }
            if (!aTrouvePlace) { el.dataset.snapped = "false"; el.dataset.snappedTo = ""; }
        }

        function verifierVictoire() {
            let pieces = document.querySelectorAll('.piece-mobile');
            let toutesPlacees = true;
            pieces.forEach(p => { if (p.dataset.snapped === "false") toutesPlacees = false; });

            if (toutesPlacees) {
                let gainXP = 50 - (indicesAffiches * 5); 
                if (gainXP < 10) gainXP = 10; 
                
                setTimeout(() => {
                    alert(`🎉 Super ! L'ombre est parfaite !\n\nRécompense simulée : +${gainXP} XP`);
                    niveauActuelIdx++;
                    if (niveauActuelIdx >= niveauxTangram.length) niveauActuelIdx = 0;
                    chargerNiveau();
                }, 500); 
            }
        }

        function tournerPiece() {
            if (!lastSelectedPiece) return alert("Touche d'abord une pièce pour la sélectionner !");
            let rot = parseInt(lastSelectedPiece.dataset.rot);
            lastSelectedPiece.dataset.rot = (rot + 45) % 360;
            lastSelectedPiece.dataset.snapped = "false"; lastSelectedPiece.dataset.snappedTo = "";
            updateTransform(lastSelectedPiece);
            if (localStorage.getItem('modeDev') !== 'actif') verifierMagnetisme(lastSelectedPiece);
        }

        function retournerPiece() {
            if (!lastSelectedPiece) return alert("Touche d'abord une pièce pour la sélectionner !");
            if (lastSelectedPiece.dataset.id !== 'para') return alert("Seul le parallélogramme (la pièce verte) a besoin d'être retourné !");
            
            let flip = parseInt(lastSelectedPiece.dataset.flip);
            lastSelectedPiece.dataset.flip = flip * -1;
            lastSelectedPiece.dataset.snapped = "false"; lastSelectedPiece.dataset.snappedTo = "";
            updateTransform(lastSelectedPiece);
            if (localStorage.getItem('modeDev') !== 'actif') verifierMagnetisme(lastSelectedPiece);
        }

        function afficherIndice() {
            let listeIndices = document.querySelectorAll('.indice-piece:not(.visible)');
            if (listeIndices.length > 0) {
                let indiceHasard = listeIndices[Math.floor(Math.random() * listeIndices.length)];
                indiceHasard.classList.add('visible');
                indicesAffiches++;
            } else { alert("Tous les indices sont déjà affichés !"); }
        }

        function reinitialiserPieces() { chargerNiveau(); }

        // --- 7. MODE CRÉATEUR DE NIVEAUX ---
        function verifierModeDev() {
            if (localStorage.getItem('modeDev') === 'actif') {
                document.getElementById('btn-export').style.display = 'block';
                document.getElementById('hud-niveau').textContent = "🛠️ CRÉATION DE NIVEAU";
            }
        }

        function exporterNiveauDev() {
            let code = `{\n  nom: "Nouveau Défi",\n  solution: [\n`;
            document.querySelectorAll('.piece-mobile').forEach(p => {
                let cleanX = Math.round(parseFloat(p.dataset.x) / 25) * 25;
                let cleanY = Math.round(parseFloat(p.dataset.y) / 25) * 25;
                code += `    { id: "${p.dataset.id}", x: ${cleanX}, y: ${cleanY}, rot: ${p.dataset.rot}, flip: ${p.dataset.flip} },\n`;
            });
            code += `  ]\n}`;
            document.getElementById('code-export-text').value = code;
            document.getElementById('code-export-zone').style.display = 'flex';
        }
