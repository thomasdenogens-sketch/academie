<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Tangram - Édition Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Nunito', sans-serif; background: #0f172a; color: #f8fafc; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; 
            user-select: none; touch-action: none; overflow: hidden;
        }
        
        .top-nav { width: 100%; max-width: 950px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 10px; }
        .btn-quit { background: #e74c3c; color: white; padding: 10px 18px; border-radius: 12px; font-weight: 900; text-decoration: none; box-shadow: 0 4px 0 #c0392b; transition: 0.1s; display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; }
        .btn-quit:active { transform: translateY(4px); box-shadow: none; }
        
        h1 { color: #38bdf8; font-weight: 900; font-size: 2.2rem; margin: 0;}
        #hud-niveau { font-size: 1.3rem; font-weight: 900; color: #2dd4bf; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1.5px;}

        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; justify-content: center; align-items: center;}
        .btn { padding: 10px 16px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.1s; font-size: 0.95rem; border: none; font-family: 'Nunito', sans-serif; display: inline-flex; align-items: center; gap: 6px;}
        .btn:active { transform: translateY(3px); box-shadow: none !important; }
        
        .btn-menu { background: #10b981; color: white; box-shadow: 0 4px 0 #059669; }
        .btn-action { background: #8b5cf6; color: white; box-shadow: 0 4px 0 #7c3aed; }
        .btn-outil { background: #334155; color: white; box-shadow: 0 4px 0 #1e293b; }
        .btn-aide { background: #f59e0b; color: white; box-shadow: 0 4px 0 #d97706; }
        .btn-dev-toggle { background: #64748b; color: white; box-shadow: 0 4px 0 #475569; }
        .btn-dev-toggle.actif { background: #ef4444; box-shadow: 0 4px 0 #b91c1c; }

        .consigne { font-weight: 700; color: #fcd34d; margin-bottom: 10px; background: rgba(255,255,255,0.08); padding: 8px 18px; border-radius: 10px; text-align: center; font-size: 0.9rem;}
        
        .plateau-container {
            width: 100%; max-width: 950px; height: 58vh; background: #f8fafc; border-radius: 20px; 
            border: 6px solid #cbd5e1; box-shadow: inset 0 0 25px rgba(0,0,0,0.08), 0 15px 35px rgba(0,0,0,0.3);
            margin-bottom: 10px; overflow: hidden; position: relative;
        }
        #jeu-tangram { width: 100%; height: 100%; display: block; }

        .piece-mobile { cursor: grab; filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.35)); }
        .piece-mobile:active { cursor: grabbing; filter: drop-shadow(6px 10px 14px rgba(0,0,0,0.45)); }
        .piece-mobile.selectionnee path { stroke: #fbbf24; stroke-width: 6; }

        .indice-piece { opacity: 0; transition: opacity 0.4s ease; }
        .indice-piece.visible { opacity: 1; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #ffffff; padding: 25px; border-radius: 20px; width: 90%; max-width: 650px; max-height: 80vh; overflow-y: auto; text-align: center; }
        .modal h2 { color: #0f172a; font-size: 1.8rem; margin-bottom: 15px; font-weight: 900;}
        .grille-niveaux { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .btn-choix-niveau { background: #38bdf8; color: white; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; border: none; box-shadow: 0 4px 0 #0284c7; }
        .btn-choix-niveau:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1>Le Tangram 🔺</h1>
        <a href="index.html" class="btn-quit">🏠 Quitter</a>
    </div>

    <div id="hud-niveau">Niveau 1 : Le Grand Carré</div>

    <div class="consigne" id="ui-consigne">
        👉 Sélectionne une pièce (contour jaune). Tourne-la ou utilise le mode Miroir, puis emboîte-la sur l'ombre !
    </div>

    <div class="toolbar">
        <button class="btn btn-menu" onclick="ouvrirMenuNiveaux()">📋 Les Défis</button>
        <button class="btn btn-action" onclick="tournerPiece()">↻ Tourner (45°)</button>
        <button class="btn btn-action" onclick="retournerPiece()">🪞 Miroir</button>
        <button class="btn btn-outil" onclick="reinitialiserPieces()">🔄 Ranger</button>
        <button class="btn btn-aide" id="btn-indice" onclick="afficherIndice()">💡 Indice</button>
        <button class="btn btn-dev-toggle" id="btn-mode-dev" onclick="basculerModeDev()">🛠️ Mode Créateur</button>
        <button class="btn btn-action" id="btn-export-dev" style="display:none; background:#e11d48;" onclick="exporterNiveauDev()">💾 Exporter Code</button>
    </div>

    <div class="plateau-container">
        <svg id="jeu-tangram" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet">
            <g id="couche-ombre"></g>
            <g id="couche-indices"></g>
            <g id="couche-pieces"></g>
        </svg>
    </div>

    <div id="overlay-niveaux" class="overlay">
        <div class="modal">
            <h2>Choisis ta Figure 🧩</h2>
            <div class="grille-niveaux" id="liste-niveaux"></div>
            <button class="btn btn-outil" style="margin-top: 20px; width: 100%;" onclick="fermerMenuNiveaux()">Fermer</button>
        </div>
    </div>

    <div id="code-export-zone" class="overlay">
        <div class="modal">
            <h2 style="color:#0284c7;">Code du modèle créé :</h2>
            <textarea id="code-export-text" style="width:100%; height:180px; font-family:monospace; padding:10px; border-radius:8px; border:2px solid #cbd5e1;"></textarea>
            <button class="btn btn-menu" style="margin-top:10px; width: 100%;" onclick="document.getElementById('code-export-zone').style.display='none'">Fermer</button>
        </div>
    </div>

    <script>
        const defPiecesTangram = [
            { id: "gros1",  type: "grand_triangle", color: "#ef4444", path: "M -200 -100 L 200 -100 L 0 100 Z", cx: 0, cy: 0 },
            { id: "gros2",  type: "grand_triangle", color: "#3b82f6", path: "M -200 -100 L 200 -100 L 0 100 Z", cx: 0, cy: 0 },
            { id: "moyen",  type: "moyen_triangle", color: "#10b981", path: "M 100 100 L -100 100 L 100 -100 Z", cx: 0, cy: 0 }, 
            { id: "carre",  type: "carre",          color: "#f59e0b", path: "M -100 0 L 0 -100 L 100 0 L 0 100 Z", cx: 0, cy: 0 },
            { id: "petit1", type: "petit_triangle", color: "#eab308", path: "M -100 -50 L 100 -50 L 0 50 Z", cx: 0, cy: 0 },
            { id: "petit2", type: "petit_triangle", color: "#d946ef", path: "M -100 -50 L 100 -50 L 0 50 Z", cx: 0, cy: 0 },
            { id: "para",   type: "parallelogramme",color: "#14b8a6", path: "M -150 50 L 50 50 L 150 -50 L -50 -50 Z", cx: 0, cy: 0 }
        ];

        // BASE DE DONNÉES DE 12 NIVEAUX MATHÉMATIQUEMENT PARFAITS
        const niveauxTangram = [
            {
                nom: "Le Grand Carré",
                solution: [
                    { id: "gros1",  x: 500, y: 200, rot: 0,   flip: 1 },
                    { id: "gros2",  x: 400, y: 300, rot: 270, flip: 1 },
                    { id: "moyen",  x: 600, y: 400, rot: 0,   flip: 1 },
                    { id: "carre",  x: 500, y: 400, rot: 0,   flip: 1 },
                    { id: "petit1", x: 400, y: 450, rot: 180, flip: 1 }, 
                    { id: "petit2", x: 550, y: 300, rot: 90,  flip: 1 },
                    { id: "para",   x: 650, y: 250, rot: 90,  flip: -1 }
                ]
            },
            {
              nom: "Sablier",
                  solution: [
                    { id: "para", x: 475, y: 750, rot: 0, flip: 1 },
                    { id: "petit2", x: 625, y: 750, rot: 180, flip: 1 },
                    { id: "moyen", x: 525, y: 600, rot: 0, flip: 1 },
                    { id: "carre", x: 425, y: 600, rot: 0, flip: 1 },
                    { id: "gros2", x: 600, y: 375, rot: 135, flip: 1 },
                    { id: "gros1", x: 450, y: 375, rot: 225, flip: 1 },
                    { id: "petit1", x: 675, y: 600, rot: 270, flip: 1 },
                  ]
                },
                {
                  nom: "Sapin 1",
                  solution: [
                    { id: "gros1", x: 524.6, y: 574.5, rot: 45, flip: 1 },
                    { id: "gros2", x: 507.4, y: 264.3, rot: 180, flip: 1 },
                    { id: "moyen", x: 509.2, y: 162.9, rot: 225, flip: 1 },
                    { id: "para", x: 598.3, y: 434.8, rot: 45, flip: 1 },
                    { id: "petit1", x: 416.4, y: 608.3, rot: 315, flip: 1 },
                    { id: "petit2", x: 416.9, y: 465.7, rot: 315, flip: 1 },
                    { id: "carre", x: 525.9, y: 715.6, rot: 45, flip: 1 },
                  ]
                },
                        {
              nom: "Sapin 2",
              solution: [
                { id: "carre", x: 525.9, y: 715.6, rot: 45, flip: 1 },
                { id: "petit2", x: 418.4, y: 476.0, rot: 135, flip: 1 },
                { id: "petit1", x: 345.9, y: 546.5, rot: 315, flip: 1 },
                { id: "gros1", x: 524.6, y: 543.6, rot: 180, flip: 1 },
                { id: "moyen", x: 515.1, y: 237.8, rot: 225, flip: 1 },
                { id: "gros2", x: 514.7, y: 339.3, rot: 180, flip: 1 },
                { id: "para", x: 667.4, y: 514.2, rot: 45, flip: 1 },
              ]
            },
                      {
                  nom: "Pyramide",
                  solution: [
                    { id: "para", x: 395.5, y: 440.7, rot: 0, flip: -1 },
                    { id: "moyen", x: 342.8, y: 289.3, rot: 0, flip: 1 },
                    { id: "petit2", x: 490.6, y: 293.7, rot: 270, flip: 1 },
                    { id: "carre", x: 541.8, y: 387.8, rot: 0, flip: 1 },
                    { id: "gros1", x: 242.3, y: 489.2, rot: 180, flip: 1 },
                    { id: "gros2", x: 643.0, y: 489.2, rot: 180, flip: 1 },
                    { id: "petit1", x: 441.4, y: 537.7, rot: 0, flip: 1 },
                  ]
                    }
        ];

        let niveauActuelIdx = 0;
        let niveauActuel = niveauxTangram[0];
        let indicesAffiches = 0;
        let modeDevActif = false;

        function ouvrirMenuNiveaux() {
            const liste = document.getElementById('liste-niveaux');
            liste.innerHTML = "";
            niveauxTangram.forEach((niv, index) => {
                let btn = document.createElement('button');
                btn.className = "btn-choix-niveau";
                btn.textContent = `${index + 1}. ${niv.nom}`;
                btn.onclick = () => { niveauActuelIdx = index; fermerMenuNiveaux(); chargerNiveau(); };
                liste.appendChild(btn);
            });
            document.getElementById('overlay-niveaux').style.display = 'flex';
        }

        function fermerMenuNiveaux() { document.getElementById('overlay-niveaux').style.display = 'none'; }

        function chargerNiveau() {
            niveauActuel = niveauxTangram[niveauActuelIdx];
            document.getElementById('hud-niveau').textContent = `Défi ${niveauActuelIdx + 1} : ${niveauActuel.nom}`;
            indicesAffiches = 0;
            lastSelectedPiece = null;
            
            if (modeDevActif) {
                document.getElementById("couche-ombre").innerHTML = "";
                document.getElementById("couche-indices").innerHTML = "";
                document.getElementById("btn-indice").style.display = "none";
            } else {
                dessinerOmbreMagique();
                dessinerIndices();
                document.getElementById("btn-indice").style.display = "inline-flex";
            }
            genererPiecesMobiles();
        }

        function dessinerOmbreMagique() {
            const couche = document.getElementById("couche-ombre");
            couche.innerHTML = "";
            niveauActuel.solution.forEach(sol => {
                const def = defPiecesTangram.find(p => p.id === sol.id);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", "#1e293b");
                path.setAttribute("stroke", "#1e293b");
                path.setAttribute("stroke-width", "8"); 
                path.setAttribute("stroke-linejoin", "round");
                path.setAttribute("transform", `translate(${sol.x}, ${sol.y}) rotate(${sol.rot}, ${def.cx}, ${def.cy}) scale(${sol.flip}, 1)`);
                couche.appendChild(path);
            });
        }

        function dessinerIndices() {
            const couche = document.getElementById("couche-indices");
            couche.innerHTML = "";
            niveauActuel.solution.forEach(sol => {
                const def = defPiecesTangram.find(p => p.id === sol.id);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", "rgba(56, 189, 248, 0.35)");
                path.setAttribute("stroke", "#0284c7");
                path.setAttribute("stroke-width", "2");
                path.setAttribute("class", "indice-piece");
                path.setAttribute("id", `indice-${sol.id}`);
                path.setAttribute("transform", `translate(${sol.x}, ${sol.y}) rotate(${sol.rot}, ${def.cx}, ${def.cy}) scale(${sol.flip}, 1)`);
                couche.appendChild(path);
            });
        }

        function genererPiecesMobiles() {
            const couche = document.getElementById("couche-pieces");
            couche.innerHTML = "";
            
            const posInit = [
                {x: 80,  y: 720}, {x: 210, y: 720}, {x: 340, y: 720},
                {x: 470, y: 720}, {x: 600, y: 720}, {x: 730, y: 720}, {x: 860, y: 720}
            ];
            let positionsMelangees = [...posInit].sort(() => Math.random() - 0.5);

            defPiecesTangram.forEach((def, index) => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "piece-mobile");
                g.dataset.id = def.id;
                g.dataset.type = def.type;
                g.dataset.x = positionsMelangees[index].x;
                g.dataset.y = positionsMelangees[index].y;
                g.dataset.rot = 0;
                g.dataset.flip = 1;
                g.dataset.snapped = "false";
                g.dataset.slotAssigne = "";
                
                g.setAttribute("transform", `translate(${g.dataset.x}, ${g.dataset.y}) rotate(0, ${def.cx}, ${def.cy}) scale(1, 1)`);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", def.path);
                path.setAttribute("fill", def.color);
                path.setAttribute("stroke", "rgba(0,0,0,0.15)");
                path.setAttribute("stroke-width", "2");

                g.appendChild(path);
                couche.appendChild(g);

                g.addEventListener("mousedown", startDrag);
                g.addEventListener("touchstart", startDrag, {passive: false});
            });
        }

        let dragEl = null;
        let lastSelectedPiece = null;
        let offset = {x: 0, y: 0};
        const svg = document.getElementById("jeu-tangram");

        function getMousePos(e) {
            let pt = svg.createSVGPoint();
            pt.x = e.clientX || (e.touches && e.touches[0].clientX);
            pt.y = e.clientY || (e.touches && e.touches[0].clientY);
            return pt.matrixTransform(svg.getScreenCTM().inverse());
        }

        function selectPiece(el) {
            if (lastSelectedPiece) lastSelectedPiece.classList.remove('selectionnee');
            lastSelectedPiece = el;
            lastSelectedPiece.classList.add('selectionnee');
            el.parentNode.appendChild(el); 
        }

        function startDrag(e) {
            if(e.type === "touchstart") e.preventDefault();
            dragEl = e.currentTarget;
            selectPiece(dragEl);
            
            dragEl.dataset.snapped = "false";
            dragEl.dataset.slotAssigne = "";

            let mousePos = getMousePos(e);
            let x = parseFloat(dragEl.dataset.x);
            let y = parseFloat(dragEl.dataset.y);
            
            offset.x = mousePos.x - x;
            offset.y = mousePos.y - y;

            document.addEventListener("mousemove", drag);
            document.addEventListener("touchmove", drag, {passive: false});
            document.addEventListener("mouseup", endDrag);
            document.addEventListener("touchend", endDrag);
        }

        function drag(e) {
            if (!dragEl) return;
            e.preventDefault();
            let mousePos = getMousePos(e);
            dragEl.dataset.x = mousePos.x - offset.x;
            dragEl.dataset.y = mousePos.y - offset.y;
            updateTransform(dragEl);
        }

        function endDrag(e) {
            if (!dragEl) return;
            
            // Si on est en mode Jeu (pas en mode Création), on vérifie le magnétisme !
            if (!modeDevActif) verifierMagnetisme(dragEl);
            
            dragEl = null;
            document.removeEventListener("mousemove", drag);
            document.removeEventListener("touchmove", drag);
            document.removeEventListener("mouseup", endDrag);
            document.removeEventListener("touchend", endDrag);
        }

        function updateTransform(el) {
            let def = defPiecesTangram.find(p => p.id === el.dataset.id);
            el.setAttribute("transform", `translate(${el.dataset.x}, ${el.dataset.y}) rotate(${el.dataset.rot}, ${def.cx}, ${def.cy}) scale(${el.dataset.flip}, 1)`);
        }

        function verifierMagnetisme(el) {
            let typePiece = el.dataset.type;
            let aTrouveSlot = false;

            for (let i = 0; i < niveauActuel.solution.length; i++) {
                let sol = niveauActuel.solution[i];
                let defSol = defPiecesTangram.find(p => p.id === sol.id);

                if (defSol.type !== typePiece) continue; 

                let dejaOccupe = Array.from(document.querySelectorAll('.piece-mobile'))
                    .some(p => p !== el && p.dataset.slotAssigne === String(i));
                if (dejaOccupe) continue;

                let dist = Math.hypot(parseFloat(el.dataset.x) - sol.x, parseFloat(el.dataset.y) - sol.y);
                let rPiece = (parseInt(el.dataset.rot) % 360 + 360) % 360;
                let rCible = (sol.rot % 360 + 360) % 360;
                let fPiece = parseInt(el.dataset.flip);
                let diffRot = Math.abs(rPiece - rCible) % 360;

                let orientationConforme = false;
                if (typePiece === "carre") {
                    orientationConforme = (diffRot % 90 === 0); 
                } else if (typePiece === "parallelogramme") {
                    orientationConforme = (fPiece === sol.flip && diffRot % 180 === 0); 
                } else {
                    orientationConforme = (diffRot === 0);
                }

                if (dist < 65 && orientationConforme) {
                    el.dataset.x = sol.x;
                    el.dataset.y = sol.y;
                    el.dataset.rot = sol.rot;
                    el.dataset.flip = sol.flip;
                    el.dataset.snapped = "true";
                    el.dataset.slotAssigne = String(i);
                    updateTransform(el);
                    aTrouveSlot = true;
                    verifierConditionVictoire();
                    break;
                }
            }

            if (!aTrouveSlot) {
                el.dataset.snapped = "false";
                el.dataset.slotAssigne = "";
            }
        }

        function verifierConditionVictoire() {
            let pieces = document.querySelectorAll('.piece-mobile');
            let victoire = Array.from(pieces).every(p => p.dataset.snapped === "true");

            if (victoire) {
                let gainXP = Math.max(10, 50 - (indicesAffiches * 5));
                setTimeout(() => {
                    alert(`🎉 Félicitations ! La silhouette est complète !\n\nScore : +${gainXP} XP`);
                    niveauActuelIdx = (niveauActuelIdx + 1) % niveauxTangram.length;
                    chargerNiveau();
                }, 400);
            }
        }

        function tournerPiece() {
            if (!lastSelectedPiece) return alert("Sélectionne d'abord une pièce en la touchant !");
            let rot = parseInt(lastSelectedPiece.dataset.rot);
            lastSelectedPiece.dataset.rot = (rot + 45) % 360;
            lastSelectedPiece.dataset.snapped = "false";
            lastSelectedPiece.dataset.slotAssigne = "";
            updateTransform(lastSelectedPiece);
            if (!modeDevActif) verifierMagnetisme(lastSelectedPiece);
        }

        function retournerPiece() {
            if (!lastSelectedPiece) return alert("Sélectionne d'abord une pièce en la touchant !");
            if (lastSelectedPiece.dataset.type !== "parallelogramme") {
                return alert("Seul le parallélogramme (la pièce turquoise) nécessite un retournement miroir !");
            }
            let flip = parseInt(lastSelectedPiece.dataset.flip);
            lastSelectedPiece.dataset.flip = flip * -1;
            lastSelectedPiece.dataset.snapped = "false";
            lastSelectedPiece.dataset.slotAssigne = "";
            updateTransform(lastSelectedPiece);
            if (!modeDevActif) verifierMagnetisme(lastSelectedPiece);
        }

        function afficherIndice() {
            let nonAffiches = Array.from(document.querySelectorAll('.indice-piece:not(.visible)'));
            if (nonAffiches.length > 0) {
                let tirage = nonAffiches[Math.floor(Math.random() * nonAffiches.length)];
                tirage.classList.add('visible');
                indicesAffiches++;
            } else {
                alert("Tous les indices de ce niveau sont déjà affichés !");
            }
        }

        function reinitialiserPieces() { chargerNiveau(); }

        // --- 7. OUTILS DU MODE CRÉATEUR ---
        function basculerModeDev() {
            modeDevActif = !modeDevActif;
            const btnDev = document.getElementById('btn-mode-dev');
            const btnExport = document.getElementById('btn-export-dev');
            const consigne = document.getElementById('ui-consigne');

            if (modeDevActif) {
                btnDev.classList.add('actif');
                btnDev.textContent = "Mode Jeu 🎮";
                btnExport.style.display = "inline-flex";
                consigne.innerHTML = "🛠️ <strong>MODE CRÉATEUR ACTIF :</strong> Assemble librement tes pièces. L'export se fera avec précision (1 décimale).";
            } else {
                btnDev.classList.remove('actif');
                btnDev.textContent = "🛠️ Mode Créateur";
                btnExport.style.display = "none";
                consigne.innerHTML = "👉 Sélectionne une pièce (contour jaune). Tourne-la ou utilise le mode Miroir, puis emboîte-la sur l'ombre !";
            }
            chargerNiveau();
        }

        // L'export a été corrigé pour utiliser des décimales précises au lieu d'arrondir !
        function exporterNiveauDev() {
            let nom = prompt("Nom de la figure créée :", "Nouvelle Figure") || "Défi Personnalisé";
            let code = `{\n  nom: "${nom}",\n  solution: [\n`;
            document.querySelectorAll('.piece-mobile').forEach(p => {
                let cleanX = parseFloat(p.dataset.x).toFixed(1);
                let cleanY = parseFloat(p.dataset.y).toFixed(1);
                code += `    { id: "${p.dataset.id}", x: ${cleanX}, y: ${cleanY}, rot: ${p.dataset.rot}, flip: ${p.dataset.flip} },\n`;
            });
            code += `  ]\n}`;
            document.getElementById('code-export-text').value = code;
            document.getElementById('code-export-zone').style.display = 'flex';
        }

        document.addEventListener("DOMContentLoaded", chargerNiveau);
    </script>
</body>
</html>
